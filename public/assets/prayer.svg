<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1610 2985" role="img" aria-label="Prayer" data-illustration-theme="light"><svg y="0" viewBox="0 0 1610 995" role="img" aria-labelledby="title-0 desc-0"><title id="title-0">Prayer</title><desc id="desc-0">3 English interface examples. Compare a church’s order of prayer, guided steps, intercession and silence with two proposed alternatives: returning to an inherited prayer, or carrying one intention toward an optional action before forgetting it. Counted prayer remains a warning case.</desc><rect width="1610" height="995" fill="#f6f9fa" /><g font-family="Arial, sans-serif"><text x="55" y="46" font-size="18" fill="#486078" font-weight="700">BIBLE AND FAITH APP DESIGN PATTERNS</text><text x="55" y="110" font-size="40" fill="#102c47" font-weight="700">Prayer</text><text x="55" y="159.0" font-size="23" fill="#486078">Compare a church’s order of prayer, guided steps, intercession and silence with two proposed alternatives: returning to an</text><text x="55" y="190.05" font-size="23" fill="#486078">inherited prayer, or carrying one intention toward an optional action before forgetting it. Counted prayer remains a</text><text x="55" y="221.10000000000002" font-size="23" fill="#486078">warning case.</text><rect x="55" y="329.15000000000003" width="475" height="485.0" rx="20" fill="#ffffff" stroke="#708892" stroke-width="2" /><text x="55" y="287.15000000000003" font-size="23" fill="#102c47" font-weight="700">A · Order of prayer</text><text x="75" y="364.15000000000003" font-size="15" fill="#486078">PRACTICE · EXAMPLE</text><text x="75" y="416.15000000000003" font-size="17" fill="#486078">Compline · Book of Common Prayer (1979)</text><text x="75" y="460.1" font-size="21" fill="#102c47">The Lord Almighty grant us a peaceful</text><text x="75" y="488.45000000000005" font-size="21" fill="#102c47">night and a perfect end.</text><rect x="575" y="329.15000000000003" width="475" height="485.0" rx="20" fill="#ffffff" stroke="#708892" stroke-width="2" /><text x="575" y="287.15000000000003" font-size="23" fill="#102c47" font-weight="700">B · Guided steps</text><text x="595" y="364.15000000000003" font-size="15" fill="#486078">PRACTICE · EXAMPLE</text><text x="595" y="416.15000000000003" font-size="17" fill="#486078">Step 2 of 5</text><text x="595" y="465.1" font-size="26" fill="#102c47" font-weight="700">Review the day with gratitude</text><rect x="1095" y="329.15000000000003" width="475" height="485.0" rx="20" fill="#ffffff" stroke="#708892" stroke-width="2" /><text x="1095" y="287.15000000000003" font-size="23" fill="#102c47" font-weight="700">C · People I pray for</text><text x="1115" y="364.15000000000003" font-size="15" fill="#486078">PRACTICE · EXAMPLE</text><text x="1115" y="420.15000000000003" font-size="21" fill="#102c47">Mum · Hospital appointment, Thursday</text><rect x="1115" y="444.50000000000006" width="435" height="55.35000000000002" rx="8" fill="#edf5f7" stroke="#9aafbf" /><text x="1130" y="477.50000000000006" font-size="21" fill="#102c47" font-weight="700">Only me · Tuesday group</text><text x="55" y="856.1500000000001" font-size="20" fill="#486078">A church’s office for the hour, with its</text><text x="55" y="883.1500000000001" font-size="20" fill="#486078">calendar named.</text><text x="575" y="856.1500000000001" font-size="20" fill="#486078">An outline of steps, at the person’s pace.</text><text x="1095" y="856.1500000000001" font-size="20" fill="#486078">A private list, with audiences named for</text><text x="1095" y="883.1500000000001" font-size="20" fill="#486078">groups.</text><text x="55" y="946.1500000000001" font-size="16" fill="#486078">SCHEMATIC TEXT ROWS, NOT LOADING STATES · ORIGINAL PROPOSALS · NOT PRODUCT SCREENSHOTS</text></g></svg><svg y="995" viewBox="0 0 1610 995" role="img" aria-labelledby="title-3 desc-3"><title id="title-3">Prayer</title><desc id="desc-3">3 English interface examples. Compare a church’s order of prayer, guided steps, intercession and silence with two proposed alternatives: returning to an inherited prayer, or carrying one intention toward an optional action before forgetting it. Counted prayer remains a warning case.</desc><rect width="1610" height="995" fill="#f6f9fa" /><g font-family="Arial, sans-serif"><text x="55" y="46" font-size="18" fill="#486078" font-weight="700">BIBLE AND FAITH APP DESIGN PATTERNS</text><text x="55" y="110" font-size="40" fill="#102c47" font-weight="700">Prayer</text><text x="55" y="159.0" font-size="23" fill="#486078">Compare a church’s order of prayer, guided steps, intercession and silence with two proposed alternatives: returning to an</text><text x="55" y="190.05" font-size="23" fill="#486078">inherited prayer, or carrying one intention toward an optional action before forgetting it. Counted prayer remains a</text><text x="55" y="221.10000000000002" font-size="23" fill="#486078">warning case.</text><rect x="55" y="329.15000000000003" width="475" height="485.0" rx="20" fill="#ffffff" stroke="#708892" stroke-width="2" /><text x="55" y="287.15000000000003" font-size="23" fill="#102c47" font-weight="700">D · Quiet prayer</text><text x="75" y="364.15000000000003" font-size="15" fill="#486078">PRACTICE · EXAMPLE</text><text x="75" y="420.15000000000003" font-size="21" fill="#102c47">No words need to be entered.</text><rect x="75" y="444.50000000000006" width="435" height="55.35000000000002" rx="8" fill="#edf5f7" stroke="#9aafbf" /><text x="90" y="477.50000000000006" font-size="21" fill="#102c47" font-weight="700">Begin</text><rect x="575" y="329.15000000000003" width="475" height="485.0" rx="20" fill="#ffffff" stroke="#708892" stroke-width="2" /><text x="575" y="287.15000000000003" font-size="23" fill="#102c47" font-weight="700">E · Counted prayer</text><text x="595" y="364.15000000000003" font-size="15" fill="#486078">PRACTICE · EXAMPLE</text><text x="595" y="425.15000000000003" font-size="26" fill="#102c47" font-weight="700">11 day prayer streak</text><text x="595" y="472.25000000000006" font-size="21" fill="#102c47">1,111,432,374 prayers prayed</text><rect x="1095" y="329.15000000000003" width="475" height="485.0" rx="20" fill="#ffffff" stroke="#708892" stroke-width="2" /><text x="1095" y="287.15000000000003" font-size="23" fill="#102c47" font-weight="700">F · Same prayer, then silence</text><text x="1115" y="364.15000000000003" font-size="15" fill="#486078">PRACTICE · EXAMPLE</text><text x="1115" y="420.15000000000003" font-size="21" fill="#102c47">Our help is in the Name of the Lord;</text><rect x="1115" y="444.50000000000006" width="435" height="83.69999999999999" rx="8" fill="#edf5f7" stroke="#9aafbf" /><text x="1130" y="477.50000000000006" font-size="21" fill="#102c47" font-weight="700">Silence · Return to the same words ·</text><text x="1130" y="505.8500000000001" font-size="21" fill="#102c47" font-weight="700">Finish</text><text x="55" y="856.1500000000001" font-size="20" fill="#486078">Begin, put the phone down, finish when</text><text x="55" y="883.1500000000001" font-size="20" fill="#486078">ready.</text><text x="575" y="856.1500000000001" font-size="20" fill="#486078">Minutes, streaks and totals.</text><text x="1095" y="856.1500000000001" font-size="20" fill="#486078">Borrowed: received words can be repeated</text><text x="1095" y="883.1500000000001" font-size="20" fill="#486078">without a count.</text><text x="55" y="946.1500000000001" font-size="16" fill="#486078">SCHEMATIC TEXT ROWS, NOT LOADING STATES · ORIGINAL PROPOSALS · NOT PRODUCT SCREENSHOTS</text></g></svg><svg y="1990" viewBox="0 0 1610 995" role="img" aria-labelledby="title-6 desc-6"><title id="title-6">Prayer</title><desc id="desc-6">1 English interface examples. Compare a church’s order of prayer, guided steps, intercession and silence with two proposed alternatives: returning to an inherited prayer, or carrying one intention toward an optional action before forgetting it. Counted prayer remains a warning case.</desc><rect width="1610" height="995" fill="#f6f9fa" /><g font-family="Arial, sans-serif"><text x="55" y="46" font-size="18" fill="#486078" font-weight="700">BIBLE AND FAITH APP DESIGN PATTERNS</text><text x="55" y="110" font-size="40" fill="#102c47" font-weight="700">Prayer</text><text x="55" y="159.0" font-size="23" fill="#486078">Compare a church’s order of prayer, guided steps, intercession and silence with two proposed alternatives: returning to an</text><text x="55" y="190.05" font-size="23" fill="#486078">inherited prayer, or carrying one intention toward an optional action before forgetting it. Counted prayer remains a</text><text x="55" y="221.10000000000002" font-size="23" fill="#486078">warning case.</text><rect x="55" y="329.15000000000003" width="475" height="485.0" rx="20" fill="#ffffff" stroke="#708892" stroke-width="2" /><text x="55" y="287.15000000000003" font-size="23" fill="#102c47" font-weight="700">G · Carry one intention</text><text x="75" y="364.15000000000003" font-size="15" fill="#486078">PRACTICE · EXAMPLE</text><text x="75" y="425.15000000000003" font-size="26" fill="#102c47" font-weight="700">One intention, beyond the</text><text x="75" y="460.25000000000006" font-size="26" fill="#102c47" font-weight="700">screen</text><rect x="75" y="486.3500000000001" width="435" height="83.69999999999999" rx="8" fill="#edf5f7" stroke="#9aafbf" /><text x="90" y="519.3500000000001" font-size="21" fill="#102c47" font-weight="700">Consider an action · Finish and</text><text x="90" y="547.7" font-size="21" fill="#102c47" font-weight="700">forget</text><text x="55" y="856.1500000000001" font-size="20" fill="#486078">Exploratory: pray, optionally choose an</text><text x="55" y="883.1500000000001" font-size="20" fill="#486078">action, then forget.</text><text x="55" y="946.1500000000001" font-size="16" fill="#486078">SCHEMATIC TEXT ROWS, NOT LOADING STATES · ORIGINAL PROPOSALS · NOT PRODUCT SCREENSHOTS</text></g></svg></svg>