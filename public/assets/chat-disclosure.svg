<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 2044" role="img" aria-labelledby="title desc" data-illustration-theme="light"><title id="title">Explain AI, fallibility and privacy where they matter</title><desc id="desc">4 annotated interface examples with use cases and tradeoffs. Scripture samples are identified by edition.</desc><rect width="1200" height="2044" fill="#edf5f9" /><g font-family="Arial, sans-serif"><text x="40" y="65" font-size="30" fill="#102c47" font-weight="700">Explain AI, fallibility and privacy where they matter</text><text x="40" y="116.5" font-size="18" fill="#102c47">Entry, composer, response and export are complementary locations. Each answers a different question; a footer should</text><text x="40" y="142.6" font-size="18" fill="#102c47">not carry every responsibility.</text><text x="40" y="207.7" font-size="23" fill="#102c47" font-weight="700">A · Before the first message</text><rect x="40" y="236.04999999999998" width="510" height="381.05000000000007" rx="8" fill="#ffffff" stroke="#9aafbf" /><text x="62" y="274.04999999999995" font-size="18" fill="#102c47" font-weight="700">Bible study AI</text><text x="62" y="323.15" font-size="17" fill="#102c47" font-weight="700">AI assistant</text><rect x="62" y="346.79999999999995" width="454" height="77.29999999999995" rx="14" fill="#f3f7fa" /><text x="78" y="377.79999999999995" font-size="17" fill="#102c47">Explore passages and compare sources.</text><text x="78" y="402.44999999999993" font-size="17" fill="#102c47">Responses can contain mistakes.</text><text x="62" y="456.0999999999999" font-size="14" fill="#486078">How your messages are used</text><text x="62" y="492.3999999999999" font-size="14" fill="#486078">Privacy policy  ·  About this AI</text><rect x="62" y="514.6999999999999" width="204" height="72.40000000000009" rx="12" fill="#d9e9f4" stroke="#9aafbf" /><text x="80" y="543.6999999999999" font-size="16" fill="#102c47" font-weight="700">Start a</text><text x="80" y="566.9" font-size="16" fill="#102c47" font-weight="700">conversation</text><path d="M64 617.1v12 q0 8 8 8 h16 q8 0 8 8 v8" fill="none" stroke="#10324f" stroke-width="1.5" /><circle cx="64" cy="617.1" r="2.5" fill="#10324f" /><text x="40" y="678.1" font-size="17" fill="#102c47">An entry explanation frames the role. Data-use details</text><text x="40" y="702.75" font-size="17" fill="#102c47">must describe the actual product before personal content</text><text x="40" y="727.4" font-size="17" fill="#102c47">is collected.</text><text x="40" y="767.05" font-size="16" fill="#102c47">Use when: Someone is entering the AI feature for the first</text><text x="40" y="790.25" font-size="16" fill="#102c47">time or after a material change</text><text x="40" y="825.45" font-size="16" fill="#102c47">Consider: Keep the first layer short, but do not hide</text><text x="40" y="848.6500000000001" font-size="16" fill="#102c47">important data practices behind a generic link.</text><text x="620" y="207.7" font-size="23" fill="#102c47" font-weight="700">B · At the composer</text><rect x="620" y="236.04999999999998" width="510" height="613.3999999999999" rx="8" fill="#ffffff" stroke="#9aafbf" /><text x="642" y="274.04999999999995" font-size="18" fill="#102c47" font-weight="700">Bible study AI</text><rect x="642" y="306.15" width="454" height="52.64999999999998" rx="14" fill="#f3f7fa" /><text x="658" y="337.15" font-size="17" fill="#102c47">What does Psalm 23 say about rest?</text><text x="642" y="393.79999999999995" font-size="17" fill="#102c47" font-weight="700">AI-generated reflection</text><rect x="642" y="417.44999999999993" width="466" height="109.95000000000005" rx="8" fill="#f3f7fa" stroke="#9aafbf" /><text x="656" y="444.44999999999993" font-size="13" fill="#102c47" font-weight="700">Psalm 23:2 · BSB</text><text x="656" y="477.29999999999995" font-size="19" fill="#102c47">He maketh me to lie down in green pastures:</text><text x="656" y="504.84999999999997" font-size="19" fill="#102c47">he leadeth me beside the still waters.</text><text x="642" y="560.4" font-size="17" fill="#102c47">The passage pictures care and rest through the</text><text x="642" y="585.05" font-size="17" fill="#102c47">shepherd’s provision.</text><text x="642" y="625.6999999999999" font-size="17" fill="#102c47">Read in context</text><rect x="642" y="649.3499999999999" width="466" height="99.5" rx="8" fill="#ffffff" stroke="#9aafbf" /><text x="656" y="680.3499999999999" font-size="17" fill="#102c47">Ask a follow-up…</text><text x="656" y="728.9999999999999" font-size="13" fill="#102c47">+ Add context                         Send</text><text x="642" y="778.8499999999999" font-size="14" fill="#486078">AI can make mistakes. Check important claims.</text><text x="642" y="815.1499999999999" font-size="14" fill="#486078">How your messages are used  ·  Privacy policy</text><path d="M644 849.4499999999998v12 q0 8 8 8 h16 q8 0 8 8 v8" fill="none" stroke="#10324f" stroke-width="1.5" /><circle cx="644" cy="849.4499999999998" r="2.5" fill="#10324f" /><text x="620" y="910.4499999999998" font-size="17" fill="#102c47">A persistent composer link keeps privacy information</text><text x="620" y="935.0999999999998" font-size="17" fill="#102c47">available. Add specific notices before new types of</text><text x="620" y="959.7499999999998" font-size="17" fill="#102c47">collection.</text><text x="620" y="999.3999999999997" font-size="16" fill="#102c47">Use when: A returning person is about to send or attach</text><text x="620" y="1022.5999999999998" font-size="16" fill="#102c47">content</text><text x="620" y="1057.7999999999997" font-size="16" fill="#102c47">Consider: Repeat targeted information for new collection; a</text><text x="620" y="1080.9999999999998" font-size="16" fill="#102c47">tiny footer does not replace an adequate notice.</text><text x="40" y="1167.1999999999998" font-size="23" fill="#102c47" font-weight="700">C · Beside the response</text><rect x="40" y="1195.5499999999997" width="510" height="425.3499999999999" rx="8" fill="#ffffff" stroke="#9aafbf" /><text x="62" y="1233.5499999999997" font-size="18" fill="#102c47" font-weight="700">Bible study AI</text><rect x="62" y="1265.6499999999996" width="466" height="82.39999999999986" rx="8" fill="#f3f7fa" stroke="#9aafbf" /><text x="76" y="1292.6499999999996" font-size="13" fill="#102c47" font-weight="700">Psalm 23:1 · BSB</text><text x="76" y="1325.4999999999995" font-size="19" fill="#102c47">The LORD is my shepherd; I shall not want.</text><text x="62" y="1381.0499999999995" font-size="17" fill="#102c47" font-weight="700">AI-generated interpretation</text><rect x="62" y="1404.6999999999996" width="454" height="77.30000000000018" rx="14" fill="#f3f7fa" /><text x="78" y="1435.6999999999996" font-size="17" fill="#102c47">The shepherd image can prompt reflection on</text><text x="78" y="1460.3499999999997" font-size="17" fill="#102c47">care and provision.</text><text x="62" y="1513.9999999999998" font-size="14" fill="#486078">Read Psalm 23  ·  Inspect sources</text><text x="62" y="1550.2999999999997" font-size="14" fill="#486078">Compare the interpretation with the passage.</text><text x="62" y="1586.5999999999997" font-size="14" fill="#486078">Report an issue</text><path d="M64 1620.8999999999996v12 q0 8 8 8 h16 q8 0 8 8 v8" fill="none" stroke="#10324f" stroke-width="1.5" /><circle cx="64" cy="1620.8999999999996" r="2.5" fill="#10324f" /><text x="40" y="1681.8999999999996" font-size="17" fill="#102c47">Keep verified Scripture distinct from the generated</text><text x="40" y="1706.5499999999997" font-size="17" fill="#102c47">interpretation. The checking action should open the</text><text x="40" y="1731.1999999999998" font-size="17" fill="#102c47">relevant evidence.</text><text x="40" y="1770.85" font-size="16" fill="#102c47">Use when: The answer contains an interpretation, quotation</text><text x="40" y="1794.05" font-size="16" fill="#102c47">or consequential claim</text><text x="40" y="1829.25" font-size="16" fill="#102c47">Consider: Avoid blanket banners that become background</text><text x="40" y="1852.45" font-size="16" fill="#102c47">noise; retain general identity and access to full details.</text><text x="620" y="1167.1999999999998" font-size="23" fill="#102c47" font-weight="700">D · In a shared artifact</text><rect x="620" y="1195.5499999999997" width="510" height="452.79999999999995" rx="8" fill="#ffffff" stroke="#9aafbf" /><text x="642" y="1233.5499999999997" font-size="18" fill="#102c47" font-weight="700">Share preview</text><text x="642" y="1282.6499999999996" font-size="17" fill="#102c47" font-weight="700">AI-generated reflection</text><rect x="642" y="1306.2999999999997" width="454" height="52.65000000000009" rx="14" fill="#f3f7fa" /><text x="658" y="1337.2999999999997" font-size="17" fill="#102c47">A reflection on care and provision.</text><rect x="642" y="1376.9499999999998" width="466" height="80.39999999999986" rx="8" fill="#ffffff" stroke="#9aafbf" /><text x="656" y="1408.9499999999998" font-size="18" fill="#102c47" font-weight="700">Based on Psalm 23</text><text x="656" y="1437.0499999999997" font-size="14" fill="#102c47">BSB · Read the passage</text><text x="642" y="1487.3499999999997" font-size="14" fill="#486078">Illustrative share preview</text><text x="642" y="1523.6499999999996" font-size="14" fill="#486078">Include sources  ·  Cancel</text><rect x="642" y="1545.9499999999996" width="228" height="72.40000000000009" rx="12" fill="#d9e9f4" stroke="#9aafbf" /><text x="660" y="1574.9499999999996" font-size="16" fill="#102c47" font-weight="700">Share previewed</text><text x="660" y="1598.1499999999996" font-size="16" fill="#102c47" font-weight="700">content</text><path d="M644 1648.3499999999997v12 q0 8 8 8 h16 q8 0 8 8 v8" fill="none" stroke="#10324f" stroke-width="1.5" /><circle cx="644" cy="1648.3499999999997" r="2.5" fill="#10324f" /><text x="620" y="1709.3499999999997" font-size="17" fill="#102c47">Identity needs to survive export. A recipient may never</text><text x="620" y="1733.9999999999998" font-size="17" fill="#102c47">see the original chat or its onboarding.</text><text x="620" y="1773.6499999999999" font-size="16" fill="#102c47">Use when: A response is copied, saved or shared</text><text x="620" y="1808.85" font-size="16" fill="#102c47">Consider: The recipient may never see the original chat</text><text x="620" y="1832.05" font-size="16" fill="#102c47">header, onboarding or privacy information.</text><text x="40" y="1930.65" font-size="15" fill="#102c47">Original illustrative interfaces · Static controls · Any Scripture samples identify their edition. Sample catalogue and resource details are</text><text x="40" y="1952.4" font-size="15" fill="#102c47">illustrative.</text><text x="40" y="2008.15" font-size="14" fill="#102c47">patterns.missional.design/patterns/chat-disclosure/</text></g></svg>