<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1510" role="img" aria-labelledby="title desc"><title id="title">The player works without the screen</title><desc id="desc">3 annotated interface examples with use cases and tradeoffs. Scripture samples are identified by edition.</desc><rect width="1200" height="1510" fill="#f6f5f2"/><g font-family="Arial, sans-serif"><text x="40" y="65" font-size="30" fill="#17202a" font-weight="700">The player works without the screen</text><text x="40" y="116.5" font-size="18" fill="#17202a">An in-app player, system controls and return to text are complementary parts of a listening experience.</text><text x="40" y="181.6" font-size="23" fill="#17202a" font-weight="700">A · Listening player</text><rect x="40" y="209.95" width="510" height="342.65000000000003" rx="6" fill="white" stroke="#8a959f"/><text x="62" y="247.95" font-size="18" fill="#17202a" font-weight="700">Psalm 23 · Audio</text><text x="62" y="297.05" font-size="17" fill="#17202a" font-weight="700">BSB · Example recording</text><rect x="62" y="334.7" width="466" height="3" rx="0" fill="#d4d9e0" stroke="#d4d9e0"/><rect x="62" y="334.7" width="119.82857142857142" height="3" rx="0" fill="#000462" stroke="#000462"/><text x="62" y="360.7" font-size="14" fill="#17202a">00:18                          01:10</text><text x="62" y="405.0" font-size="18" fill="#17202a" font-weight="700">−10 s             Pause             +10 s</text><text x="62" y="451.1" font-size="14" fill="#43516a">Speed 1×  ·  Repeat: Off</text><rect x="62" y="473.40000000000003" width="466" height="51.19999999999999" rx="6" fill="#fff" stroke="#b8c0c8"/><text x="76" y="503.40000000000003" font-size="16" fill="#17202a">Previous psalm  ·  Next psalm</text><path d="M64 552.6v12 q0 8 8 8 h16 q8 0 8 8 v8" fill="none" stroke="#000462" stroke-width="1.5"/><circle cx="64" cy="552.6" r="2.5" fill="#000462"/><text x="40" y="613.6" font-size="17" fill="#17202a">A listening surface gives playback priority. Edition and</text><text x="40" y="638.25" font-size="17" fill="#17202a">recording identity remain visible; timing here is</text><text x="40" y="662.9" font-size="17" fill="#17202a">illustrative.</text><text x="40" y="702.55" font-size="16" fill="#17202a">Use when: Listening is the primary activity</text><text x="40" y="737.75" font-size="16" fill="#17202a">Consider: The screen still needs clear edition and position</text><text x="620" y="181.6" font-size="23" fill="#17202a" font-weight="700">B · Screen-free controls</text><rect x="620" y="209.95" width="510" height="294.9000000000001" rx="6" fill="white" stroke="#8a959f"/><text x="642" y="247.95" font-size="18" fill="#17202a" font-weight="700">Device playback controls</text><rect x="642" y="280.05" width="466" height="80.40000000000003" rx="6" fill="#fff" stroke="#b8c0c8"/><text x="656" y="312.05" font-size="18" fill="#17202a" font-weight="700">Psalm 23</text><text x="656" y="340.15000000000003" font-size="14" fill="#17202a">BSB · Example recording</text><rect x="642" y="390.45000000000005" width="466" height="3" rx="0" fill="#d4d9e0" stroke="#d4d9e0"/><rect x="642" y="390.45000000000005" width="119.82857142857142" height="3" rx="0" fill="#000462" stroke="#000462"/><text x="642" y="416.45000000000005" font-size="14" fill="#17202a">00:18                          01:10</text><text x="642" y="460.75000000000006" font-size="18" fill="#17202a" font-weight="700">−10 s             Pause             +10 s</text><path d="M644 504.8500000000001v12 q0 8 8 8 h16 q8 0 8 8 v8" fill="none" stroke="#000462" stroke-width="1.5"/><circle cx="644" cy="504.8500000000001" r="2.5" fill="#000462"/><text x="620" y="565.8500000000001" font-size="17" fill="#17202a">System controls can support listening with the app out</text><text x="620" y="590.5000000000001" font-size="17" fill="#17202a">of view. Available controls depend on the platform.</text><text x="620" y="630.1500000000001" font-size="16" fill="#17202a">Use when: The user is screen-free</text><text x="620" y="665.3500000000001" font-size="16" fill="#17202a">Consider: Device controls may expose fewer settings</text><text x="40" y="823.95" font-size="23" fill="#17202a" font-weight="700">C · Resume in text</text><rect x="40" y="852.3000000000001" width="510" height="282.0000000000001" rx="6" fill="white" stroke="#8a959f"/><text x="62" y="890.3000000000001" font-size="18" fill="#17202a" font-weight="700">Continue with Psalm 23</text><rect x="62" y="922.4000000000001" width="466" height="80.39999999999998" rx="6" fill="#fff" stroke="#b8c0c8"/><text x="76" y="954.4000000000001" font-size="18" fill="#17202a" font-weight="700">Last heard: verse 2</text><text x="76" y="982.5000000000001" font-size="14" fill="#17202a">BSB · 00:18 · Example recording</text><rect x="62" y="1018.8000000000001" width="466" height="51.20000000000016" rx="6" fill="#000462" stroke="#b8c0c8"/><text x="76" y="1048.8000000000002" font-size="16" fill="#fff" font-weight="700">Continue listening</text><text x="62" y="1100.0000000000002" font-size="14" fill="#43516a">Read from verse 2</text><path d="M64 1134.3000000000002v12 q0 8 8 8 h16 q8 0 8 8 v8" fill="none" stroke="#000462" stroke-width="1.5"/><circle cx="64" cy="1134.3000000000002" r="2.5" fill="#000462"/><text x="40" y="1195.3000000000002" font-size="17" fill="#17202a">A listening position and a reading location are related</text><text x="40" y="1219.9500000000003" font-size="17" fill="#17202a">but distinct. Offer both destinations.</text><text x="40" y="1259.6000000000004" font-size="16" fill="#17202a">Use when: Listening leads back to reading</text><text x="40" y="1294.8000000000004" font-size="16" fill="#17202a">Consider: Playback and reading positions must not be</text><text x="40" y="1318.0000000000005" font-size="16" fill="#17202a">conflated</text><text x="40" y="1396.2000000000005" font-size="15" fill="#17202a">Original illustrative interfaces · Static controls · Any Scripture samples identify their edition. Sample catalogue and resource details are</text><text x="40" y="1417.9500000000005" font-size="15" fill="#17202a">illustrative.</text><text x="40" y="1473.7000000000005" font-size="14" fill="#17202a">patterns.missional.design/patterns/audio-first/</text></g></svg>