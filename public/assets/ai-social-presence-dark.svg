<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1744" role="img" aria-labelledby="title desc" data-illustration-theme="dark"><title id="title">How human should the assistant appear?</title><desc id="desc">3 annotated interface examples with use cases and tradeoffs. Scripture samples are identified by edition.</desc><rect width="1200" height="1744" fill="#102333" /><g font-family="Arial, sans-serif"><text x="40" y="65" font-size="30" fill="#e8f1f7" font-weight="700">How human should the assistant appear?</text><text x="40" y="116.5" font-size="18" fill="#e8f1f7">These are alternative status treatments within a clearly identified AI conversation. Dots, task status and streaming</text><text x="40" y="142.6" font-size="18" fill="#e8f1f7">can also follow one another when the real operation changes.</text><text x="40" y="207.7" font-size="23" fill="#e8f1f7" font-weight="700">A · Compact pending cue</text><rect x="40" y="236.04999999999998" width="510" height="411.6" rx="6" fill="#162e40" stroke="#668399" /><text x="62" y="274.04999999999995" font-size="18" fill="#e8f1f7" font-weight="700">Bible study AI</text><text x="62" y="323.15" font-size="17" fill="#e8f1f7">Help me explore Psalm 23.</text><text x="62" y="363.79999999999995" font-size="17" fill="#e8f1f7" font-weight="700">AI assistant</text><rect x="62" y="387.44999999999993" width="466" height="80.40000000000003" rx="6" fill="#162e40" stroke="#668399" /><text x="76" y="419.44999999999993" font-size="18" fill="#e8f1f7" font-weight="700">•••</text><text x="76" y="447.54999999999995" font-size="14" fill="#e8f1f7">Preparing a response</text><text x="62" y="497.84999999999997" font-size="14" fill="#b9cddd">Stop response</text><rect x="62" y="520.15" width="466" height="99.5" rx="6" fill="#162e40" stroke="#668399" /><text x="76" y="551.15" font-size="17" fill="#e8f1f7">Ask a follow-up…</text><text x="76" y="599.8" font-size="13" fill="#e8f1f7">+ Add context                         Send</text><path d="M64 647.65v12 q0 8 8 8 h16 q8 0 8 8 v8" fill="none" stroke="#a7d2f0" stroke-width="1.5" /><circle cx="64" cy="647.65" r="2.5" fill="#a7d2f0" /><text x="40" y="708.65" font-size="17" fill="#e8f1f7">Dots indicate a pending AI response. An accessible</text><text x="40" y="733.3" font-size="17" fill="#e8f1f7">status supplies meaning without relying on motion.</text><text x="40" y="772.9499999999999" font-size="16" fill="#e8f1f7">Use when: The wait is brief and there is no meaningful</text><text x="40" y="796.15" font-size="16" fill="#e8f1f7">progress to report</text><text x="40" y="831.35" font-size="16" fill="#e8f1f7">Consider: Dots alone explain little; pair with accessible</text><text x="40" y="854.5500000000001" font-size="16" fill="#e8f1f7">status text and avoid human typing claims.</text><text x="620" y="207.7" font-size="23" fill="#e8f1f7" font-weight="700">B · Task status</text><rect x="620" y="236.04999999999998" width="510" height="411.6" rx="6" fill="#162e40" stroke="#668399" /><text x="642" y="274.04999999999995" font-size="18" fill="#e8f1f7" font-weight="700">Bible study AI</text><text x="642" y="323.15" font-size="17" fill="#e8f1f7">Compare the two commentaries I selected.</text><text x="642" y="363.79999999999995" font-size="17" fill="#e8f1f7" font-weight="700">AI assistant</text><rect x="642" y="387.44999999999993" width="466" height="80.40000000000003" rx="6" fill="#162e40" stroke="#668399" /><text x="656" y="419.44999999999993" font-size="18" fill="#e8f1f7" font-weight="700">Searching selected sources</text><text x="656" y="447.54999999999995" font-size="14" fill="#e8f1f7">2 sources selected</text><text x="642" y="497.84999999999997" font-size="14" fill="#b9cddd">Stop response</text><rect x="642" y="520.15" width="466" height="99.5" rx="6" fill="#162e40" stroke="#668399" /><text x="656" y="551.15" font-size="17" fill="#e8f1f7">Ask a follow-up…</text><text x="656" y="599.8" font-size="13" fill="#e8f1f7">+ Add context                         Send</text><path d="M644 647.65v12 q0 8 8 8 h16 q8 0 8 8 v8" fill="none" stroke="#a7d2f0" stroke-width="1.5" /><circle cx="644" cy="647.65" r="2.5" fill="#a7d2f0" /><text x="620" y="708.65" font-size="17" fill="#e8f1f7">Name a real operation only while it occurs. This status</text><text x="620" y="733.3" font-size="17" fill="#e8f1f7">does not certify that the eventual answer is correct.</text><text x="620" y="772.9499999999999" font-size="16" fill="#e8f1f7">Use when: Retrieval or another meaningful stage can be</text><text x="620" y="796.15" font-size="16" fill="#e8f1f7">reported truthfully</text><text x="620" y="831.35" font-size="16" fill="#e8f1f7">Consider: Do not invent steps, timings or verification to</text><text x="620" y="854.5500000000001" font-size="16" fill="#e8f1f7">make generation look diligent.</text><text x="40" y="940.7500000000001" font-size="23" fill="#e8f1f7" font-weight="700">C · Streaming response</text><rect x="40" y="969.1000000000001" width="510" height="351.5000000000002" rx="6" fill="#162e40" stroke="#668399" /><text x="62" y="1007.1000000000001" font-size="18" fill="#e8f1f7" font-weight="700">Bible study AI</text><text x="62" y="1056.2000000000003" font-size="17" fill="#e8f1f7" font-weight="700">AI assistant · Generating</text><text x="62" y="1096.8500000000004" font-size="17" fill="#e8f1f7">Here is one way to begin comparing the passages…</text><text x="62" y="1134.5000000000005" font-size="14" fill="#b9cddd">Stop response</text><text x="62" y="1170.8000000000004" font-size="14" fill="#b9cddd">Response in progress</text><rect x="62" y="1193.1000000000004" width="466" height="99.5" rx="6" fill="#162e40" stroke="#668399" /><text x="76" y="1224.1000000000004" font-size="17" fill="#e8f1f7">Ask a follow-up…</text><text x="76" y="1272.7500000000005" font-size="13" fill="#e8f1f7">+ Add context                         Send</text><path d="M64 1320.6000000000004v12 q0 8 8 8 h16 q8 0 8 8 v8" fill="none" stroke="#a7d2f0" stroke-width="1.5" /><circle cx="64" cy="1320.6000000000004" r="2.5" fill="#a7d2f0" /><text x="40" y="1381.6000000000004" font-size="17" fill="#e8f1f7">Streaming is a presentation choice. Preserve the</text><text x="40" y="1406.2500000000005" font-size="17" fill="#e8f1f7">reader’s scroll position and identify interrupted</text><text x="40" y="1430.9000000000005" font-size="17" fill="#e8f1f7">output.</text><text x="40" y="1470.5500000000006" font-size="16" fill="#e8f1f7">Use when: Partial output is useful and streaming is</text><text x="40" y="1493.7500000000007" font-size="16" fill="#e8f1f7">supported</text><text x="40" y="1528.9500000000007" font-size="16" fill="#e8f1f7">Consider: Growing text can disrupt reading; preserve manual</text><text x="40" y="1552.1500000000008" font-size="16" fill="#e8f1f7">scroll and distinguish interrupted output.</text><text x="40" y="1630.3500000000008" font-size="15" fill="#e8f1f7">Original illustrative interfaces · Static controls · Any Scripture samples identify their edition. Sample catalogue and resource details are</text><text x="40" y="1652.1000000000008" font-size="15" fill="#e8f1f7">illustrative.</text><text x="40" y="1707.8500000000008" font-size="14" fill="#e8f1f7">patterns.missional.design/patterns/ai-social-presence/</text></g></svg>