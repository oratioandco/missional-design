<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1410" role="img" aria-labelledby="title desc" data-illustration-theme="light"><title id="title">Parallel reading chooses a useful arrangement</title><desc id="desc">3 annotated interface examples with use cases and tradeoffs. Scripture samples are identified by edition.</desc><rect width="1200" height="1410" fill="#edf5f9" /><g font-family="Arial, sans-serif"><text x="40" y="65" font-size="30" fill="#102c47" font-weight="700">Parallel reading chooses a useful arrangement</text><text x="40" y="116.5" font-size="18" fill="#102c47">The first two examples explore mobile arrangements; the third assumes a larger surface. Linking scroll is a separate</text><text x="40" y="142.6" font-size="18" fill="#102c47">choice.</text><text x="40" y="207.7" font-size="23" fill="#102c47" font-weight="700">A · Mobile: top and bottom</text><rect x="40" y="236.04999999999998" width="510" height="273.0" rx="6" fill="#ffffff" stroke="#9aafbf" /><text x="62" y="274.04999999999995" font-size="18" fill="#102c47" font-weight="700">Psalm 23:1 · Compare</text><text x="62" y="321.15" font-size="15" fill="#102c47" font-weight="700">BSB</text><text x="62" y="353.9" font-size="19" fill="#102c47">The LORD is my shepherd; I shall not want.</text><text x="62" y="399.45" font-size="15" fill="#102c47" font-weight="700">WEB</text><text x="62" y="432.2" font-size="19" fill="#102c47">The LORD is my shepherd; I shall lack nothing.</text><text x="62" y="474.75" font-size="14" fill="#486078">Link scrolling: Off  ·  One edition</text><path d="M64 509.05v12 q0 8 8 8 h16 q8 0 8 8 v8" fill="none" stroke="#10324f" stroke-width="1.5" /><circle cx="64" cy="509.05" r="2.5" fill="#10324f" /><text x="40" y="570.05" font-size="17" fill="#102c47">Stacking preserves reading width. Label each pane and</text><text x="40" y="594.6999999999999" font-size="17" fill="#102c47">keep its position distinct.</text><text x="40" y="634.3499999999999" font-size="16" fill="#102c47">Use when: A phone needs readable full-width panes</text><text x="40" y="669.55" font-size="16" fill="#102c47">Consider: Stacked panes reduce each visible passage height</text><text x="620" y="207.7" font-size="23" fill="#102c47" font-weight="700">B · Mobile: left and right</text><rect x="620" y="236.04999999999998" width="510" height="250.80000000000004" rx="6" fill="#ffffff" stroke="#9aafbf" /><text x="642" y="274.04999999999995" font-size="18" fill="#102c47" font-weight="700">Psalm 23:1 · Compare</text><text x="642" y="321.15" font-size="15" fill="#102c47" font-weight="700">BSB</text><text x="642" y="354.9" font-size="19" fill="#102c47">The LORD is my</text><text x="642" y="382.45" font-size="19" fill="#102c47">shepherd; I shall not</text><text x="642" y="410.0" font-size="19" fill="#102c47">want.</text><text x="887.0" y="321.15" font-size="15" fill="#102c47" font-weight="700">WEB</text><text x="887.0" y="354.9" font-size="19" fill="#102c47">The LORD is my</text><text x="887.0" y="382.45" font-size="19" fill="#102c47">shepherd; I shall</text><text x="887.0" y="410.0" font-size="19" fill="#102c47">lack nothing.</text><text x="642" y="452.55" font-size="14" fill="#486078">Stack panes  ·  Link scrolling: Off</text><path d="M644 486.85v12 q0 8 8 8 h16 q8 0 8 8 v8" fill="none" stroke="#10324f" stroke-width="1.5" /><circle cx="644" cy="486.85" r="2.5" fill="#10324f" /><text x="620" y="547.85" font-size="17" fill="#102c47">Narrow side-by-side panes need an easy route to stacking</text><text x="620" y="572.5" font-size="17" fill="#102c47">when text becomes cramped.</text><text x="620" y="612.15" font-size="16" fill="#102c47">Use when: Short comparison fits side-by-side on a phone</text><text x="620" y="647.35" font-size="16" fill="#102c47">Consider: Line length may fail with large text</text><text x="40" y="755.75" font-size="23" fill="#102c47" font-weight="700">C · Large screen: side by side</text><rect x="40" y="784.1" width="510" height="250.79999999999984" rx="6" fill="#ffffff" stroke="#9aafbf" /><text x="62" y="822.1" font-size="18" fill="#102c47" font-weight="700">Compare editions · Larger screen</text><text x="62" y="869.2" font-size="15" fill="#102c47" font-weight="700">BSB</text><text x="62" y="902.95" font-size="19" fill="#102c47">The LORD is my</text><text x="62" y="930.5" font-size="19" fill="#102c47">shepherd; I shall not</text><text x="62" y="958.05" font-size="19" fill="#102c47">want.</text><text x="307.0" y="869.2" font-size="15" fill="#102c47" font-weight="700">WEB</text><text x="307.0" y="902.95" font-size="19" fill="#102c47">The LORD is my</text><text x="307.0" y="930.5" font-size="19" fill="#102c47">shepherd; I shall</text><text x="307.0" y="958.05" font-size="19" fill="#102c47">lack nothing.</text><text x="62" y="1000.5999999999999" font-size="14" fill="#486078">Add edition  ·  Link scrolling: On</text><path d="M64 1034.8999999999999v12 q0 8 8 8 h16 q8 0 8 8 v8" fill="none" stroke="#10324f" stroke-width="1.5" /><circle cx="64" cy="1034.8999999999999" r="2.5" fill="#10324f" /><text x="40" y="1095.8999999999999" font-size="17" fill="#102c47">Additional width supports a persistent comparison.</text><text x="40" y="1120.55" font-size="17" fill="#102c47">Resizing should preserve the reference.</text><text x="40" y="1160.2" font-size="16" fill="#102c47">Use when: A larger window supports sustained comparison</text><text x="40" y="1195.4" font-size="16" fill="#102c47">Consider: Resizing and extra panes need stable reading</text><text x="40" y="1218.6000000000001" font-size="16" fill="#102c47">anchors</text><text x="40" y="1296.8000000000002" font-size="15" fill="#102c47">Original illustrative interfaces · Static controls · Any Scripture samples identify their edition. Sample catalogue and resource details are</text><text x="40" y="1318.5500000000002" font-size="15" fill="#102c47">illustrative.</text><text x="40" y="1374.3000000000002" font-size="14" fill="#102c47">patterns.missional.design/patterns/parallel-reading-layout/</text></g></svg>