 leaves the verse in sight.</text><text x="1095" y="856.1500000000001" font-size="20" fill="#526b72">Text and help side by side, following or</text><text x="1095" y="883.1500000000001" font-size="20" fill="#526b72">pinned.</text><text x="55" y="946.1500000000001" font-size="16" fill="#526b72">SCHEMATIC TEXT ROWS, NOT LOADING STATES · ORIGINAL PROPOSALS · NOT PRODUCT SCREENSHOTS</text></g></svg><svg y="995" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1610 995" role="img" aria-labelledby="title-3 desc-3"><title id="title-3">Study helps</title><desc id="desc-3">2 English interface examples. From a preview card under the verse, through a sheet and a study panel, to a page of its own or help only on request: decide where commentary, cross-references and sermon clips open, how readers find them, and how they get back to the verse.</desc><rect width="1610" height="995" fill="#f6f9fa"/><g font-family="Arial, sans-serif"><text x="55" y="46" font-size="18" fill="#526b72" font-weight="700">BIBLE AND FAITH APP DESIGN PATTERNS</text><text x="55" y="110" font-size="40" fill="#122c35" font-weight="700">Study helps</text><text x="55" y="159.0" font-size="23" fill="#526b72">From a preview card under the verse, through a sheet and a study panel, to a page of its own or help only on request:</text><text x="55" y="190.05" font-size="23" fill="#526b72">decide where commentary, cross-references and sermon clips open, how readers find them, and how they get back to the</text><text x="55" y="221.10000000000002" font-size="23" fill="#526b72">verse.</text><rect x="55" y="329.15000000000003" width="475" height="485.0" rx="20" fill="#fff" stroke="#708892" stroke-width="2"/><text x="55" y="287.15000000000003" font-size="23" fill="#122c35" font-weight="700">D · Full page</text><text x="75" y="364.15000000000003" font-size="15" fill="#526b72">BIBLE STUDY · EXAMPLE</text><rect x="75" y="399.15000000000003" width="435" height="145" rx="10" fill="#fff" stroke="#aab2bd"/><text x="87" y="422.15000