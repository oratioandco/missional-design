<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1610 1990" role="img" aria-label="Children and families"><svg y="0" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1610 995" role="img" aria-labelledby="title-0 desc-0"><title id="title-0">Children and families</title><desc id="desc-0">3 English interface examples. From a story read aloud with a grown-up, through family time in a general app, a children’s Bible app and games with episodes, to a youth group app with a leader and a child alone with an AI or a public community: decide who is with the child, what the app collects, how it holds attention, and what happens when a child says something worrying.</desc><rect width="1610" height="995" fill="#f6f9fa"/><g font-family="Arial, sans-serif"><text x="55" y="46" font-size="18" fill="#526b72" font-weight="700">BIBLE AND FAITH APP DESIGN PATTERNS</text><text x="55" y="110" font-size="40" fill="#122c35" font-weight="700">Children and families</text><text x="55" y="159.0" font-size="23" fill="#526b72">From a story read aloud with a grown-up, through family time in a general app, a children’s Bible app and games with</text><text x="55" y="190.05" font-size="23" fill="#526b72">episodes, to a youth group app with a leader and a child alone with an AI or a public community: decide who is with the</text><text x="55" y="221.10000000000002" font-size="23" fill="#526b72">child, what the app collects, how it holds attention, and what happens when a child says something worrying.</text><rect x="55" y="329.15000000000003" width="475" height="485.0" rx="20" fill="#fff" stroke="#708892" stroke-width="2"/><text x="55" y="287.15000000000003" font-size="23" fill="#122c35" font-weight="700">A · Read together</text><text x="75" y="364.15000000000003" font-size="15" fill="#526b72">PRACTICE · EXAMPLE</text><text x="75" y="416.15000000000003" font-size="17" fill="#526b72">For reading together</text><text x="75" y="460.1" font-size="21" fill="#122c35">I wonder which part you like best</text><rect x="575" y="329.15000000000003" width="475" height="485.0" rx="20" fill="#fff" stroke="#708892" stroke-width="2"/><text x="575" y="287.15000000000003" font-size="23" fill="#122c35" font-weight="700">B · Family time in a general app</text><text x="595" y="364.15000000000003" font-size="15" fill="#526b72">PRACTICE · EXAMPLE</text><text x="595" y="425.15000000000003" font-size="26" fill="#122c35" font-weight="700">A Family Examen</text><rect x="595" y="451.25000000000006" width="435" height="55.35000000000002" rx="8" fill="#edf5f7" stroke="#bdd0d6"/><text x="610" y="484.25000000000006" font-size="21" fill="#122c35" font-weight="700">Play together</text><rect x="1095" y="329.15000000000003" width="475" height="485.0" rx="20" fill="#fff" stroke="#708892" stroke-width="2"/><text x="1095" y="287.15000000000003" font-size="23" fill="#122c35" font-weight="700">C · A children’s Bible app</text><text x="1115" y="364.15000000000003" font-size="15" fill="#526b72">PRACTICE · EXAMPLE</text><text x="1115" y="416.15000000000003" font-size="17" fill="#526b72">For grown-ups: hold to open</text><rect x="1115" y="439.1" width="435" height="55.35000000000002" rx="8" fill="#edf5f7" stroke="#bdd0d6"/><text x="1130" y="472.1" font-size="21" fill="#122c35" font-weight="700">Next story</text><text x="55" y="856.1500000000001" font-size="20" fill="#526b72">A story for a grown-up to read aloud, with</text><text x="55" y="883.1500000000001" font-size="20" fill="#526b72">questions to wonder about.</text><text x="575" y="856.1500000000001" font-size="20" fill="#526b72">Kids’ prayers and family plans beside the</text><text x="575" y="883.1500000000001" font-size="20" fill="#526b72">adult content.</text><text x="1095" y="856.1500000000001" font-size="20" fill="#526b72">No account, no ads, a parental gate.</text><text x="55" y="946.1500000000001" font-size="16" fill="#526b72">SCHEMATIC TEXT ROWS, NOT LOADING STATES · ORIGINAL PROPOSALS · NOT PRODUCT SCREENSHOTS</text></g></svg><svg y="995" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1610 995" role="img" aria-labelledby="title-3 desc-3"><title id="title-3">Children and families</title><desc id="desc-3">3 English interface examples. From a story read aloud with a grown-up, through family time in a general app, a children’s Bible app and games with episodes, to a youth group app with a leader and a child alone with an AI or a public community: decide who is with the child, what the app collects, how it holds attention, and what happens when a child says something worrying.</desc><rect width="1610" height="995" fill="#f6f9fa"/><g font-family="Arial, sans-serif"><text x="55" y="46" font-size="18" fill="#526b72" font-weight="700">BIBLE AND FAITH APP DESIGN PATTERNS</text><text x="55" y="110" font-size="40" fill="#122c35" font-weight="700">Children and families</text><text x="55" y="159.0" font-size="23" fill="#526b72">From a story read aloud with a grown-up, through family time in a general app, a children’s Bible app and games with</text><text x="55" y="190.05" font-size="23" fill="#526b72">episodes, to a youth group app with a leader and a child alone with an AI or a public community: decide who is with the</text><text x="55" y="221.10000000000002" font-size="23" fill="#526b72">child, what the app collects, how it holds attention, and what happens when a child says something worrying.</text><rect x="55" y="329.15000000000003" width="475" height="485.0" rx="20" fill="#fff" stroke="#708892" stroke-width="2"/><text x="55" y="287.15000000000003" font-size="23" fill="#122c35" font-weight="700">D · Games and episodes</text><text x="75" y="364.15000000000003" font-size="15" fill="#526b72">PRACTICE · EXAMPLE</text><text x="75" y="416.15000000000003" font-size="17" fill="#526b72">3 stars collected</text><rect x="75" y="439.1" width="435" height="55.35000000000002" rx="8" fill="#edf5f7" stroke="#bdd0d6"/><text x="90" y="472.1" font-size="21" fill="#122c35" font-weight="700">Next episode</text><rect x="575" y="329.15000000000003" width="475" height="485.0" rx="20" fill="#fff" stroke="#708892" stroke-width="2"/><text x="575" y="287.15000000000003" font-size="23" fill="#122c35" font-weight="700">E · A youth group with a leader</text><text x="595" y="364.15000000000003" font-size="15" fill="#526b72">PRACTICE · EXAMPLE</text><text x="595" y="416.15000000000003" font-size="17" fill="#526b72">Confirmation group · 2 leaders</text><rect x="595" y="439.1" width="435" height="55.35000000000002" rx="8" fill="#edf5f7" stroke="#bdd0d6"/><text x="610" y="472.1" font-size="21" fill="#122c35" font-weight="700">Write in your diary</text><rect x="1095" y="329.15000000000003" width="475" height="485.0" rx="20" fill="#fff" stroke="#708892" stroke-width="2"/><text x="1095" y="287.15000000000003" font-size="23" fill="#122c35" font-weight="700">F · A child alone with an AI or a</text><text x="1095" y="318.20000000000005" font-size="23" fill="#122c35" font-weight="700">community</text><text x="1115" y="364.15000000000003" font-size="15" fill="#526b72">PRACTICE · EXAMPLE</text><text x="1115" y="425.15000000000003" font-size="26" fill="#122c35" font-weight="700">Ask me anything</text><text x="1115" y="472.25000000000006" font-size="21" fill="#122c35">Rated 4+</text><text x="55" y="856.1500000000001" font-size="20" fill="#526b72">Videos, games and rewards around the</text><text x="55" y="883.1500000000001" font-size="20" fill="#526b72">stories.</text><text x="575" y="856.1500000000001" font-size="20" fill="#526b72">Parents’ consent, two leaders, a named</text><text x="575" y="883.1500000000001" font-size="20" fill="#526b72">contact.</text><text x="1095" y="856.1500000000001" font-size="20" fill="#526b72">An open chat or public thread, rated for all</text><text x="1095" y="883.1500000000001" font-size="20" fill="#526b72">ages.</text><text x="55" y="946.1500000000001" font-size="16" fill="#526b72">SCHEMATIC TEXT ROWS, NOT LOADING STATES · ORIGINAL PROPOSALS · NOT PRODUCT SCREENSHOTS</text></g></svg></svg>