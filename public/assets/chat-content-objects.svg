<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1653" role="img" aria-labelledby="title desc"><title id="title">Chat contains source objects, not just bubbles</title><desc id="desc">4 annotated interface examples with use cases and tradeoffs. Scripture samples are identified by edition.</desc><rect width="1200" height="1653" fill="#f6f5f2"/><g font-family="Arial, sans-serif"><text x="40" y="65" font-size="30" fill="#17202a" font-weight="700">Chat contains source objects, not just bubbles</text><text x="40" y="116.5" font-size="18" fill="#17202a">References, quotations, external resources and media can appear together. These are complementary content types.</text><text x="40" y="181.6" font-size="23" fill="#17202a" font-weight="700">A · Reference link</text><rect x="40" y="209.95" width="510" height="278.9" rx="6" fill="white" stroke="#8a959f"/><text x="62" y="247.95" font-size="18" fill="#17202a" font-weight="700">Conversation</text><text x="62" y="297.05" font-size="17" fill="#17202a">You can begin with Psalm 23.</text><text x="62" y="337.7" font-size="17" fill="#17202a">Psalm 23 · BSB</text><rect x="62" y="361.34999999999997" width="466" height="99.5" rx="6" fill="#fff" stroke="#b8c0c8"/><text x="76" y="392.34999999999997" font-size="17" fill="#17202a">Ask a follow-up…</text><text x="76" y="440.99999999999994" font-size="13" fill="#17202a">+ Add context                         Send</text><path d="M64 488.84999999999997v12 q0 8 8 8 h16 q8 0 8 8 v8" fill="none" stroke="#000462" stroke-width="1.5"/><circle cx="64" cy="488.84999999999997" r="2.5" fill="#000462"/><text x="40" y="549.8499999999999" font-size="17" fill="#17202a">A reference is a destination. It need not expand into a</text><text x="40" y="574.4999999999999" font-size="17" fill="#17202a">quotation in every answer.</text><text x="40" y="614.1499999999999" font-size="16" fill="#17202a">Use when: The reference itself is sufficient and the reader</text><text x="40" y="637.3499999999999" font-size="16" fill="#17202a">can choose to open it</text><text x="40" y="672.55" font-size="16" fill="#17202a">Consider: A link alone does not show what the cited text</text><text x="40" y="695.75" font-size="16" fill="#17202a">says; avoid making it carry an unsupported claim.</text><text x="620" y="181.6" font-size="23" fill="#17202a" font-weight="700">B · Verse quotation</text><rect x="620" y="209.95" width="510" height="372.95" rx="6" fill="white" stroke="#8a959f"/><text x="642" y="247.95" font-size="18" fill="#17202a" font-weight="700">Conversation</text><text x="642" y="297.05" font-size="17" fill="#17202a">Here is the opening verse.</text><rect x="642" y="320.7" width="466" height="82.40000000000003" rx="6" fill="#f5f4f0" stroke="#b8c0c8"/><text x="656" y="347.7" font-size="13" fill="#17202a" font-weight="700">Psalm 23:1 · BSB</text><text x="656" y="380.55" font-size="19" fill="#17202a">The LORD is my shepherd; I shall not want.</text><text x="642" y="433.1" font-size="14" fill="#43516a">Read in context  ·  Copy with reference</text><rect x="642" y="455.40000000000003" width="466" height="99.49999999999994" rx="6" fill="#fff" stroke="#b8c0c8"/><text x="656" y="486.40000000000003" font-size="17" fill="#17202a">Ask a follow-up…</text><text x="656" y="535.05" font-size="13" fill="#17202a">+ Add context                         Send</text><path d="M644 582.9v12 q0 8 8 8 h16 q8 0 8 8 v8" fill="none" stroke="#000462" stroke-width="1.5"/><circle cx="644" cy="582.9" r="2.5" fill="#000462"/><text x="620" y="643.9" font-size="17" fill="#17202a">The verse is an attributed source object, visually</text><text x="620" y="668.55" font-size="17" fill="#17202a">distinct from the assistant’s wording.</text><text x="620" y="708.1999999999999" font-size="16" fill="#17202a">Use when: The exact wording matters to the response</text><text x="620" y="743.4" font-size="16" fill="#17202a">Consider: Keep the edition and excerpt boundary visible;</text><text x="620" y="766.6" font-size="16" fill="#17202a">longer text may need a dedicated reader.</text><text x="40" y="852.8000000000001" font-size="23" fill="#17202a" font-weight="700">C · External resource</text><rect x="40" y="881.1500000000001" width="510" height="370.9499999999998" rx="6" fill="white" stroke="#8a959f"/><text x="62" y="919.1500000000001" font-size="18" fill="#17202a" font-weight="700">Conversation</text><text x="62" y="968.2500000000001" font-size="17" fill="#17202a">A related resource is available.</text><rect x="62" y="991.9000000000001" width="466" height="80.39999999999986" rx="6" fill="#fff" stroke="#b8c0c8"/><text x="76" y="1023.9000000000001" font-size="18" fill="#17202a" font-weight="700">Reading the Psalms</text><text x="76" y="1052.0" font-size="14" fill="#17202a">Example publisher · example.org</text><text x="62" y="1102.3" font-size="14" fill="#43516a">Open source article</text><rect x="62" y="1124.6" width="466" height="99.5" rx="6" fill="#fff" stroke="#b8c0c8"/><text x="76" y="1155.6" font-size="17" fill="#17202a">Ask a follow-up…</text><text x="76" y="1204.25" font-size="13" fill="#17202a">+ Add context                         Send</text><path d="M64 1252.1v12 q0 8 8 8 h16 q8 0 8 8 v8" fill="none" stroke="#000462" stroke-width="1.5"/><circle cx="64" cy="1252.1" r="2.5" fill="#000462"/><text x="40" y="1313.1" font-size="17" fill="#17202a">An external resource needs an identifiable publisher and</text><text x="40" y="1337.75" font-size="17" fill="#17202a">destination even when no preview is available.</text><text x="40" y="1362.4" font-size="17" fill="#17202a">Illustrative resource title; not a reviewed</text><text x="40" y="1387.0500000000002" font-size="17" fill="#17202a">recommendation.</text><text x="40" y="1426.7000000000003" font-size="16" fill="#17202a">Use when: An external article is the evidence object</text><text x="40" y="1461.9000000000003" font-size="16" fill="#17202a">Consider: An unavailable preview must retain a usable link</text><text x="620" y="852.8000000000001" font-size="23" fill="#17202a" font-weight="700">D · Media object</text><rect x="620" y="881.1500000000001" width="510" height="330.29999999999995" rx="6" fill="white" stroke="#8a959f"/><text x="642" y="919.1500000000001" font-size="18" fill="#17202a" font-weight="700">Conversation</text><rect x="642" y="951.2500000000001" width="466" height="80.39999999999998" rx="6" fill="#f5f4f0" stroke="#b8c0c8"/><text x="656" y="983.2500000000001" font-size="18" fill="#17202a" font-weight="700">Reading the Psalms</text><text x="656" y="1011.3500000000001" font-size="14" fill="#17202a">Example publisher · 04:20</text><text x="642" y="1061.65" font-size="14" fill="#43516a">Play  ·  Captions  ·  Transcript</text><rect x="642" y="1083.95" width="466" height="99.5" rx="6" fill="#fff" stroke="#b8c0c8"/><text x="656" y="1114.95" font-size="17" fill="#17202a">Ask a follow-up…</text><text x="656" y="1163.6000000000001" font-size="13" fill="#17202a">+ Add context                         Send</text><path d="M644 1211.45v12 q0 8 8 8 h16 q8 0 8 8 v8" fill="none" stroke="#000462" stroke-width="1.5"/><circle cx="644" cy="1211.45" r="2.5" fill="#000462"/><text x="620" y="1272.45" font-size="17" fill="#17202a">Media controls belong to one named object. Duration and</text><text x="620" y="1297.1000000000001" font-size="17" fill="#17202a">transcript access are not chat messages. Illustrative</text><text x="620" y="1321.7500000000002" font-size="17" fill="#17202a">media object; no playable video.</text><text x="620" y="1361.4000000000003" font-size="16" fill="#17202a">Use when: Audio or video is relevant to the question</text><text x="620" y="1396.6000000000004" font-size="16" fill="#17202a">Consider: No autoplay and an accessible alternative are</text><text x="620" y="1419.8000000000004" font-size="16" fill="#17202a">needed</text><text x="40" y="1540.1000000000004" font-size="15" fill="#17202a">Original illustrative interfaces · Static controls · Any Scripture samples identify their edition. Sample catalogue and resource details are</text><text x="40" y="1561.8500000000004" font-size="15" fill="#17202a">illustrative.</text><text x="40" y="1617.6000000000004" font-size="14" fill="#17202a">patterns.missional.design/patterns/chat-content-objects/</text></g></svg>