<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1186" role="img" aria-labelledby="title desc" data-illustration-theme="light"><title id="title">Adjust reading settings without losing the passage</title><desc id="desc">1 annotated interface examples with use cases and tradeoffs. Scripture samples are identified by edition.</desc><rect width="1200" height="1186" fill="#edf5f9" /><g font-family="Arial, sans-serif"><text x="40" y="65" font-size="30" fill="#102c47" font-weight="700">Adjust reading settings without losing the passage</text><text x="40" y="116.5" font-size="18" fill="#102c47">The passage provides context for presentation choices. On a larger screen, a side panel can retain more readable</text><text x="40" y="142.6" font-size="18" fill="#102c47">preview space.</text><text x="40" y="207.7" font-size="23" fill="#102c47" font-weight="700">A · Bottom drawer</text><rect x="40" y="236.04999999999998" width="510" height="526.4500000000002" rx="8" fill="#ffffff" stroke="#9aafbf" /><text x="62" y="274.04999999999995" font-size="18" fill="#102c47" font-weight="700">Psalm 23 · BSB</text><text x="62" y="318.15" font-size="12" fill="#102c47">1</text><text x="90" y="325.15" font-size="19" fill="#102c47">The LORD is my shepherd; I shall not want.</text><rect x="62" y="347.7" width="466" height="348.50000000000017" rx="12" fill="#f3f7fa" stroke="#9aafbf" /><text x="76" y="381.7" font-size="18" fill="#102c47" font-weight="700">Reading settings · Close</text><text x="76" y="423.8" font-size="16" fill="#102c47">Theme: Light / Dark</text><text x="76" y="465.0" font-size="16" fill="#102c47">Font: Serif</text><text x="76" y="506.2" font-size="16" fill="#102c47">Text size: 20</text><text x="76" y="547.4" font-size="16" fill="#102c47">Line spacing: Comfortable</text><text x="76" y="588.6" font-size="16" fill="#102c47">Verse numbers: On</text><text x="76" y="629.8000000000001" font-size="16" fill="#102c47">Note indicators: On</text><text x="76" y="671.0000000000001" font-size="16" fill="#102c47">Section headings: On</text><text x="62" y="728.2000000000002" font-size="14" fill="#486078">Reset reading settings</text><path d="M64 762.5000000000001v12 q0 8 8 8 h16 q8 0 8 8 v8" fill="none" stroke="#10324f" stroke-width="1.5" /><circle cx="64" cy="762.5000000000001" r="2.5" fill="#10324f" /><text x="40" y="823.5000000000001" font-size="17" fill="#102c47">The passage remains visible above the drawer. These are</text><text x="40" y="848.1500000000001" font-size="17" fill="#102c47">original proposals informed by the contributed Mere</text><text x="40" y="872.8000000000001" font-size="17" fill="#102c47">Bible screen.</text><text x="40" y="912.45" font-size="16" fill="#102c47">Use when: A mobile reader needs occasional adjustments in</text><text x="40" y="935.6500000000001" font-size="16" fill="#102c47">context</text><text x="40" y="970.8500000000001" font-size="16" fill="#102c47">Consider: A tall drawer leaves little preview; support</text><text x="40" y="994.0500000000002" font-size="16" fill="#102c47">scrolling controls and an explicit close action.</text><text x="40" y="1072.2500000000002" font-size="15" fill="#102c47">Original illustrative interfaces · Static controls · Any Scripture samples identify their edition. Sample catalogue and resource details are</text><text x="40" y="1094.0000000000002" font-size="15" fill="#102c47">illustrative.</text><text x="40" y="1149.7500000000002" font-size="14" fill="#102c47">patterns.missional.design/patterns/reading-settings/</text></g></svg>