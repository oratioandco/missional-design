<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1647" role="img" aria-labelledby="title desc" data-illustration-theme="dark"><title id="title">Passage preview opens a full reader</title><desc id="desc">3 annotated interface examples with use cases and tradeoffs. Scripture samples are identified by edition.</desc><rect width="1200" height="1647" fill="#102333" /><g font-family="Arial, sans-serif"><text x="40" y="65" font-size="30" fill="#e8f1f7" font-weight="700">Passage preview opens a full reader</text><text x="40" y="116.5" font-size="18" fill="#e8f1f7">Keep long Scripture readable without flooding the conversation.</text><text x="40" y="181.6" font-size="23" fill="#e8f1f7" font-weight="700">A · Passage preview</text><rect x="40" y="209.95" width="510" height="372.95" rx="6" fill="#162e40" stroke="#668399" /><text x="62" y="247.95" font-size="18" fill="#e8f1f7" font-weight="700">Conversation</text><text x="62" y="297.05" font-size="17" fill="#e8f1f7">Read Psalm 23 alongside this question.</text><rect x="62" y="320.7" width="466" height="82.40000000000003" rx="6" fill="#203b50" stroke="#668399" /><text x="76" y="347.7" font-size="13" fill="#e8f1f7" font-weight="700">Psalm 23:1 · BSB · Preview</text><text x="76" y="380.55" font-size="19" fill="#e8f1f7">The LORD is my shepherd; I shall not want.</text><text x="62" y="433.1" font-size="14" fill="#b9cddd">Read all 6 verses</text><rect x="62" y="455.40000000000003" width="466" height="99.49999999999994" rx="6" fill="#162e40" stroke="#668399" /><text x="76" y="486.40000000000003" font-size="17" fill="#e8f1f7">Ask a follow-up…</text><text x="76" y="535.05" font-size="13" fill="#e8f1f7">+ Add context                         Send</text><path d="M64 582.9v12 q0 8 8 8 h16 q8 0 8 8 v8" fill="none" stroke="#a7d2f0" stroke-width="1.5" /><circle cx="64" cy="582.9" r="2.5" fill="#a7d2f0" /><text x="40" y="643.9" font-size="17" fill="#e8f1f7">Mark the excerpt boundary and preserve a clear route to</text><text x="40" y="668.55" font-size="17" fill="#e8f1f7">all requested verses.</text><text x="40" y="708.1999999999999" font-size="16" fill="#e8f1f7">Use when: The passage supports a conversation</text><text x="40" y="743.4" font-size="16" fill="#e8f1f7">Consider: Excerpt boundaries and a full-text route are</text><text x="40" y="766.6" font-size="16" fill="#e8f1f7">essential</text><text x="620" y="181.6" font-size="23" fill="#e8f1f7" font-weight="700">B · Dedicated reader</text><rect x="620" y="209.95" width="510" height="325.7000000000001" rx="6" fill="#162e40" stroke="#668399" /><text x="642" y="247.95" font-size="18" fill="#e8f1f7" font-weight="700">Psalm 23 · BSB</text><text x="642" y="294.05" font-size="14" fill="#b9cddd">Back to conversation</text><text x="642" y="328.35" font-size="12" fill="#e8f1f7">1</text><text x="670" y="335.35" font-size="19" fill="#e8f1f7">The LORD is my shepherd; I shall not want.</text><text x="642" y="369.90000000000003" font-size="12" fill="#e8f1f7">2</text><text x="670" y="376.90000000000003" font-size="19" fill="#e8f1f7">He makes me lie down in green pastures; He</text><text x="670" y="404.45000000000005" font-size="19" fill="#e8f1f7">leads me beside quiet waters.</text><text x="642" y="439.00000000000006" font-size="12" fill="#e8f1f7">3</text><text x="670" y="446.00000000000006" font-size="19" fill="#e8f1f7">He restores my soul; He guides me in the</text><text x="670" y="473.55000000000007" font-size="19" fill="#e8f1f7">paths of righteousness for the sake of His</text><text x="670" y="501.1000000000001" font-size="19" fill="#e8f1f7">name.</text><path d="M644 535.6500000000001v12 q0 8 8 8 h16 q8 0 8 8 v8" fill="none" stroke="#a7d2f0" stroke-width="1.5" /><circle cx="644" cy="535.6500000000001" r="2.5" fill="#a7d2f0" /><text x="620" y="596.6500000000001" font-size="17" fill="#e8f1f7">A dedicated reader gives the passage room. Returning</text><text x="620" y="621.3000000000001" font-size="17" fill="#e8f1f7">should restore the conversation position. Diagram shows</text><text x="620" y="645.95" font-size="17" fill="#e8f1f7">verses 1–3; the reader continues.</text><text x="620" y="685.6" font-size="16" fill="#e8f1f7">Use when: The user wants sustained or complete reading</text><text x="620" y="720.8000000000001" font-size="16" fill="#e8f1f7">Consider: Moving surfaces requires conversation-position</text><text x="620" y="744.0000000000001" font-size="16" fill="#e8f1f7">restoration</text><text x="40" y="852.8000000000001" font-size="23" fill="#e8f1f7" font-weight="700">C · Complete inline passage</text><rect x="40" y="881.1500000000001" width="510" height="366.3499999999997" rx="6" fill="#162e40" stroke="#668399" /><text x="62" y="919.1500000000001" font-size="18" fill="#e8f1f7" font-weight="700">Conversation</text><text x="62" y="968.2500000000001" font-size="17" fill="#e8f1f7">Psalm 23 · BSB</text><text x="62" y="1003.9000000000001" font-size="12" fill="#e8f1f7">1</text><text x="90" y="1010.9000000000001" font-size="19" fill="#e8f1f7">The LORD is my shepherd; I shall not want.</text><text x="62" y="1045.45" font-size="12" fill="#e8f1f7">2</text><text x="90" y="1052.45" font-size="19" fill="#e8f1f7">He makes me lie down in green pastures; He</text><text x="90" y="1080.0" font-size="19" fill="#e8f1f7">leads me beside quiet waters.</text><text x="62" y="1114.55" font-size="12" fill="#e8f1f7">3</text><text x="90" y="1121.55" font-size="19" fill="#e8f1f7">He restores my soul; He guides me in the</text><text x="90" y="1149.1" font-size="19" fill="#e8f1f7">paths of righteousness for the sake of His</text><text x="90" y="1176.6499999999999" font-size="19" fill="#e8f1f7">name.</text><text x="62" y="1213.1999999999998" font-size="14" fill="#b9cddd">Collapse passage</text><path d="M64 1247.4999999999998v12 q0 8 8 8 h16 q8 0 8 8 v8" fill="none" stroke="#a7d2f0" stroke-width="1.5" /><circle cx="64" cy="1247.4999999999998" r="2.5" fill="#a7d2f0" /><text x="40" y="1308.4999999999998" font-size="17" fill="#e8f1f7">An expanded passage uses the conversation’s main scroll,</text><text x="40" y="1333.1499999999999" font-size="17" fill="#e8f1f7">not a second scrollable box. Diagram shows the start of</text><text x="40" y="1357.8" font-size="17" fill="#e8f1f7">the expanded passage.</text><text x="40" y="1397.45" font-size="16" fill="#e8f1f7">Use when: The complete passage remains manageable inline</text><text x="40" y="1432.65" font-size="16" fill="#e8f1f7">Consider: Expansion and collapse must preserve the main</text><text x="40" y="1455.8500000000001" font-size="16" fill="#e8f1f7">scroll anchor</text><text x="40" y="1534.0500000000002" font-size="15" fill="#e8f1f7">Original illustrative interfaces · Static controls · Any Scripture samples identify their edition. Sample catalogue and resource details are</text><text x="40" y="1555.8000000000002" font-size="15" fill="#e8f1f7">illustrative.</text><text x="40" y="1611.5500000000002" font-size="14" fill="#e8f1f7">patterns.missional.design/patterns/long-passages/</text></g></svg>