<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1647" role="img" aria-labelledby="title desc" data-illustration-theme="light"><title id="title">Show what the chat will use before sending</title><desc id="desc">3 annotated interface examples with use cases and tradeoffs. Scripture samples are identified by edition.</desc><rect width="1200" height="1647" fill="#edf5f9" /><g font-family="Arial, sans-serif"><text x="40" y="65" font-size="30" fill="#102c47" font-weight="700">Show what the chat will use before sending</text><text x="40" y="116.5" font-size="18" fill="#102c47">These screens show selection, review and recovery. They are states of one flow, not competing designs.</text><text x="40" y="181.6" font-size="23" fill="#102c47" font-weight="700">A · Choose context</text><rect x="40" y="209.95" width="510" height="396.84999999999997" rx="6" fill="#ffffff" stroke="#9aafbf" /><text x="62" y="247.95" font-size="18" fill="#102c47" font-weight="700">Ask about Scripture</text><text x="62" y="297.05" font-size="17" fill="#102c47">What would you like to explore?</text><text x="72" y="344.7" font-size="16" fill="#102c47">Bible passage</text><path d="M62 368.9h466" stroke="#9aafbf" /><text x="72" y="392.9" font-size="16" fill="#102c47">File or image</text><path d="M62 417.09999999999997h466" stroke="#9aafbf" /><text x="72" y="441.09999999999997" font-size="16" fill="#102c47">Source link</text><path d="M62 465.29999999999995h466" stroke="#9aafbf" /><rect x="62" y="479.29999999999995" width="466" height="99.5" rx="6" fill="#ffffff" stroke="#9aafbf" /><text x="76" y="510.29999999999995" font-size="17" fill="#102c47">Ask a question…</text><text x="76" y="558.9499999999999" font-size="13" fill="#102c47">+ Add context                         Send</text><path d="M64 606.8v12 q0 8 8 8 h16 q8 0 8 8 v8" fill="none" stroke="#10324f" stroke-width="1.5" /><circle cx="64" cy="606.8" r="2.5" fill="#10324f" /><text x="40" y="667.8" font-size="17" fill="#102c47">The attachment menu names what can become context; it</text><text x="40" y="692.4499999999999" font-size="17" fill="#102c47">does not imply every item is sent immediately.</text><text x="40" y="732.0999999999999" font-size="16" fill="#102c47">Use when: The composer should remain simple until context is</text><text x="40" y="755.3" font-size="16" fill="#102c47">needed</text><text x="40" y="790.5" font-size="16" fill="#102c47">Consider: A generic plus icon alone may conceal the feature.</text><text x="620" y="181.6" font-size="23" fill="#102c47" font-weight="700">B · Review before send</text><rect x="620" y="209.95" width="510" height="390.40000000000003" rx="6" fill="#ffffff" stroke="#9aafbf" /><text x="642" y="247.95" font-size="18" fill="#102c47" font-weight="700">Review your question</text><rect x="642" y="280.05" width="466" height="80.40000000000003" rx="6" fill="#ffffff" stroke="#9aafbf" /><text x="656" y="312.05" font-size="18" fill="#102c47" font-weight="700">Psalm 23:1–3 · BSB</text><text x="656" y="340.15000000000003" font-size="14" fill="#102c47">Ready · Remove</text><rect x="642" y="376.45000000000005" width="466" height="80.40000000000003" rx="6" fill="#ffffff" stroke="#9aafbf" /><text x="656" y="408.45000000000005" font-size="18" fill="#102c47" font-weight="700">Study notes.pdf · 3 pages</text><text x="656" y="436.55000000000007" font-size="14" fill="#102c47">Text extracted · Remove</text><rect x="642" y="472.8500000000001" width="466" height="99.49999999999994" rx="6" fill="#ffffff" stroke="#9aafbf" /><text x="656" y="503.8500000000001" font-size="17" fill="#102c47">How do these sources differ?</text><text x="656" y="552.5" font-size="13" fill="#102c47">+ 2 items                         Send</text><path d="M644 600.35v12 q0 8 8 8 h16 q8 0 8 8 v8" fill="none" stroke="#10324f" stroke-width="1.5" /><circle cx="644" cy="600.35" r="2.5" fill="#10324f" /><text x="620" y="661.35" font-size="17" fill="#102c47">Show included items and their processing state before</text><text x="620" y="686.0" font-size="17" fill="#102c47">the person sends.</text><text x="620" y="725.65" font-size="16" fill="#102c47">Use when: A question depends on several sources</text><text x="620" y="760.85" font-size="16" fill="#102c47">Consider: State size or scope and processing status; avoid a</text><text x="620" y="784.0500000000001" font-size="16" fill="#102c47">stack of oversized cards.</text><text x="40" y="876.7" font-size="23" fill="#102c47" font-weight="700">C · Partial or failed input</text><rect x="40" y="905.0500000000001" width="510" height="366.6" rx="6" fill="#ffffff" stroke="#9aafbf" /><text x="62" y="943.0500000000001" font-size="18" fill="#102c47" font-weight="700">Review your question</text><rect x="62" y="975.1500000000001" width="466" height="80.40000000000009" rx="6" fill="#ffffff" stroke="#9aafbf" /><text x="76" y="1007.1500000000001" font-size="18" fill="#102c47" font-weight="700">Photo of notes</text><text x="76" y="1035.25" font-size="14" fill="#102c47">Text could not be read</text><text x="62" y="1085.5500000000002" font-size="14" fill="#486078">Replace image  ·  Remove</text><rect x="62" y="1107.8500000000001" width="466" height="99.5" rx="6" fill="#ffffff" stroke="#9aafbf" /><text x="76" y="1138.8500000000001" font-size="17" fill="#102c47">Help me explore this passage.</text><text x="76" y="1187.5000000000002" font-size="13" fill="#102c47">+ Draft saved                 Send unavailable</text><text x="62" y="1237.3500000000001" font-size="14" fill="#486078">Remove or replace the unreadable attachment before sending.</text><path d="M64 1271.65v12 q0 8 8 8 h16 q8 0 8 8 v8" fill="none" stroke="#10324f" stroke-width="1.5" /><circle cx="64" cy="1271.65" r="2.5" fill="#10324f" /><text x="40" y="1332.65" font-size="17" fill="#102c47">A failed attachment must not silently become context.</text><text x="40" y="1357.3000000000002" font-size="17" fill="#102c47">Keep the draft and offer recovery.</text><text x="40" y="1396.9500000000003" font-size="16" fill="#102c47">Use when: Upload or text extraction fails or is incomplete</text><text x="40" y="1432.1500000000003" font-size="16" fill="#102c47">Consider: Do not silently answer as if the missing content</text><text x="40" y="1455.3500000000004" font-size="16" fill="#102c47">was read.</text><text x="40" y="1533.5500000000004" font-size="15" fill="#102c47">Original illustrative interfaces · Static controls · Any Scripture samples identify their edition. Sample catalogue and resource details are</text><text x="40" y="1555.3000000000004" font-size="15" fill="#102c47">illustrative.</text><text x="40" y="1611.0500000000004" font-size="14" fill="#102c47">patterns.missional.design/patterns/chat-attachments/</text></g></svg>