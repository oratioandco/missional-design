styles</text><text x="1130" y="563.4" font-size="18" fill="#526b72">Important</text><text x="1130" y="587.6999999999999" font-size="18" fill="#526b72">Question</text><text x="1130" y="611.9999999999999" font-size="18" fill="#526b72">No label.</text><rect x="1115" y="649.2999999999998" width="435" height="55.35000000000002" rx="8" fill="#edf5f7" stroke="#bdd0d6"/><text x="1130" y="682.2999999999998" font-size="21" fill="#122c35" font-weight="700">Name a style</text><rect x="1115" y="720.6499999999999" width="435" height="55.35000000000002" rx="8" fill="#edf5f7" stroke="#bdd0d6"/><text x="1130" y="753.6499999999999" font-size="21" fill="#122c35" font-weight="700">Use colour only</text><text x="55" y="895.4000000000001" font-size="20" fill="#526b72">Organisation can wait.</text><text x="575" y="895.4000000000001" font-size="20" fill="#526b72">Exact text and a passage reference have</text><text x="575" y="922.4000000000001" font-size="20" fill="#526b72">different scope.</text><text x="1095" y="895.4000000000001" font-size="20" fill="#526b72">The user defines whether a mark has a</text><text x="1095" y="922.4000000000001" font-size="20" fill="#526b72">meaning.</text><text x="55" y="985.4000000000001" font-size="16" fill="#526b72">SCHEMATIC TEXT ROWS, NOT LOADING STATES · ORIGINAL PROPOSALS · NOT PRODUCT SCREENSHOTS</text></g></svg>