<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1504" role="img" aria-labelledby="title desc" data-illustration-theme="dark"><title id="title">Verse numbers that help without taking over</title><desc id="desc">3 annotated interface examples with use cases and tradeoffs. Scripture samples are identified by edition.</desc><rect width="1200" height="1504" fill="#102333" /><g font-family="Arial, sans-serif"><text x="40" y="65" font-size="30" fill="#e8f1f7" font-weight="700">Verse numbers that help without taking over</text><text x="40" y="116.5" font-size="18" fill="#e8f1f7">Separate locating a verse from the precision needed to select it.</text><text x="40" y="181.6" font-size="23" fill="#e8f1f7" font-weight="700">A · Inline numbers</text><rect x="40" y="209.95" width="510" height="272.1500000000001" rx="6" fill="#162e40" stroke="#668399" /><text x="62" y="247.95" font-size="18" fill="#e8f1f7" font-weight="700">Luke 15 · BSB</text><text x="62" y="299.05" font-size="19" fill="#e8f1f7">1 Now all the tax collectors and sinners were</text><text x="62" y="326.6" font-size="19" fill="#e8f1f7">gathering around to listen to Jesus. 2 So the</text><text x="62" y="354.15000000000003" font-size="19" fill="#e8f1f7">Pharisees and scribes began to grumble: “This</text><text x="62" y="381.70000000000005" font-size="19" fill="#e8f1f7">man welcomes sinners and eats with them.” 3</text><text x="62" y="409.25000000000006" font-size="19" fill="#e8f1f7">Then Jesus told them this parable:</text><text x="62" y="447.80000000000007" font-size="14" fill="#b9cddd">Select a verse</text><path d="M64 482.1000000000001v12 q0 8 8 8 h16 q8 0 8 8 v8" fill="none" stroke="#a7d2f0" stroke-width="1.5" /><circle cx="64" cy="482.1000000000001" r="2.5" fill="#a7d2f0" /><text x="40" y="543.1000000000001" font-size="17" fill="#e8f1f7">Keep inline numbers visually quiet and offer a larger</text><text x="40" y="567.7500000000001" font-size="17" fill="#e8f1f7">selection target.</text><text x="40" y="607.4000000000001" font-size="16" fill="#e8f1f7">Use when: Reading and occasional lookup share the same</text><text x="40" y="630.6000000000001" font-size="16" fill="#e8f1f7">surface</text><text x="40" y="665.8000000000002" font-size="16" fill="#e8f1f7">Consider: Use a separate selection action rather than a tiny</text><text x="40" y="689.0000000000002" font-size="16" fill="#e8f1f7">number as the only target.</text><text x="620" y="181.6" font-size="23" fill="#e8f1f7" font-weight="700">B · Margin numbers</text><rect x="620" y="209.95" width="510" height="325.7000000000001" rx="6" fill="#162e40" stroke="#668399" /><text x="642" y="247.95" font-size="18" fill="#e8f1f7" font-weight="700">Luke 15 · BSB</text><text x="642" y="292.05" font-size="12" fill="#e8f1f7">1</text><text x="670" y="299.05" font-size="19" fill="#e8f1f7">Now all the tax collectors and sinners were</text><text x="670" y="326.6" font-size="19" fill="#e8f1f7">gathering around to listen to Jesus.</text><text x="642" y="361.15000000000003" font-size="12" fill="#e8f1f7">2</text><text x="670" y="368.15000000000003" font-size="19" fill="#e8f1f7">So the Pharisees and scribes began to</text><text x="670" y="395.70000000000005" font-size="19" fill="#e8f1f7">grumble: “This man welcomes sinners and</text><text x="670" y="423.25000000000006" font-size="19" fill="#e8f1f7">eats with them.”</text><text x="642" y="457.80000000000007" font-size="12" fill="#e8f1f7">3</text><text x="670" y="464.80000000000007" font-size="19" fill="#e8f1f7">Then Jesus told them this parable:</text><text x="642" y="501.3500000000001" font-size="14" fill="#b9cddd">Select a verse</text><path d="M644 535.6500000000001v12 q0 8 8 8 h16 q8 0 8 8 v8" fill="none" stroke="#a7d2f0" stroke-width="1.5" /><circle cx="644" cy="535.6500000000001" r="2.5" fill="#a7d2f0" /><text x="620" y="596.6500000000001" font-size="17" fill="#e8f1f7">Align each margin number with the start of its verse,</text><text x="620" y="621.3000000000001" font-size="17" fill="#e8f1f7">including after text wraps.</text><text x="620" y="660.95" font-size="16" fill="#e8f1f7">Use when: People frequently follow or discuss numbered</text><text x="620" y="684.1500000000001" font-size="16" fill="#e8f1f7">references</text><text x="620" y="719.3500000000001" font-size="16" fill="#e8f1f7">Consider: A margin consumes width; wrapped verses need</text><text x="620" y="742.5500000000002" font-size="16" fill="#e8f1f7">unambiguous alignment.</text><text x="40" y="828.7500000000002" font-size="23" fill="#e8f1f7" font-weight="700">C · Quiet reading</text><rect x="40" y="857.1000000000003" width="510" height="272.14999999999975" rx="6" fill="#162e40" stroke="#668399" /><text x="62" y="895.1000000000003" font-size="18" fill="#e8f1f7" font-weight="700">Luke 15 · BSB</text><text x="62" y="946.2000000000003" font-size="19" fill="#e8f1f7">Now all the tax collectors and sinners were</text><text x="62" y="973.7500000000002" font-size="19" fill="#e8f1f7">gathering around to listen to Jesus. So the</text><text x="62" y="1001.3000000000002" font-size="19" fill="#e8f1f7">Pharisees and scribes began to grumble: “This</text><text x="62" y="1028.8500000000001" font-size="19" fill="#e8f1f7">man welcomes sinners and eats with them.” Then</text><text x="62" y="1056.4" font-size="19" fill="#e8f1f7">Jesus told them this parable:</text><text x="62" y="1094.95" font-size="14" fill="#b9cddd">Show verse numbers  ·  Select</text><path d="M64 1129.25v12 q0 8 8 8 h16 q8 0 8 8 v8" fill="none" stroke="#a7d2f0" stroke-width="1.5" /><circle cx="64" cy="1129.25" r="2.5" fill="#a7d2f0" /><text x="40" y="1190.25" font-size="17" fill="#e8f1f7">Quiet reading changes the display, not the text’s</text><text x="40" y="1214.9" font-size="17" fill="#e8f1f7">reference identity.</text><text x="40" y="1254.5500000000002" font-size="16" fill="#e8f1f7">Use when: The reader wants less visual interruption</text><text x="40" y="1289.7500000000002" font-size="16" fill="#e8f1f7">Consider: Keep reference access discoverable for sharing or</text><text x="40" y="1312.9500000000003" font-size="16" fill="#e8f1f7">returning.</text><text x="40" y="1391.1500000000003" font-size="15" fill="#e8f1f7">Original illustrative interfaces · Static controls · Any Scripture samples identify their edition. Sample catalogue and resource details are</text><text x="40" y="1412.9000000000003" font-size="15" fill="#e8f1f7">illustrative.</text><text x="40" y="1468.6500000000003" font-size="14" fill="#e8f1f7">patterns.missional.design/patterns/verse-numbers/</text></g></svg>