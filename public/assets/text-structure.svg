avigable.</text><rect x="1115" y="692.75" width="435" height="55.35000000000002" rx="8" fill="#edf5f7" stroke="#bdd0d6"/><text x="1130" y="725.75" font-size="21" fill="#122c35" font-weight="700">Show verse labels</text><text x="55" y="879.65" font-size="20" fill="#526b72">An explanation names the editorial role.</text><text x="575" y="879.65" font-size="20" fill="#526b72">Indentation follows meaning at larger text</text><text x="575" y="906.65" font-size="20" fill="#526b72">sizes.</text><text x="1095" y="879.65" font-size="20" fill="#526b72">Headings and verse labels support, rather</text><text x="1095" y="906.65" font-size="20" fill="#526b72">than fragment, reading.</text><text x="55" y="969.65" font-size="16" fill="#526b72">SCHEMATIC TEXT ROWS, NOT LOADING STATES · ORIGINAL PROPOSALS · NOT PRODUCT SCREENSHOTS</text></g></svg>