<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1610 964" role="img" aria-labelledby="title desc"><title id="title">Actions on AI answers</title><desc id="desc">3 English interface examples. Copy, share, save, listen, try again, simplify, branch, check quotations, rate or report: choose the actions an AI answer needs and make each one honest about what it does.</desc><rect width="1610" height="964" fill="#f6f9fa"/><g font-family="Arial, sans-serif"><text x="55" y="46" font-size="18" fill="#526b72" font-weight="700">BIBLE AND FAITH APP DESIGN PATTERNS</text><text x="55" y="110" font-size="40" fill="#122c35" font-weight="700">Actions on AI answers</text><text x="55" y="159.0" font-size="23" fill="#526b72">Copy, share, save, listen, try again, simplify, branch, check quotations, rate or report: choose the actions an AI answer</text><text x="55" y="190.05" font-size="23" fill="#526b72">needs and make each one honest about what it does.</text><rect x="55" y="298.1" width="475" height="485.0" rx="20" fill="#fff" stroke="#708892" stroke-width="2"/><text x="55" y="256.1" font-size="23" fill="#122c35" font-weight="700">A · Every action in a row</text><text x="75" y="333.1" font-size="15" fill="#526b72">CONVERSATION · EXAMPLE</text><rect x="120" y="368.1" width="390" height="48" rx="10" fill="#edf0f3" stroke="#bdd0d6"/><text x="135" y="393.1" font-size="16" fill="#122c35">Earlier message</text><text x="75" y="458.1" font-size="26" fill="#122c35" font-weight="700">AI-generated answer</text><text x="75" y="505.20000000000005" font-size="21" fill="#122c35">Rest in the Bible is both a rhythm and</text><text x="75" y="533.5500000000001" font-size="21" fill="#122c35">a gift…</text><rect x="75" y="557.9000000000001" width="435" height="140.4000000000001" rx="8" fill="#edf5f7" stroke="#bdd0d6"/><text x="90" y="590.9000000000001" font-size="21" fill="#122c35" font-weight="700">Copy · Share · Notes · Listen ·</text><text x="90" y="619.2500000000001" font-size="21" fill="#122c35" font-weight="700">Retry · Simpler · Shorter · Branch ·</text><text x="90" y="647.6000000000001" font-size="21" fill="#122c35" font-weight="700">Sources · Check · Steps · 👍 · 👎 ·</text><text x="90" y="675.9500000000002" font-size="21" fill="#122c35" font-weight="700">Report</text><rect x="575" y="298.1" width="475" height="485.0" rx="20" fill="#fff" stroke="#708892" stroke-width="2"/><text x="575" y="256.1" font-size="23" fill="#122c35" font-weight="700">B · Three, then More</text><text x="595" y="333.1" font-size="15" fill="#526b72">CONVERSATION · EXAMPLE</text><rect x="640" y="368.1" width="390" height="48" rx="10" fill="#edf0f3" stroke="#bdd0d6"/><text x="655" y="393.1" font-size="16" fill="#122c35">Earlier message</text><text x="595" y="458.1" font-size="26" fill="#122c35" font-weight="700">AI-generated answer</text><text x="595" y="505.20000000000005" font-size="21" fill="#122c35">Rest in the Bible is both a rhythm and</text><text x="595" y="533.5500000000001" font-size="21" fill="#122c35">a gift…</text><rect x="595" y="557.9000000000001" width="435" height="55.35000000000002" rx="8" fill="#edf5f7" stroke="#bdd0d6"/><text x="610" y="590.9000000000001" font-size="21" fill="#122c35" font-weight="700">Copy · Share · Sources · More</text><rect x="1095" y="298.1" width="475" height="485.0" rx="20" fill="#fff" stroke="#708892" stroke-width="2"/><text x="1095" y="256.1" font-size="23" fill="#122c35" font-weight="700">C · Actions on the passages</text><text x="1115" y="333.1" font-size="15" fill="#526b72">CONVERSATION · EXAMPLE</text><rect x="1160" y="368.1" width="390" height="48" rx="10" fill="#edf0f3" stroke="#bdd0d6"/><text x="1175" y="393.1" font-size="16" fill="#122c35">Earlier message</text><text x="1115" y="458.1" font-size="26" fill="#122c35" font-weight="700">AI-generated answer</text><rect x="1115" y="484.20000000000005" width="435" height="86.64999999999998" rx="8" fill="#fff" stroke="#bdd0d6"/><text x="1130" y="517.2" font-size="21" fill="#122c35" font-weigh