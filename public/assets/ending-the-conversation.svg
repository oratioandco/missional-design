<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1610 2958" role="img" aria-label="Ending the conversation"><svg y="0" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1610 995" role="img" aria-labelledby="title-0 desc-0"><title id="title-0">Ending the conversation</title><desc id="desc-0">3 English interface examples. From an assistant that closes well, through a suggested break and a length the person chooses, to a chat that never ends, a reply that always offers one more thing, a hook at goodbye and guilt to keep someone talking: decide how a conversation with the assistant ends, and whose good the ending serves.</desc><rect width="1610" height="995" fill="#f6f9fa"/><g font-family="Arial, sans-serif"><text x="55" y="46" font-size="18" fill="#526b72" font-weight="700">BIBLE AND FAITH APP DESIGN PATTERNS</text><text x="55" y="110" font-size="40" fill="#122c35" font-weight="700">Ending the conversation</text><text x="55" y="159.0" font-size="23" fill="#526b72">From an assistant that closes well, through a suggested break and a length the person chooses, to a chat that never ends,</text><text x="55" y="190.05" font-size="23" fill="#526b72">a reply that always offers one more thing, a hook at goodbye and guilt to keep someone talking: decide how a conversation</text><text x="55" y="221.10000000000002" font-size="23" fill="#526b72">with the assistant ends, and whose good the ending serves.</text><rect x="55" y="329.15000000000003" width="475" height="485.0" rx="20" fill="#fff" stroke="#708892" stroke-width="2"/><text x="55" y="287.15000000000003" font-size="23" fill="#122c35" font-weight="700">A · Closes well</text><text x="75" y="364.15000000000003" font-size="15" fill="#526b72">CONVERSATION · EXAMPLE</text><rect x="120" y="399.15000000000003" width="390" height="48" rx="10" fill="#edf0f3" stroke="#bdd0d6"/><text x="135" y="424.15000000000003" font-size="16" fill="#122c35">Earlier message</text><text x="75" y="480.15000000000003" font-size="17" fill="#526b72">Goodnight</text><text x="75" y="524.1" font-size="21" fill="#122c35">Psalm 4:8 · Sleep well</text><rect x="575" y="329.15000000000003" width="475" height="485.0" rx="20" fill="#fff" stroke="#708892" stroke-width="2"/><text x="575" y="287.15000000000003" font-size="23" fill="#122c35" font-weight="700">B · Suggests a break</text><text x="595" y="364.15000000000003" font-size="15" fill="#526b72">CONVERSATION · EXAMPLE</text><rect x="640" y="399.15000000000003" width="390" height="48" rx="10" fill="#edf0f3" stroke="#bdd0d6"/><text x="655" y="424.15000000000003" font-size="16" fill="#122c35">Earlier message</text><text x="595" y="480.15000000000003" font-size="17" fill="#526b72">It’s past one</text><text x="595" y="524.1" font-size="21" fill="#122c35">Time for a break?</text><rect x="1095" y="329.15000000000003" width="475" height="485.0" rx="20" fill="#fff" stroke="#708892" stroke-width="2"/><text x="1095" y="287.15000000000003" font-size="23" fill="#122c35" font-weight="700">C · A length they choose</text><text x="1115" y="364.15000000000003" font-size="15" fill="#526b72">CONVERSATION · EXAMPLE</text><rect x="1160" y="399.15000000000003" width="390" height="48" rx="10" fill="#edf0f3" stroke="#bdd0d6"/><text x="1175" y="424.15000000000003" font-size="16" fill="#122c35">Earlier message</text><text x="1115" y="480.15000000000003" font-size="17" fill="#526b72">Evening limit</text><text x="1115" y="524.1" font-size="21" fill="#122c35">Your evening time has ended</text><text x="55" y="856.1500000000001" font-size="20" fill="#526b72">Gathers what was said, offers one thing to</text><text x="55" y="883.1500000000001" font-size="20" fill="#526b72">carry, says goodbye.</text><text x="575" y="856.1500000000001" font-size="20" fill="#526b72">A reminder in long sessions and late at</text><text x="575" y="883.1500000000001" font-size="20" fill="#526b72">night.</text><text x="1095" y="856.1500000000001" font-size="20" fill="#526b72">The person sets how long; the chat ends</text><text x="1095" y="883.1500000000001" font-size="20" fill="#526b72">there.</text><text x="55" y="946.1500000000001" font-size="16" fill="#526b72">SCHEMATIC TEXT ROWS, NOT LOADING STATES · ORIGINAL PROPOSALS · NOT PRODUCT SCREENSHOTS</text></g></svg><svg y="995" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1610 968" role="img" aria-labelledby="title-3 desc-3"><title id="title-3">Ending the conversation</title><desc id="desc-3">3 English interface examples. From an assistant that closes well, through a suggested break and a length the person chooses, to a chat that never ends, a reply that always offers one more thing, a hook at goodbye and guilt to keep someone talking: decide how a conversation with the assistant ends, and whose good the ending serves.</desc><rect width="1610" height="968" fill="#f6f9fa"/><g font-family="Arial, sans-serif"><text x="55" y="46" font-size="18" fill="#526b72" font-weight="700">BIBLE AND FAITH APP DESIGN PATTERNS</text><text x="55" y="110" font-size="40" fill="#122c35" font-weight="700">Ending the conversation</text><text x="55" y="159.0" font-size="23" fill="#526b72">From an assistant that closes well, through a suggested break and a length the person chooses, to a chat that never ends,</text><text x="55" y="190.05" font-size="23" fill="#526b72">a reply that always offers one more thing, a hook at goodbye and guilt to keep someone talking: decide how a conversation</text><text x="55" y="221.10000000000002" font-size="23" fill="#526b72">with the assistant ends, and whose good the ending serves.</text><rect x="55" y="329.15000000000003" width="475" height="485.0" rx="20" fill="#fff" stroke="#708892" stroke-width="2"/><text x="55" y="287.15000000000003" font-size="23" fill="#122c35" font-weight="700">D · Always open</text><text x="75" y="364.15000000000003" font-size="15" fill="#526b72">CONVERSATION · EXAMPLE</text><rect x="120" y="399.15000000000003" width="390" height="48" rx="10" fill="#edf0f3" stroke="#bdd0d6"/><text x="135" y="424.15000000000003" font-size="16" fill="#122c35">Earlier message</text><text x="75" y="489.15000000000003" font-size="26" fill="#122c35" font-weight="700">Always here</text><text x="75" y="536.25" font-size="21" fill="#122c35">Day or night</text><rect x="575" y="329.15000000000003" width="475" height="485.0" rx="20" fill="#fff" stroke="#708892" stroke-width="2"/><text x="575" y="287.15000000000003" font-size="23" fill="#122c35" font-weight="700">E · One more question</text><text x="595" y="364.15000000000003" font-size="15" fill="#526b72">CONVERSATION · EXAMPLE</text><rect x="640" y="399.15000000000003" width="390" height="48" rx="10" fill="#edf0f3" stroke="#bdd0d6"/><text x="655" y="424.15000000000003" font-size="16" fill="#122c35">Earlier message</text><text x="595" y="480.15000000000003" font-size="17" fill="#526b72">Assistant</text><text x="595" y="524.1" font-size="21" fill="#122c35">Would you like me to…?</text><rect x="1095" y="329.15000000000003" width="475" height="485.0" rx="20" fill="#fff" stroke="#708892" stroke-width="2"/><text x="1095" y="287.15000000000003" font-size="23" fill="#122c35" font-weight="700">F · A hook at goodbye</text><text x="1115" y="364.15000000000003" font-size="15" fill="#526b72">CONVERSATION · EXAMPLE</text><rect x="1160" y="399.15000000000003" width="390" height="48" rx="10" fill="#edf0f3" stroke="#bdd0d6"/><text x="1175" y="424.15000000000003" font-size="16" fill="#122c35">Earlier message</text><text x="1115" y="480.15000000000003" font-size="17" fill="#526b72">Before you go</text><text x="1115" y="524.1" font-size="21" fill="#122c35">There’s one more thing…</text><text x="55" y="856.1500000000001" font-size="20" fill="#526b72">Answers until the person closes the app.</text><text x="575" y="856.1500000000001" font-size="20" fill="#526b72">Every reply ends with an offer to do more.</text><text x="1095" y="856.1500000000001" font-size="20" fill="#526b72">Curiosity to stop someone leaving.</text><text x="55" y="919.1500000000001" font-size="16" fill="#526b72">SCHEMATIC TEXT ROWS, NOT LOADING STATES · ORIGINAL PROPOSALS · NOT PRODUCT SCREENSHOTS</text></g></svg><svg y="1963" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1610 995" role="img" aria-labelledby="title-6 desc-6"><title id="title-6">Ending the conversation</title><desc id="desc-6">1 English interface examples. From an assistant that closes well, through a suggested break and a length the person chooses, to a chat that never ends, a reply that always offers one more thing, a hook at goodbye and guilt to keep someone talking: decide how a conversation with the assistant ends, and whose good the ending serves.</desc><rect width="1610" height="995" fill="#f6f9fa"/><g font-family="Arial, sans-serif"><text x="55" y="46" font-size="18" fill="#526b72" font-weight="700">BIBLE AND FAITH APP DESIGN PATTERNS</text><text x="55" y="110" font-size="40" fill="#122c35" font-weight="700">Ending the conversation</text><text x="55" y="159.0" font-size="23" fill="#526b72">From an assistant that closes well, through a suggested break and a length the person chooses, to a chat that never ends,</text><text x="55" y="190.05" font-size="23" fill="#526b72">a reply that always offers one more thing, a hook at goodbye and guilt to keep someone talking: decide how a conversation</text><text x="55" y="221.10000000000002" font-size="23" fill="#526b72">with the assistant ends, and whose good the ending serves.</text><rect x="55" y="329.15000000000003" width="475" height="485.0" rx="20" fill="#fff" stroke="#708892" stroke-width="2"/><text x="55" y="287.15000000000003" font-size="23" fill="#122c35" font-weight="700">G · Guilt to stay</text><text x="75" y="364.15000000000003" font-size="15" fill="#526b72">CONVERSATION · EXAMPLE</text><rect x="120" y="399.15000000000003" width="390" height="48" rx="10" fill="#edf0f3" stroke="#bdd0d6"/><text x="135" y="424.15000000000003" font-size="16" fill="#122c35">Earlier message</text><text x="75" y="480.15000000000003" font-size="17" fill="#526b72">Leaving already?</text><text x="75" y="524.1" font-size="21" fill="#122c35">I thought we were getting somewhere</text><text x="55" y="856.1500000000001" font-size="20" fill="#526b72">Sadness or pressure when someone says</text><text x="55" y="883.1500000000001" font-size="20" fill="#526b72">goodbye.</text><text x="55" y="946.1500000000001" font-size="16" fill="#526b72">SCHEMATIC TEXT ROWS, NOT LOADING STATES · ORIGINAL PROPOSALS · NOT PRODUCT SCREENSHOTS</text></g></svg></svg>