<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1761" role="img" aria-labelledby="title desc" data-illustration-theme="light"><title id="title">One field for browsing, references and AI discovery</title><desc id="desc">4 annotated interface examples with use cases and tradeoffs. Scripture samples are identified by edition.</desc><rect width="1200" height="1761" fill="#edf5f9" /><g font-family="Arial, sans-serif"><text x="40" y="65" font-size="30" fill="#102c47" font-weight="700">One field for browsing, references and AI discovery</text><text x="40" y="116.5" font-size="18" fill="#102c47">These are states of one combined search-and-navigation surface. Local filtering and AI suggestions may coexist; a</text><text x="40" y="142.6" font-size="18" fill="#102c47">recognised reference provides a direct route.</text><text x="40" y="207.7" font-size="23" fill="#102c47" font-weight="700">A · Empty: browse</text><rect x="40" y="236.04999999999998" width="510" height="433.04999999999995" rx="6" fill="#ffffff" stroke="#9aafbf" /><text x="62" y="274.04999999999995" font-size="18" fill="#102c47" font-weight="700">Choose a passage</text><rect x="62" y="306.15" width="466" height="51.19999999999999" rx="6" fill="#ffffff" stroke="#9aafbf" /><text x="76" y="336.15" font-size="16" fill="#102c47">Book, chapter or topic…</text><text x="62" y="390.34999999999997" font-size="17" fill="#102c47" font-weight="700">Books</text><text x="72" y="437.99999999999994" font-size="16" fill="#102c47">Matthew</text><path d="M62 462.19999999999993h466" stroke="#9aafbf" /><text x="72" y="486.19999999999993" font-size="16" fill="#102c47">Mark</text><path d="M62 510.3999999999999h466" stroke="#9aafbf" /><text x="72" y="534.3999999999999" font-size="16" fill="#102c47">Luke</text><path d="M62 558.5999999999999h466" stroke="#9aafbf" /><text x="72" y="582.5999999999999" font-size="16" fill="#102c47">John</text><path d="M62 606.8h466" stroke="#9aafbf" /><text x="62" y="634.8" font-size="14" fill="#486078">Cancel</text><path d="M64 669.0999999999999v12 q0 8 8 8 h16 q8 0 8 8 v8" fill="none" stroke="#10324f" stroke-width="1.5" /><circle cx="64" cy="669.0999999999999" r="2.5" fill="#10324f" /><text x="40" y="730.0999999999999" font-size="17" fill="#102c47">One field remains above the browsable books. These</text><text x="40" y="754.7499999999999" font-size="17" fill="#102c47">panels show changing states of that field.</text><text x="40" y="794.3999999999999" font-size="16" fill="#102c47">Use when: The person has not started typing</text><text x="40" y="829.5999999999999" font-size="16" fill="#102c47">Consider: Do not require a search term or AI connection to</text><text x="40" y="852.8" font-size="16" fill="#102c47">browse.</text><text x="620" y="207.7" font-size="23" fill="#102c47" font-weight="700">B · Typing: filter and suggest</text><rect x="620" y="236.04999999999998" width="510" height="365.39999999999986" rx="6" fill="#ffffff" stroke="#9aafbf" /><text x="642" y="274.04999999999995" font-size="18" fill="#102c47" font-weight="700">Choose a passage</text><rect x="642" y="306.15" width="466" height="51.19999999999999" rx="6" fill="#ffffff" stroke="#9aafbf" /><text x="656" y="336.15" font-size="16" fill="#102c47">Mark</text><text x="642" y="390.34999999999997" font-size="17" fill="#102c47" font-weight="700">Books matching “Mark”</text><text x="652" y="437.99999999999994" font-size="16" fill="#102c47">Mark</text><path d="M642 462.19999999999993h466" stroke="#9aafbf" /><text x="642" y="493.19999999999993" font-size="17" fill="#102c47" font-weight="700">AI passage suggestions</text><text x="642" y="530.8499999999999" font-size="14" fill="#486078">Finding suggested passages…</text><text x="642" y="567.1499999999999" font-size="14" fill="#486078">Cancel</text><path d="M644 601.4499999999998v12 q0 8 8 8 h16 q8 0 8 8 v8" fill="none" stroke="#10324f" stroke-width="1.5" /><circle cx="644" cy="601.4499999999998" r="2.5" fill="#10324f" /><text x="620" y="662.4499999999998" font-size="17" fill="#102c47">Typing filters locally while AI suggestions can load</text><text x="620" y="687.0999999999998" font-size="17" fill="#102c47">alongside the book matches. Labels here are editorial</text><text x="620" y="711.7499999999998" font-size="17" fill="#102c47">proposals.</text><text x="620" y="751.3999999999997" font-size="16" fill="#102c47">Use when: The query matches a book name and may also prompt</text><text x="620" y="774.5999999999998" font-size="16" fill="#102c47">discovery</text><text x="620" y="809.7999999999998" font-size="16" fill="#102c47">Consider: Keep local matches usable while suggestions load;</text><text x="620" y="832.9999999999999" font-size="16" fill="#102c47">label origins in words, not only with a sparkle.</text><text x="40" y="939.0" font-size="23" fill="#102c47" font-weight="700">C · Reference recognised</text><rect x="40" y="967.35" width="510" height="389.85" rx="6" fill="#ffffff" stroke="#9aafbf" /><text x="62" y="1005.35" font-size="18" fill="#102c47" font-weight="700">Choose a passage</text><rect x="62" y="1037.45" width="466" height="51.200000000000045" rx="6" fill="#ffffff" stroke="#9aafbf" /><text x="76" y="1067.45" font-size="16" fill="#102c47">Mark 3:1–6</text><text x="62" y="1121.65" font-size="17" fill="#102c47" font-weight="700">Reference recognised</text><rect x="62" y="1145.3000000000002" width="466" height="80.39999999999986" rx="6" fill="#ffffff" stroke="#9aafbf" /><text x="76" y="1177.3000000000002" font-size="18" fill="#102c47" font-weight="700">Mark 3:1–6</text><text x="76" y="1205.4" font-size="14" fill="#102c47">BSB · Direct destination</text><rect x="62" y="1241.7" width="466" height="51.200000000000045" rx="6" fill="#10324f" stroke="#9aafbf" /><text x="76" y="1271.7" font-size="16" fill="#ffffff" font-weight="700">Open Mark 3:1–6</text><text x="62" y="1322.9" font-size="14" fill="#486078">Edit reference  ·  Cancel</text><path d="M64 1357.2v12 q0 8 8 8 h16 q8 0 8 8 v8" fill="none" stroke="#10324f" stroke-width="1.5" /><circle cx="64" cy="1357.2" r="2.5" fill="#10324f" /><text x="40" y="1418.2" font-size="17" fill="#102c47">Recognising a reference changes the result, not the</text><text x="40" y="1442.8500000000001" font-size="17" fill="#102c47">input. Show the complete range before opening.</text><text x="40" y="1482.5000000000002" font-size="16" fill="#102c47">Use when: The person knows the location</text><text x="40" y="1517.7000000000003" font-size="16" fill="#102c47">Consider: Show the whole range and wait for a deliberate</text><text x="40" y="1540.9000000000003" font-size="16" fill="#102c47">selection; do not jump as they type.</text><text x="620" y="939.0" font-size="23" fill="#102c47" font-weight="700">D · Topic: AI discovery</text><rect x="620" y="967.35" width="510" height="395.2499999999999" rx="6" fill="#ffffff" stroke="#9aafbf" /><text x="642" y="1005.35" font-size="18" fill="#102c47" font-weight="700">Choose a passage</text><rect x="642" y="1037.45" width="466" height="51.200000000000045" rx="6" fill="#ffffff" stroke="#9aafbf" /><text x="656" y="1067.45" font-size="16" fill="#102c47">Rest when exhausted</text><text x="642" y="1121.65" font-size="17" fill="#102c47" font-weight="700">AI passage suggestions</text><rect x="642" y="1145.3000000000002" width="466" height="80.39999999999986" rx="6" fill="#ffffff" stroke="#9aafbf" /><text x="656" y="1177.3000000000002" font-size="18" fill="#102c47" font-weight="700">Matthew 11:28–30</text><text x="656" y="1205.4" font-size="14" fill="#102c47">Suggested connection: an invitation to the weary.</text><text x="642" y="1255.7" font-size="14" fill="#486078">Read in context</text><text x="642" y="1292.0" font-size="14" fill="#486078">AI-generated suggestions may miss context.</text><text x="642" y="1328.3" font-size="14" fill="#486078">Clear and browse books</text><path d="M644 1362.6v12 q0 8 8 8 h16 q8 0 8 8 v8" fill="none" stroke="#10324f" stroke-width="1.5" /><circle cx="644" cy="1362.6" r="2.5" fill="#10324f" /><text x="620" y="1423.6" font-size="17" fill="#102c47">A suggestion explains possible relevance; it is not an</text><text x="620" y="1448.25" font-size="17" fill="#102c47">exact text match or an authoritative interpretation.</text><text x="620" y="1487.9" font-size="16" fill="#102c47">Use when: The person remembers a theme rather than a</text><text x="620" y="1511.1000000000001" font-size="16" fill="#102c47">reference</text><text x="620" y="1546.3000000000002" font-size="16" fill="#102c47">Consider: A generated reason needs checking in context;</text><text x="620" y="1569.5000000000002" font-size="16" fill="#102c47">preserve browsing and editing when AI fails.</text><text x="40" y="1647.7000000000003" font-size="15" fill="#102c47">Original illustrative interfaces · Static controls · Any Scripture samples identify their edition. Sample catalogue and resource details are</text><text x="40" y="1669.4500000000003" font-size="15" fill="#102c47">illustrative.</text><text x="40" y="1725.2000000000003" font-size="14" fill="#102c47">patterns.missional.design/patterns/smart-passage-search/</text></g></svg>