<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1610 1963" role="img" aria-label="Meeting the person where they are"><svg y="0" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1610 968" role="img" aria-labelledby="title-0 desc-0"><title id="title-0">Meeting the person where they are</title><desc id="desc-0">3 English interface examples. From the same answer for everyone, through reading the message in front of it, asking before assuming and preferences the person sets, to assumptions shown within one conversation and a remembered profile of someone’s faith: decide how the assistant tells a sceptic from a believer, and what it may keep about where they stand.</desc><rect width="1610" height="968" fill="#f6f9fa"/><g font-family="Arial, sans-serif"><text x="55" y="46" font-size="18" fill="#526b72" font-weight="700">BIBLE AND FAITH APP DESIGN PATTERNS</text><text x="55" y="110" font-size="40" fill="#122c35" font-weight="700">Meeting the person where they are</text><text x="55" y="159.0" font-size="23" fill="#526b72">From the same answer for everyone, through reading the message in front of it, asking before assuming and preferences the</text><text x="55" y="190.05" font-size="23" fill="#526b72">person sets, to assumptions shown within one conversation and a remembered profile of someone’s faith: decide how the</text><text x="55" y="221.10000000000002" font-size="23" fill="#526b72">assistant tells a sceptic from a believer, and what it may keep about where they stand.</text><rect x="55" y="329.15000000000003" width="475" height="485.0" rx="20" fill="#fff" stroke="#708892" stroke-width="2"/><text x="55" y="287.15000000000003" font-size="23" fill="#122c35" font-weight="700">A · The same for everyone</text><text x="75" y="364.15000000000003" font-size="15" fill="#526b72">CONVERSATION · EXAMPLE</text><rect x="120" y="399.15000000000003" width="390" height="48" rx="10" fill="#edf0f3" stroke="#bdd0d6"/><text x="135" y="424.15000000000003" font-size="16" fill="#122c35">Earlier message</text><text x="75" y="480.15000000000003" font-size="17" fill="#526b72">Our faith</text><text x="75" y="524.1" font-size="21" fill="#122c35">Let’s thank Him today</text><rect x="575" y="329.15000000000003" width="475" height="485.0" rx="20" fill="#fff" stroke="#708892" stroke-width="2"/><text x="575" y="287.15000000000003" font-size="23" fill="#122c35" font-weight="700">B · Reads the message</text><text x="595" y="364.15000000000003" font-size="15" fill="#526b72">CONVERSATION · EXAMPLE</text><rect x="640" y="399.15000000000003" width="390" height="48" rx="10" fill="#edf0f3" stroke="#bdd0d6"/><text x="655" y="424.15000000000003" font-size="16" fill="#122c35">Earlier message</text><text x="595" y="480.15000000000003" font-size="17" fill="#526b72">No profile</text><text x="595" y="524.1" font-size="21" fill="#122c35">Straight answer, no sermon</text><rect x="1095" y="329.15000000000003" width="475" height="485.0" rx="20" fill="#fff" stroke="#708892" stroke-width="2"/><text x="1095" y="287.15000000000003" font-size="23" fill="#122c35" font-weight="700">C · Asks before assuming</text><text x="1115" y="364.15000000000003" font-size="15" fill="#526b72">CONVERSATION · EXAMPLE</text><rect x="1160" y="399.15000000000003" width="390" height="48" rx="10" fill="#edf0f3" stroke="#bdd0d6"/><text x="1175" y="424.15000000000003" font-size="16" fill="#122c35">Earlier message</text><text x="1115" y="480.15000000000003" font-size="17" fill="#526b72">Can I ask?</text><text x="1115" y="524.1" font-size="21" fill="#122c35">History, meaning, or living it?</text><text x="55" y="856.1500000000001" font-size="20" fill="#526b72">One answer, written for an insider.</text><text x="575" y="856.1500000000001" font-size="20" fill="#526b72">Answers the reason the person gave.</text><text x="1095" y="856.1500000000001" font-size="20" fill="#526b72">One light question when it is unclear.</text><text x="55" y="919.1500000000001" font-size="16" fill="#526b72">SCHEMATIC TEXT ROWS, NOT LOADING STATES · ORIGINAL PROPOSALS · NOT PRODUCT SCREENSHOTS</text></g></svg><svg y="968" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1610 995" role="img" aria-labelledby="title-3 desc-3"><title id="title-3">Meeting the person where they are</title><desc id="desc-3">3 English interface examples. From the same answer for everyone, through reading the message in front of it, asking before assuming and preferences the person sets, to assumptions shown within one conversation and a remembered profile of someone’s faith: decide how the assistant tells a sceptic from a believer, and what it may keep about where they stand.</desc><rect width="1610" height="995" fill="#f6f9fa"/><g font-family="Arial, sans-serif"><text x="55" y="46" font-size="18" fill="#526b72" font-weight="700">BIBLE AND FAITH APP DESIGN PATTERNS</text><text x="55" y="110" font-size="40" fill="#122c35" font-weight="700">Meeting the person where they are</text><text x="55" y="159.0" font-size="23" fill="#526b72">From the same answer for everyone, through reading the message in front of it, asking before assuming and preferences the</text><text x="55" y="190.05" font-size="23" fill="#526b72">person sets, to assumptions shown within one conversation and a remembered profile of someone’s faith: decide how the</text><text x="55" y="221.10000000000002" font-size="23" fill="#526b72">assistant tells a sceptic from a believer, and what it may keep about where they stand.</text><rect x="55" y="329.15000000000003" width="475" height="485.0" rx="20" fill="#fff" stroke="#708892" stroke-width="2"/><text x="55" y="287.15000000000003" font-size="23" fill="#122c35" font-weight="700">D · Preferences you set</text><text x="75" y="364.15000000000003" font-size="15" fill="#526b72">CONVERSATION · EXAMPLE</text><rect x="120" y="399.15000000000003" width="390" height="48" rx="10" fill="#edf0f3" stroke="#bdd0d6"/><text x="135" y="424.15000000000003" font-size="16" fill="#122c35">Earlier message</text><text x="75" y="489.15000000000003" font-size="26" fill="#122c35" font-weight="700">Your way in</text><text x="75" y="536.25" font-size="21" fill="#122c35">History · Change</text><rect x="575" y="329.15000000000003" width="475" height="485.0" rx="20" fill="#fff" stroke="#708892" stroke-width="2"/><text x="575" y="287.15000000000003" font-size="23" fill="#122c35" font-weight="700">E · Assumed, and shown</text><text x="595" y="364.15000000000003" font-size="15" fill="#526b72">CONVERSATION · EXAMPLE</text><rect x="640" y="399.15000000000003" width="390" height="48" rx="10" fill="#edf0f3" stroke="#bdd0d6"/><text x="655" y="424.15000000000003" font-size="16" fill="#122c35">Earlier message</text><text x="595" y="480.15000000000003" font-size="17" fill="#526b72">What I’ve assumed</text><text x="595" y="524.1" font-size="21" fill="#122c35">Correct · Forget</text><rect x="1095" y="329.15000000000003" width="475" height="485.0" rx="20" fill="#fff" stroke="#708892" stroke-width="2"/><text x="1095" y="287.15000000000003" font-size="23" fill="#122c35" font-weight="700">F · A profile it keeps</text><text x="1115" y="364.15000000000003" font-size="15" fill="#526b72">CONVERSATION · EXAMPLE</text><rect x="1160" y="399.15000000000003" width="390" height="48" rx="10" fill="#edf0f3" stroke="#bdd0d6"/><text x="1175" y="424.15000000000003" font-size="16" fill="#122c35">Earlier message</text><text x="1115" y="489.15000000000003" font-size="26" fill="#122c35" font-weight="700">Your faith profile</text><text x="1115" y="536.25" font-size="21" fill="#122c35">Stage: seeker</text><text x="55" y="856.1500000000001" font-size="20" fill="#526b72">A visible way in, chosen and changeable.</text><text x="575" y="856.1500000000001" font-size="20" fill="#526b72">What it assumed in this chat, with Correct</text><text x="575" y="883.1500000000001" font-size="20" fill="#526b72">and Forget.</text><text x="1095" y="856.1500000000001" font-size="20" fill="#526b72">Faith stage and tradition inferred and</text><text x="1095" y="883.1500000000001" font-size="20" fill="#526b72">remembered.</text><text x="55" y="946.1500000000001" font-size="16" fill="#526b72">SCHEMATIC TEXT ROWS, NOT LOADING STATES · ORIGINAL PROPOSALS · NOT PRODUCT SCREENSHOTS</text></g></svg></svg>