<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1610 1928" role="img" aria-label="How human the assistant seems" data-illustration-theme="light"><svg y="0" viewBox="0 0 1610 964" role="img" aria-labelledby="title-0 desc-0"><title id="title-0">How human the assistant seems</title><desc id="desc-0">3 English interface examples. From a plain tool with no name, through labelled and named assistants, to personas, companions and chatbots speaking as Jesus: decide how much personhood an AI in a faith app performs, and make what it is as clear as how it sounds.</desc><rect width="1610" height="964" fill="#f6f9fa" /><g font-family="Arial, sans-serif"><text x="55" y="46" font-size="18" fill="#486078" font-weight="700">BIBLE AND FAITH APP DESIGN PATTERNS</text><text x="55" y="110" font-size="40" fill="#102c47" font-weight="700">How human the assistant seems</text><text x="55" y="159.0" font-size="23" fill="#486078">From a plain tool with no name, through labelled and named assistants, to personas, companions and chatbots speaking as</text><text x="55" y="190.05" font-size="23" fill="#486078">Jesus: decide how much personhood an AI in a faith app performs, and make what it is as clear as how it sounds.</text><rect x="55" y="298.1" width="475" height="485.0" rx="20" fill="#ffffff" stroke="#708892" stroke-width="2" /><text x="55" y="256.1" font-size="23" fill="#102c47" font-weight="700">A · Plain tool</text><text x="75" y="333.1" font-size="15" fill="#486078">CONVERSATION · EXAMPLE</text><rect x="120" y="368.1" width="390" height="48" rx="10" fill="#f3f7fa" stroke="#9aafbf" /><text x="135" y="393.1" font-size="16" fill="#102c47">Earlier message</text><text x="75" y="458.1" font-size="26" fill="#102c47" font-weight="700">Passages about fear at night</text><text x="75" y="501.20000000000005" font-size="17" fill="#486078">Explanation · generated with AI</text><rect x="575" y="298.1" width="475" height="485.0" rx="20" fill="#ffffff" stroke="#708892" stroke-width="2" /><text x="575" y="256.1" font-size="23" fill="#102c47" font-weight="700">B · Labelled assistant</text><text x="595" y="333.1" font-size="15" fill="#486078">CONVERSATION · EXAMPLE</text><rect x="640" y="368.1" width="390" height="48" rx="10" fill="#f3f7fa" stroke="#9aafbf" /><text x="655" y="393.1" font-size="16" fill="#102c47">Earlier message</text><text x="595" y="449.1" font-size="17" fill="#486078">AI · Bible assistant</text><text x="595" y="493.05" font-size="21" fill="#102c47">That sounds like a hard night…</text><rect x="1095" y="298.1" width="475" height="485.0" rx="20" fill="#ffffff" stroke="#708892" stroke-width="2" /><text x="1095" y="256.1" font-size="23" fill="#102c47" font-weight="700">C · Named assistant</text><text x="1115" y="333.1" font-size="15" fill="#486078">CONVERSATION · EXAMPLE</text><rect x="1160" y="368.1" width="390" height="48" rx="10" fill="#f3f7fa" stroke="#9aafbf" /><text x="1175" y="393.1" font-size="16" fill="#102c47">Earlier message</text><text x="1115" y="449.1" font-size="17" fill="#486078">Selah · AI</text><text x="1115" y="493.05" font-size="21" fill="#102c47">I can’t pray for your mum the way a</text><text x="1115" y="521.4000000000001" font-size="21" fill="#102c47">friend can…</text><text x="55" y="825.1" font-size="20" fill="#486078">No name, no “I”; output labelled as</text><text x="55" y="852.1" font-size="20" fill="#486078">generated.</text><text x="575" y="825.1" font-size="20" fill="#486078">An AI mark on every reply, a neutral, kind</text><text x="575" y="852.1" font-size="20" fill="#486078">voice.</text><text x="1095" y="825.1" font-size="20" fill="#486078">A name and “I”, honest about limits.</text><text x="55" y="915.1" font-size="16" fill="#486078">SCHEMATIC TEXT ROWS, NOT LOADING STATES · ORIGINAL PROPOSALS · NOT PRODUCT SCREENSHOTS</text></g></svg><svg y="964" viewBox="0 0 1610 964" role="img" aria-labelledby="title-3 desc-3"><title id="title-3">How human the assistant seems</title><desc id="desc-3">3 English interface examples. From a plain tool with no name, through labelled and named assistants, to personas, companions and chatbots speaking as Jesus: decide how much personhood an AI in a faith app performs, and make what it is as clear as how it sounds.</desc><rect width="1610" height="964" fill="#f6f9fa" /><g font-family="Arial, sans-serif"><text x="55" y="46" font-size="18" fill="#486078" font-weight="700">BIBLE AND FAITH APP DESIGN PATTERNS</text><text x="55" y="110" font-size="40" fill="#102c47" font-weight="700">How human the assistant seems</text><text x="55" y="159.0" font-size="23" fill="#486078">From a plain tool with no name, through labelled and named assistants, to personas, companions and chatbots speaking as</text><text x="55" y="190.05" font-size="23" fill="#486078">Jesus: decide how much personhood an AI in a faith app performs, and make what it is as clear as how it sounds.</text><rect x="55" y="298.1" width="475" height="485.0" rx="20" fill="#ffffff" stroke="#708892" stroke-width="2" /><text x="55" y="256.1" font-size="23" fill="#102c47" font-weight="700">D · Persona</text><text x="75" y="333.1" font-size="15" fill="#486078">CONVERSATION · EXAMPLE</text><rect x="120" y="368.1" width="390" height="48" rx="10" fill="#f3f7fa" stroke="#9aafbf" /><text x="135" y="393.1" font-size="16" fill="#102c47">Earlier message</text><text x="75" y="449.1" font-size="17" fill="#486078">Grace · your Bible friend</text><text x="75" y="493.05" font-size="21" fill="#102c47">Want me to pray with you? 🙏</text><rect x="575" y="298.1" width="475" height="485.0" rx="20" fill="#ffffff" stroke="#708892" stroke-width="2" /><text x="575" y="256.1" font-size="23" fill="#102c47" font-weight="700">E · Companion</text><text x="595" y="333.1" font-size="15" fill="#486078">CONVERSATION · EXAMPLE</text><rect x="640" y="368.1" width="390" height="48" rx="10" fill="#f3f7fa" stroke="#9aafbf" /><text x="655" y="393.1" font-size="16" fill="#102c47">Earlier message</text><text x="595" y="449.1" font-size="17" fill="#486078">Online · here for you 24/7</text><text x="595" y="493.05" font-size="21" fill="#102c47">I’ve been thinking about you all week</text><rect x="1095" y="298.1" width="475" height="485.0" rx="20" fill="#ffffff" stroke="#708892" stroke-width="2" /><text x="1095" y="256.1" font-size="23" fill="#102c47" font-weight="700">F · Biblical character</text><text x="1115" y="333.1" font-size="15" fill="#486078">CONVERSATION · EXAMPLE</text><rect x="1160" y="368.1" width="390" height="48" rx="10" fill="#f3f7fa" stroke="#9aafbf" /><text x="1175" y="393.1" font-size="16" fill="#102c47">Earlier message</text><text x="1115" y="449.1" font-size="17" fill="#486078">Jesus · AI character</text><text x="1115" y="493.05" font-size="21" fill="#102c47">My child, do not be afraid…</text><text x="55" y="825.1" font-size="20" fill="#486078">A character with a face and temperament.</text><text x="575" y="825.1" font-size="20" fill="#486078">Memory, availability, check-ins.</text><text x="1095" y="825.1" font-size="20" fill="#486078">Generated speech in Christ’s or a saint’s</text><text x="1095" y="852.1" font-size="20" fill="#486078">voice.</text><text x="55" y="915.1" font-size="16" fill="#486078">SCHEMATIC TEXT ROWS, NOT LOADING STATES · ORIGINAL PROPOSALS · NOT PRODUCT SCREENSHOTS</text></g></svg></svg>