<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1610 1963" role="img" aria-label="Saying “I don’t know”"><svg y="0" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1610 968" role="img" aria-labelledby="title-0 desc-0"><title id="title-0">Saying “I don’t know”</title><desc id="desc-0">3 English interface examples. From an assistant that answers everything with the same confidence, through a warning in the fine print and a confidence level on each answer, to answers that say which parts are Scripture, which are a tradition’s teaching and which are a guess, an honest “I don’t know”, and declining to answer: decide how the assistant shows the limits of what it knows.</desc><rect width="1610" height="968" fill="#f6f9fa"/><g font-family="Arial, sans-serif"><text x="55" y="46" font-size="18" fill="#526b72" font-weight="700">BIBLE AND FAITH APP DESIGN PATTERNS</text><text x="55" y="110" font-size="40" fill="#122c35" font-weight="700">Saying “I don’t know”</text><text x="55" y="159.0" font-size="23" fill="#526b72">From an assistant that answers everything with the same confidence, through a warning in the fine print and a confidence</text><text x="55" y="190.05" font-size="23" fill="#526b72">level on each answer, to answers that say which parts are Scripture, which are a tradition’s teaching and which are a</text><text x="55" y="221.10000000000002" font-size="23" fill="#526b72">guess, an honest “I don’t know”, and declining to answer: decide how the assistant shows the limits of what it knows.</text><rect x="55" y="329.15000000000003" width="475" height="485.0" rx="20" fill="#fff" stroke="#708892" stroke-width="2"/><text x="55" y="287.15000000000003" font-size="23" fill="#122c35" font-weight="700">A · Always answers, confidently</text><text x="75" y="364.15000000000003" font-size="15" fill="#526b72">CONVERSATION · EXAMPLE</text><rect x="120" y="399.15000000000003" width="390" height="48" rx="10" fill="#edf0f3" stroke="#bdd0d6"/><text x="135" y="424.15000000000003" font-size="16" fill="#122c35">Earlier message</text><text x="75" y="489.15000000000003" font-size="26" fill="#122c35" font-weight="700">Precise answers to all your</text><text x="75" y="524.25" font-size="26" fill="#122c35" font-weight="700">questions</text><text x="75" y="571.35" font-size="21" fill="#122c35">That’s Proverbs 16:9</text><rect x="575" y="329.15000000000003" width="475" height="485.0" rx="20" fill="#fff" stroke="#708892" stroke-width="2"/><text x="575" y="287.15000000000003" font-size="23" fill="#122c35" font-weight="700">B · A warning in the fine print</text><text x="595" y="364.15000000000003" font-size="15" fill="#526b72">CONVERSATION · EXAMPLE</text><rect x="640" y="399.15000000000003" width="390" height="48" rx="10" fill="#edf0f3" stroke="#bdd0d6"/><text x="655" y="424.15000000000003" font-size="16" fill="#122c35">Earlier message</text><text x="595" y="484.15000000000003" font-size="21" fill="#122c35">That’s Proverbs 16:9</text><text x="595" y="525.5" font-size="17" fill="#526b72">AI can make mistakes</text><rect x="1095" y="329.15000000000003" width="475" height="485.0" rx="20" fill="#fff" stroke="#708892" stroke-width="2"/><text x="1095" y="287.15000000000003" font-size="23" fill="#122c35" font-weight="700">C · A confidence level on each answer</text><text x="1115" y="364.15000000000003" font-size="15" fill="#526b72">CONVERSATION · EXAMPLE</text><rect x="1160" y="399.15000000000003" width="390" height="48" rx="10" fill="#edf0f3" stroke="#bdd0d6"/><text x="1175" y="424.15000000000003" font-size="16" fill="#122c35">Earlier message</text><text x="1115" y="480.15000000000003" font-size="17" fill="#526b72">Low confidence</text><text x="1115" y="524.1" font-size="21" fill="#122c35">This may not be in the Bible</text><text x="55" y="856.1500000000001" font-size="20" fill="#526b72">Every answer in the same sure voice.</text><text x="575" y="856.1500000000001" font-size="20" fill="#526b72">A general note under every answer.</text><text x="1095" y="856.1500000000001" font-size="20" fill="#526b72">High, medium or low, shown with the answer.</text><text x="55" y="919.1500000000001" font-size="16" fill="#526b72">SCHEMATIC TEXT ROWS, NOT LOADING STATES · ORIGINAL PROPOSALS · NOT PRODUCT SCREENSHOTS</text></g></svg><svg y="968" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1610 995" role="img" aria-labelledby="title-3 desc-3"><title id="title-3">Saying “I don’t know”</title><desc id="desc-3">3 English interface examples. From an assistant that answers everything with the same confidence, through a warning in the fine print and a confidence level on each answer, to answers that say which parts are Scripture, which are a tradition’s teaching and which are a guess, an honest “I don’t know”, and declining to answer: decide how the assistant shows the limits of what it knows.</desc><rect width="1610" height="995" fill="#f6f9fa"/><g font-family="Arial, sans-serif"><text x="55" y="46" font-size="18" fill="#526b72" font-weight="700">BIBLE AND FAITH APP DESIGN PATTERNS</text><text x="55" y="110" font-size="40" fill="#122c35" font-weight="700">Saying “I don’t know”</text><text x="55" y="159.0" font-size="23" fill="#526b72">From an assistant that answers everything with the same confidence, through a warning in the fine print and a confidence</text><text x="55" y="190.05" font-size="23" fill="#526b72">level on each answer, to answers that say which parts are Scripture, which are a tradition’s teaching and which are a</text><text x="55" y="221.10000000000002" font-size="23" fill="#526b72">guess, an honest “I don’t know”, and declining to answer: decide how the assistant shows the limits of what it knows.</text><rect x="55" y="329.15000000000003" width="475" height="485.0" rx="20" fill="#fff" stroke="#708892" stroke-width="2"/><text x="55" y="287.15000000000003" font-size="23" fill="#122c35" font-weight="700">D · Says what kind of claim each part</text><text x="55" y="318.20000000000005" font-size="23" fill="#122c35" font-weight="700">is</text><text x="75" y="364.15000000000003" font-size="15" fill="#526b72">CONVERSATION · EXAMPLE</text><rect x="120" y="399.15000000000003" width="390" height="48" rx="10" fill="#edf0f3" stroke="#bdd0d6"/><text x="135" y="424.15000000000003" font-size="16" fill="#122c35">Earlier message</text><text x="75" y="480.15000000000003" font-size="17" fill="#526b72">Scripture says</text><text x="75" y="524.1" font-size="21" fill="#122c35">Christians hold · Not known</text><rect x="575" y="329.15000000000003" width="475" height="485.0" rx="20" fill="#fff" stroke="#708892" stroke-width="2"/><text x="575" y="287.15000000000003" font-size="23" fill="#122c35" font-weight="700">E · Says “I don’t know”, and where to</text><text x="575" y="318.20000000000005" font-size="23" fill="#122c35" font-weight="700">look</text><text x="595" y="364.15000000000003" font-size="15" fill="#526b72">CONVERSATION · EXAMPLE</text><rect x="640" y="399.15000000000003" width="390" height="48" rx="10" fill="#edf0f3" stroke="#bdd0d6"/><text x="655" y="424.15000000000003" font-size="16" fill="#122c35">Earlier message</text><text x="595" y="484.15000000000003" font-size="21" fill="#122c35">I don’t know, and no one does for</text><text x="595" y="512.5" font-size="21" fill="#122c35">certain</text><text x="595" y="553.85" font-size="17" fill="#526b72">Read Hebrews 13</text><rect x="1095" y="329.15000000000003" width="475" height="485.0" rx="20" fill="#fff" stroke="#708892" stroke-width="2"/><text x="1095" y="287.15000000000003" font-size="23" fill="#122c35" font-weight="700">F · Declines to answer</text><text x="1115" y="364.15000000000003" font-size="15" fill="#526b72">CONVERSATION · EXAMPLE</text><rect x="1160" y="399.15000000000003" width="390" height="48" rx="10" fill="#edf0f3" stroke="#bdd0d6"/><text x="1175" y="424.15000000000003" font-size="16" fill="#122c35">Earlier message</text><text x="1115" y="484.15000000000003" font-size="21" fill="#122c35">Unable to find an answer</text><text x="1115" y="525.5" font-size="17" fill="#526b72">Articles and books</text><text x="55" y="856.1500000000001" font-size="20" fill="#526b72">Scripture, a tradition’s teaching, and what</text><text x="55" y="883.1500000000001" font-size="20" fill="#526b72">no one knows.</text><text x="575" y="856.1500000000001" font-size="20" fill="#526b72">First-person honesty, then what it does</text><text x="575" y="883.1500000000001" font-size="20" fill="#526b72">know.</text><text x="1095" y="856.1500000000001" font-size="20" fill="#526b72">No answer when sources are not found.</text><text x="55" y="946.1500000000001" font-size="16" fill="#526b72">SCHEMATIC TEXT ROWS, NOT LOADING STATES · ORIGINAL PROPOSALS · NOT PRODUCT SCREENSHOTS</text></g></svg></svg>