<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1610 996" role="img" aria-labelledby="title desc"><title id="title">Identify what AI did, where it matters</title><desc id="desc">3 English interface examples. Label the actor, action and artifact at the moment they could be misunderstood.</desc><rect width="1610" height="996" fill="#f6f9fa"/><g font-family="Arial, sans-serif"><text x="55" y="46" font-size="18" fill="#526b72" font-weight="700">BIBLE AND FAITH APP DESIGN PATTERNS</text><text x="55" y="110" font-size="40" fill="#122c35" font-weight="700">Identify what AI did, where it matters</text><text x="55" y="159.0" font-size="23" fill="#526b72">Label the actor, action and artifact at the moment they could be misunderstood.</text><rect x="55" y="267.05" width="475" height="548.4000000000001" rx="20" fill="#fff" stroke="#708892" stroke-width="2"/><text x="55" y="225.05" font-size="23" fill="#122c35" font-weight="700">A · Before an AI action</text><text x="75" y="302.05" font-size="15" fill="#526b72">ASSISTANT · EXAMPLE</text><rect x="75" y="337.05" width="435" height="190" rx="10" fill="#fff" stroke="#aab2bd"/><text x="87" y="360.05" font-size="14" fill="#122c35" font-weight="700">Verified passage</text><text x="85" y="391.95" font-size="12" fill="#667085">8</text><rect x="107" y="384.95" width="362.70000000000005" height="4" fill="#c3c8ce"/><rect x="107" y="394.95" width="280.8" height="4" fill="#c3c8ce"/><text x="85" y="429.95" font-size="12" fill="#667085">9</text><rect x="107" y="422.95" width="362.70000000000005" height="4" fill="#c3c8ce"/><rect x="107" y="432.95" width="280.8" height="4" fill="#c3c8ce"/><text x="85" y="467.95" font-size="12" fill="#667085">10</text><rect x="107" y="460.95" width="362.70000000000005" height="4" fill="#c3c8ce"/><rect x="107" y="470.95" width="280.8" height="4" fill="#c3c8ce"/><rect x="75" y="543.05" width="435" height="55.35000000000002" rx="8" fill="#edf5f7" stroke="#bdd0d6"/><text x="90" y="576.05" font-size="21" fill="#122c35" font-weight="700">Generate an explanation with AI</text><rect x="75" y="614.4" width="435" height="83.70000000000005" rx="8" fill="#edf5f7" stroke="#bdd0d6"/><text x="90" y="647.4" font-size="21" fill="#122c35" font-weight="700">Uses this passage and the sources</text><text x="90" y="675.75" font-size="21" fill="#122c35" font-weight="700">you choose.</text><rect x="75" y="714.1" width="435" height="55.35000000000002" rx="8" fill="#edf5f7" stroke="#bdd0d6"/><text x="90" y="747.1" font-size="21" fill="#122c35" font-weight="700">Read attributed commentary instead</text><rect x="575" y="267.05" width="475" height="548.4000000000001" rx="20" fill="#fff" stroke="#708892" stroke-width="2"/><text x="575" y="225.05" font-size="23" fill="#122c35" font-weight="700">B · Blended content</text><text x="595" y="302.05" font-size="15" fill="#526b72">ASSISTANT · EXAMPLE</text><text x="595" y="354.05" font-size="17" fill="#526b72">Edition A · verified source text</text><rect x="595" y="377.0" width="435" height="190" rx="10" fill="#fff" stroke="#aab2bd"/><text x="607" y="400.0" font-size="14" fill="#122c35" font-weight="700">Original passage</text><text x="605" y="431.9" font-size="12" fill="#667085">8</text><rect x="627" y="424.9" width="362.70000000000005" height="4" fill="#c3c8ce"/><rect x="627" y="434.9" width="280.8" height="4" fill="#c3c8ce"/><text x="605" y="469.9" font-size="12" fill="#667085">9</text><rect x="627" y="462.9" width="362.70000000000005" height="4" fill="#c3c8ce"/><rect x="627" y="472.9" width="280.8" height="4" fill="#c3c8ce"/><text x="605" y="507.9" font-size="12" fill="#667085">10</text><rect x="627" y="500.9" width="362.70000000000005" height="4" fill="#c3c8ce"/><rect x="627" y="510.9" width="280.8" height="4" fill="#c3c8ce"/><rect x="595" y="583.0" width="435" height="110.94999999999993" rx="8" fill="#fff" stroke="#bdd0d6"/><text x="610" y="616.0" font-size="21" fill="#122c35" font-weight="700">Explanation generated with AI</text><text x="610" y="648.35" font-size="18" fill="#526b72">This is interpretation, not the</text><text x="610" y="672.65" font-size="18" fill="#526b72">translation.</text><rect x="595" y="709.9499999999999" width="435" height="55.35000000000002" rx="8" fill="#edf5f7" stroke="#bdd0d6"/><text x="610" y="742.9499999999999" font-size="21" fill="#122c35" font-weight="700">Sources and creation details</text><rect x="1095" y="267.05" width="475" height="548.4000000000001" rx="20" fill="#fff" stroke="#708892" stroke-width="2"/><text x="1095" y="225.05" font-size="23" fill="#122c35" font-weight="700">C · Actor transition</text><text x="1115" y="302.05" font-size="15" fill="#526b72">ASSISTANT · EXAMPLE</text><text x="1115" y="354.05" font-size="17" fill="#526b72">AI assistant</text><rect x="1115" y="377.0" width="435" height="86.65000000000003" rx="8" fill="#fff" stroke="#bdd0d6"/><text x="1130" y="410.0" font-size="21" fill="#122c35" font-weight="700">AI response</text><text x="1130" y="442.35" font-size="18" fill="#526b72">Generated response text.</text><rect x="1115" y="479.65000000000003" width="435" height="83.69999999999999" rx="8" fill="#edf5f7" stroke="#bdd0d6"/><text x="1130" y="512.6500000000001" font-size="21" fill="#122c35" font-weight="700">Human support has joined · only</text><text x="1130" y="541.0" font-size="21" fill="#122c35" font-weight="700">after confirmed connection.</text><rect x="1115" y="579.35" width="435" height="86.64999999999998" rx="8" fill="#fff" stroke="#bdd0d6"/><text x="1130" y="612.35" font-size="21" fill="#122c35" font-weight="700">Named human responder</text><text x="1130" y="644.7" font-size="18" fill="#526b72">Human-authored response.</text><text x="55" y="857.45" font-size="20" fill="#526b72">Explain the operation before it begins.</text><text x="575" y="857.45" font-size="20" fill="#526b72">Keep verified text and generated explanation</text><text x="575" y="884.45" font-size="20" fill="#526b72">distinct.</text><text x="1095" y="857.45" font-size="20" fill="#526b72">Sender identity survives a real human</text><text x="1095" y="884.45" font-size="20" fill="#526b72">handoff.</text><text x="55" y="947.45" font-size="16" fill="#526b72">SCHEMATIC TEXT ROWS, NOT LOADING STATES · ORIGINAL PROPOSALS · NOT PRODUCT SCREENSHOTS</text></g></svg>