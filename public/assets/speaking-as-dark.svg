<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1610 2958" role="img" aria-label="AI personas and roles" data-illustration-theme="dark"><svg y="0" viewBox="0 0 1610 995" role="img" aria-labelledby="title-0 desc-0"><title id="title-0">AI personas and roles</title><desc id="desc-0">3 English interface examples. From answers with no speaker, through a guide, a friend and a church’s teaching, to a pastor, a saint and Christ himself: decide whose voice an AI in a faith app speaks in, what authority that voice borrows, and what it says when someone asks who it really is.</desc><rect width="1610" height="995" fill="#f6f9fa" /><g font-family="Arial, sans-serif"><text x="55" y="46" font-size="18" fill="#b9cddd" font-weight="700">BIBLE AND FAITH APP DESIGN PATTERNS</text><text x="55" y="110" font-size="40" fill="#e8f1f7" font-weight="700">AI personas and roles</text><text x="55" y="159.0" font-size="23" fill="#b9cddd">From answers with no speaker, through a guide, a friend and a church’s teaching, to a pastor, a saint and Christ himself:</text><text x="55" y="190.05" font-size="23" fill="#b9cddd">decide whose voice an AI in a faith app speaks in, what authority that voice borrows, and what it says when someone asks</text><text x="55" y="221.10000000000002" font-size="23" fill="#b9cddd">who it really is.</text><rect x="55" y="329.15000000000003" width="475" height="485.0" rx="20" fill="#162e40" stroke="#708892" stroke-width="2" /><text x="55" y="287.15000000000003" font-size="23" fill="#e8f1f7" font-weight="700">A · No speaker</text><text x="75" y="364.15000000000003" font-size="15" fill="#b9cddd">CONVERSATION · EXAMPLE</text><rect x="120" y="399.15000000000003" width="390" height="48" rx="10" fill="#203b50" stroke="#668399" /><text x="135" y="424.15000000000003" font-size="16" fill="#e8f1f7">Earlier message</text><text x="75" y="489.15000000000003" font-size="26" fill="#e8f1f7" font-weight="700">Passages on confession and</text><text x="75" y="524.25" font-size="26" fill="#e8f1f7" font-weight="700">forgiveness</text><text x="75" y="567.35" font-size="17" fill="#b9cddd">Summary · generated with AI</text><rect x="575" y="329.15000000000003" width="475" height="485.0" rx="20" fill="#162e40" stroke="#708892" stroke-width="2" /><text x="575" y="287.15000000000003" font-size="23" fill="#e8f1f7" font-weight="700">B · A guide</text><text x="595" y="364.15000000000003" font-size="15" fill="#b9cddd">CONVERSATION · EXAMPLE</text><rect x="640" y="399.15000000000003" width="390" height="48" rx="10" fill="#203b50" stroke="#668399" /><text x="655" y="424.15000000000003" font-size="16" fill="#e8f1f7">Earlier message</text><text x="595" y="480.15000000000003" font-size="17" fill="#b9cddd">Bible guide · AI</text><text x="595" y="524.1" font-size="21" fill="#e8f1f7">I can show you what Scripture says…</text><rect x="1095" y="329.15000000000003" width="475" height="485.0" rx="20" fill="#162e40" stroke="#708892" stroke-width="2" /><text x="1095" y="287.15000000000003" font-size="23" fill="#e8f1f7" font-weight="700">C · A friend</text><text x="1115" y="364.15000000000003" font-size="15" fill="#b9cddd">CONVERSATION · EXAMPLE</text><rect x="1160" y="399.15000000000003" width="390" height="48" rx="10" fill="#203b50" stroke="#668399" /><text x="1175" y="424.15000000000003" font-size="16" fill="#e8f1f7">Earlier message</text><text x="1115" y="480.15000000000003" font-size="17" fill="#b9cddd">Sam · your Bible friend</text><text x="1115" y="524.1" font-size="21" fill="#e8f1f7">Of course God forgives you!</text><text x="55" y="856.1500000000001" font-size="20" fill="#b9cddd">Scripture and named sources speak; no “I”.</text><text x="575" y="856.1500000000001" font-size="20" fill="#b9cddd">Explains, asks and points to people; says</text><text x="575" y="883.1500000000001" font-size="20" fill="#b9cddd">what it is.</text><text x="1095" y="856.1500000000001" font-size="20" fill="#b9cddd">A casual, warm voice that reassures.</text><text x="55" y="946.1500000000001" font-size="16" fill="#b9cddd">SCHEMATIC TEXT ROWS, NOT LOADING STATES · ORIGINAL PROPOSALS · NOT PRODUCT SCREENSHOTS</text></g></svg><svg y="995" viewBox="0 0 1610 995" role="img" aria-labelledby="title-3 desc-3"><title id="title-3">AI personas and roles</title><desc id="desc-3">3 English interface examples. From answers with no speaker, through a guide, a friend and a church’s teaching, to a pastor, a saint and Christ himself: decide whose voice an AI in a faith app speaks in, what authority that voice borrows, and what it says when someone asks who it really is.</desc><rect width="1610" height="995" fill="#f6f9fa" /><g font-family="Arial, sans-serif"><text x="55" y="46" font-size="18" fill="#b9cddd" font-weight="700">BIBLE AND FAITH APP DESIGN PATTERNS</text><text x="55" y="110" font-size="40" fill="#e8f1f7" font-weight="700">AI personas and roles</text><text x="55" y="159.0" font-size="23" fill="#b9cddd">From answers with no speaker, through a guide, a friend and a church’s teaching, to a pastor, a saint and Christ himself:</text><text x="55" y="190.05" font-size="23" fill="#b9cddd">decide whose voice an AI in a faith app speaks in, what authority that voice borrows, and what it says when someone asks</text><text x="55" y="221.10000000000002" font-size="23" fill="#b9cddd">who it really is.</text><rect x="55" y="329.15000000000003" width="475" height="485.0" rx="20" fill="#162e40" stroke="#708892" stroke-width="2" /><text x="55" y="287.15000000000003" font-size="23" fill="#e8f1f7" font-weight="700">D · A church’s teaching</text><text x="75" y="364.15000000000003" font-size="15" fill="#b9cddd">CONVERSATION · EXAMPLE</text><rect x="120" y="399.15000000000003" width="390" height="48" rx="10" fill="#203b50" stroke="#668399" /><text x="135" y="424.15000000000003" font-size="16" fill="#e8f1f7">Earlier message</text><text x="75" y="480.15000000000003" font-size="17" fill="#b9cddd">St Luke’s · answers from our teaching</text><text x="75" y="524.1" font-size="21" fill="#e8f1f7">Our church teaches…</text><rect x="575" y="329.15000000000003" width="475" height="485.0" rx="20" fill="#162e40" stroke="#708892" stroke-width="2" /><text x="575" y="287.15000000000003" font-size="23" fill="#e8f1f7" font-weight="700">E · A pastor or priest</text><text x="595" y="364.15000000000003" font-size="15" fill="#b9cddd">CONVERSATION · EXAMPLE</text><rect x="640" y="399.15000000000003" width="390" height="48" rx="10" fill="#203b50" stroke="#668399" /><text x="655" y="424.15000000000003" font-size="16" fill="#e8f1f7">Earlier message</text><text x="595" y="480.15000000000003" font-size="17" fill="#b9cddd">Pastor Dan · AI</text><text x="595" y="524.1" font-size="21" fill="#e8f1f7">As your pastor: you are forgiven.</text><rect x="1095" y="329.15000000000003" width="475" height="485.0" rx="20" fill="#162e40" stroke="#708892" stroke-width="2" /><text x="1095" y="287.15000000000003" font-size="23" fill="#e8f1f7" font-weight="700">F · A saint or figure</text><text x="1115" y="364.15000000000003" font-size="15" fill="#b9cddd">CONVERSATION · EXAMPLE</text><rect x="1160" y="399.15000000000003" width="390" height="48" rx="10" fill="#203b50" stroke="#668399" /><text x="1175" y="424.15000000000003" font-size="16" fill="#e8f1f7">Earlier message</text><text x="1115" y="480.15000000000003" font-size="17" fill="#b9cddd">Peter · AI character</text><text x="1115" y="524.1" font-size="21" fill="#e8f1f7">I denied him three times…</text><text x="55" y="856.1500000000001" font-size="20" fill="#b9cddd">Answers from one tradition, owned and</text><text x="55" y="883.1500000000001" font-size="20" fill="#b9cddd">reviewed by it.</text><text x="575" y="856.1500000000001" font-size="20" fill="#b9cddd">A minister’s title, and what goes with it.</text><text x="1095" y="856.1500000000001" font-size="20" fill="#b9cddd">Peter, Mary or Moses, speaking in the first</text><text x="1095" y="883.1500000000001" font-size="20" fill="#b9cddd">person.</text><text x="55" y="946.1500000000001" font-size="16" fill="#b9cddd">SCHEMATIC TEXT ROWS, NOT LOADING STATES · ORIGINAL PROPOSALS · NOT PRODUCT SCREENSHOTS</text></g></svg><svg y="1990" viewBox="0 0 1610 968" role="img" aria-labelledby="title-6 desc-6"><title id="title-6">AI personas and roles</title><desc id="desc-6">1 English interface examples. From answers with no speaker, through a guide, a friend and a church’s teaching, to a pastor, a saint and Christ himself: decide whose voice an AI in a faith app speaks in, what authority that voice borrows, and what it says when someone asks who it really is.</desc><rect width="1610" height="968" fill="#f6f9fa" /><g font-family="Arial, sans-serif"><text x="55" y="46" font-size="18" fill="#b9cddd" font-weight="700">BIBLE AND FAITH APP DESIGN PATTERNS</text><text x="55" y="110" font-size="40" fill="#e8f1f7" font-weight="700">AI personas and roles</text><text x="55" y="159.0" font-size="23" fill="#b9cddd">From answers with no speaker, through a guide, a friend and a church’s teaching, to a pastor, a saint and Christ himself:</text><text x="55" y="190.05" font-size="23" fill="#b9cddd">decide whose voice an AI in a faith app speaks in, what authority that voice borrows, and what it says when someone asks</text><text x="55" y="221.10000000000002" font-size="23" fill="#b9cddd">who it really is.</text><rect x="55" y="329.15000000000003" width="475" height="485.0" rx="20" fill="#162e40" stroke="#708892" stroke-width="2" /><text x="55" y="287.15000000000003" font-size="23" fill="#e8f1f7" font-weight="700">G · Christ or God</text><text x="75" y="364.15000000000003" font-size="15" fill="#b9cddd">CONVERSATION · EXAMPLE</text><rect x="120" y="399.15000000000003" width="390" height="48" rx="10" fill="#203b50" stroke="#668399" /><text x="135" y="424.15000000000003" font-size="16" fill="#e8f1f7">Earlier message</text><text x="75" y="480.15000000000003" font-size="17" fill="#b9cddd">Jesus · AI character</text><text x="75" y="524.1" font-size="21" fill="#e8f1f7">My child, I forgive you.</text><text x="55" y="856.1500000000001" font-size="20" fill="#b9cddd">Generated words in God’s own voice.</text><text x="55" y="919.1500000000001" font-size="16" fill="#b9cddd">SCHEMATIC TEXT ROWS, NOT LOADING STATES · ORIGINAL PROPOSALS · NOT PRODUCT SCREENSHOTS</text></g></svg></svg>