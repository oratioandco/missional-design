 fill="#203b50" stroke="#668399" /><text x="135" y="424.15000000000003" font-size="16" fill="#e8f1f7">Earlier message</text><text x="75" y="480.15000000000003" font-size="17" fill="#b9cddd">Draft</text><text x="75" y="524.1" font-size="21" fill="#e8f1f7">Could we get a coffee?</text><rect x="575" y="329.15000000000003" width="475" height="485.0" rx="20" fill="#162e40" stroke="#708892" stroke-width="2" /><text x="575" y="287.15000000000003" font-size="23" fill="#e8f1f7" font-weight="700">E · Their own church, if they ask</text><text x="595" y="364.15000000000003" font-size="15" fill="#b9cddd">CONVERSATION · EXAMPLE</text><rect x="640" y="399.15000000000003" width="390" height="48" rx="10" fill="#203b50" stroke="#668399" /><text x="655" y="424.15000000000003" font-size="16" fill="#e8f1f7">Earlier message</text><text x="595" y="480.15000000000003" font-size="17" fill="#b9cddd">St Luke’s</text><text x="595" y="524.1" font-size="21" fill="#e8f1f7">Ask for a conversation</text><rect x="1095" y="329.15000000000003" width="475" height="485.0" rx="20" fill="#162e40" stroke="#708892" stroke-width="2" /><text x="1095" y="287.15000000000003" font-size="23" fill="#e8f1f7" font-weight="700">F · A person joins</text><text x="1115" y="364.15000000000003" font-size="15" fill="#b9cddd">CONVERSATION · EXAMPLE</text><rect x="1160" y="399.15000000000003" width="390" height="48" rx="10" fill="#203b50" stroke="#668399" /><text x="1175" y="424.15000000000003" font-size="16" fill="#e8f1f7">Earlier message</text><text x="1115" y="480.15000000000003" font-size="17" fill="#b9cddd">Ruth can join</text><text x="1115" y="524.1" font-size="21" fill="#e8f1f7">Ask Ruth to join</text><text x="55" y="856.1500000000001" font-size="20" fill="#b9cddd">Drafts a message the person sends</text><text x="55" y="883.1500000000001" font-size="20" fill="#b9cddd">themselves.</text><text x="575" y="856.1500000000001" font-size="20" fill="#b9cddd">A request to the church the person linked,</text><text x="575" y="88