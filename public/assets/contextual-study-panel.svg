<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1471" role="img" aria-labelledby="title desc" data-illustration-theme="light"><title id="title">Preview before deep study</title><desc id="desc">3 annotated interface examples with use cases and tradeoffs. Scripture samples are identified by edition.</desc><rect width="1200" height="1471" fill="#edf5f9" /><g font-family="Arial, sans-serif"><text x="40" y="65" font-size="30" fill="#102c47" font-weight="700">Preview before deep study</text><text x="40" y="116.5" font-size="18" fill="#102c47">These examples illustrate stages and behaviours that can work together.</text><text x="40" y="181.6" font-size="23" fill="#102c47" font-weight="700">A · Select an action</text><rect x="40" y="209.95" width="510" height="285.9000000000001" rx="6" fill="#ffffff" stroke="#9aafbf" /><text x="62" y="247.95" font-size="18" fill="#102c47" font-weight="700">Psalm 23 · BSB</text><rect x="62" y="280.05" width="466" height="82.40000000000003" rx="6" fill="#f3f7fa" stroke="#9aafbf" /><text x="76" y="307.05" font-size="13" fill="#102c47" font-weight="700">Psalm 23:1 · Selected</text><text x="76" y="339.90000000000003" font-size="19" fill="#102c47">The LORD is my shepherd; I shall not want.</text><text x="62" y="392.45000000000005" font-size="14" fill="#486078">Highlight  ·  Note  ·  Explore  ·  Ask</text><text x="62" y="426.75000000000006" font-size="12" fill="#102c47">2</text><text x="90" y="433.75000000000006" font-size="19" fill="#102c47">He makes me lie down in green pastures; He</text><text x="90" y="461.30000000000007" font-size="19" fill="#102c47">leads me beside quiet waters.</text><path d="M64 495.8500000000001v12 q0 8 8 8 h16 q8 0 8 8 v8" fill="none" stroke="#10324f" stroke-width="1.5" /><circle cx="64" cy="495.8500000000001" r="2.5" fill="#10324f" /><text x="40" y="556.8500000000001" font-size="17" fill="#102c47">Verse selection reveals actions; a contextual toolbar</text><text x="40" y="581.5000000000001" font-size="17" fill="#102c47">can avoid a wall of primary buttons.</text><text x="40" y="621.1500000000001" font-size="16" fill="#102c47">Use when: The user has selected text</text><text x="40" y="656.3500000000001" font-size="16" fill="#102c47">Consider: An action menu should stay small</text><text x="620" y="181.6" font-size="23" fill="#102c47" font-weight="700">B · Preview a resource</text><rect x="620" y="209.95" width="510" height="271.4000000000001" rx="6" fill="#ffffff" stroke="#9aafbf" /><text x="642" y="247.95" font-size="18" fill="#102c47" font-weight="700">Resources · Psalm 23:1</text><rect x="642" y="280.05" width="466" height="80.40000000000003" rx="6" fill="#ffffff" stroke="#9aafbf" /><text x="656" y="312.05" font-size="18" fill="#102c47" font-weight="700">Commentary</text><text x="656" y="340.15000000000003" font-size="14" fill="#102c47">Example author · Psalm 23:1</text><text x="642" y="390.45000000000005" font-size="14" fill="#486078">Illustrative commentary: Notice how the shepherd image shapes</text><text x="642" y="410.75000000000006" font-size="14" fill="#486078">the language of care.</text><text x="642" y="447.05000000000007" font-size="14" fill="#486078">Read full resource  ·  Back to passage</text><path d="M644 481.3500000000001v12 q0 8 8 8 h16 q8 0 8 8 v8" fill="none" stroke="#10324f" stroke-width="1.5" /><circle cx="644" cy="481.3500000000001" r="2.5" fill="#10324f" /><text x="620" y="542.3500000000001" font-size="17" fill="#102c47">Preview enough to choose a source. Keep its author and</text><text x="620" y="567.0000000000001" font-size="17" fill="#102c47">scope visible.</text><text x="620" y="606.6500000000001" font-size="16" fill="#102c47">Use when: A resource can be checked quickly</text><text x="620" y="641.8500000000001" font-size="16" fill="#102c47">Consider: A preview may omit details needed for study</text><text x="40" y="742.5500000000002" font-size="23" fill="#102c47" font-weight="700">C · Pin the panel</text><rect x="40" y="770.9000000000002" width="510" height="324.54999999999984" rx="6" fill="#ffffff" stroke="#9aafbf" /><text x="62" y="808.9000000000002" font-size="18" fill="#102c47" font-weight="700">Study panel · Pinned</text><text x="62" y="858.0000000000002" font-size="17" fill="#102c47" font-weight="700">Reader: Psalm 23:2</text><text x="62" y="893.6500000000002" font-size="12" fill="#102c47">2</text><text x="90" y="900.6500000000002" font-size="19" fill="#102c47">He makes me lie down in green pastures; He</text><text x="90" y="928.2000000000002" font-size="19" fill="#102c47">leads me beside quiet waters.</text><rect x="62" y="950.7500000000001" width="466" height="80.39999999999998" rx="6" fill="#ffffff" stroke="#9aafbf" /><text x="76" y="982.7500000000001" font-size="18" fill="#102c47" font-weight="700">Panel: Psalm 23:1</text><text x="76" y="1010.8500000000001" font-size="14" fill="#102c47">Pinned · Example commentary</text><text x="62" y="1061.15" font-size="14" fill="#486078">Follow reader  ·  Keep pinned</text><path d="M64 1095.45v12 q0 8 8 8 h16 q8 0 8 8 v8" fill="none" stroke="#10324f" stroke-width="1.5" /><circle cx="64" cy="1095.45" r="2.5" fill="#10324f" /><text x="40" y="1156.45" font-size="17" fill="#102c47">Reader and panel positions can differ. Show both and</text><text x="40" y="1181.1000000000001" font-size="17" fill="#102c47">make following the reader an explicit action.</text><text x="40" y="1220.7500000000002" font-size="16" fill="#102c47">Use when: A reference should remain fixed while reading</text><text x="40" y="1243.9500000000003" font-size="16" fill="#102c47">moves</text><text x="40" y="1279.1500000000003" font-size="16" fill="#102c47">Consider: Pinned and following states need distinct anchors</text><text x="40" y="1357.3500000000004" font-size="15" fill="#102c47">Original illustrative interfaces · Static controls · Any Scripture samples identify their edition. Sample catalogue and resource details are</text><text x="40" y="1379.1000000000004" font-size="15" fill="#102c47">illustrative.</text><text x="40" y="1434.8500000000004" font-size="14" fill="#102c47">patterns.missional.design/patterns/contextual-study-panel/</text></g></svg>