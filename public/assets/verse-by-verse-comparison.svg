 fill="#102c47" font-weight="700">Translation A · Mark 1</text><text x="1125" y="391.95" font-size="12" fill="#486078">8</text><rect x="1147" y="384.95" width="362.70000000000005" height="4" fill="#c3c8ce" /><rect x="1147" y="394.95" width="280.8" height="4" fill="#c3c8ce" /><text x="1125" y="429.95" font-size="12" fill="#486078">9</text><rect x="1147" y="422.95" width="362.70000000000005" height="4" fill="#c3c8ce" /><rect x="1147" y="432.95" width="280.8" height="4" fill="#c3c8ce" /><text x="1125" y="467.95" font-size="12" fill="#486078">10</text><rect x="1147" y="460.95" width="362.70000000000005" height="4" fill="#c3c8ce" /><rect x="1147" y="470.95" width="280.8" height="4" fill="#c3c8ce" /><rect x="1115" y="543.05" width="435" height="55.35000000000002" rx="8" fill="#edf5f7" stroke="#9aafbf" /><text x="1130" y="576.05" font-size="21" fill="#102c47" font-weight="700">Switch to Translation B</text><rect x="1115" y="614.4" width="435" height="55.35000000000002" rx="8" fill="#edf5f7" stroke="#9aafbf" /><text x="1130" y="647.4" font-size="21" fill="#102c47" font-weight="700">Compare the current verse</text><text x="55" y="1202.3999999999999" font-size="20" fill="#486078">Each verse group repeats both edition</text><text x="55" y="1229.3999999999999" font-size="20" fill="#486078">labels.</text><text x="575" y="1202.3999999999999" font-size="20" fill="#486078">Columns align verse groups, not individual</text><text x="575" y="1229.3999999999999" font-size="20" fill="#486078">words.</text><text x="1095" y="1202.3999999999999" font-size="20" fill="#486078">Sustained reading can retain the author’s</text><text x="1095" y="1229.3999999999999" font-size="20" fill="#486078">larger structure.</text><text x="55" y="1292.3999999999999" font-size="16" fill="#486078">SCHEMATIC TEXT ROWS, NOT LOADING STATES · ORIGINAL PROPOSALS · NOT PRODUCT SCREENSHOTS</text></g></svg>