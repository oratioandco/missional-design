<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1604" role="img" aria-labelledby="title desc"><title id="title">Interlinear rows expose their alignment</title><desc id="desc">3 annotated interface examples with use cases and tradeoffs. Scripture samples are identified by edition.</desc><rect width="1200" height="1604" fill="#f6f5f2"/><g font-family="Arial, sans-serif"><text x="40" y="65" font-size="30" fill="#17202a" font-weight="700">Interlinear rows expose their alignment</text><text x="40" y="116.5" font-size="18" fill="#17202a">Token stacks, aligned rows and word details support different levels of attention. A gloss is not a substitute for a</text><text x="40" y="142.6" font-size="18" fill="#17202a">translation.</text><text x="40" y="207.7" font-size="23" fill="#17202a" font-weight="700">A · Mobile: compact token stacks</text><rect x="40" y="236.04999999999998" width="510" height="294.04999999999995" rx="6" fill="white" stroke="#8a959f"/><text x="62" y="274.04999999999995" font-size="18" fill="#17202a" font-weight="700">John 1:1 · Greek</text><text x="62" y="323.15" font-size="17" fill="#17202a" font-weight="700">Greek and glosses · Bible Hub</text><text x="62.0" y="373.79999999999995" font-size="27" fill="#17202a" font-weight="700">Ἐν</text><text x="62.0" y="409.94999999999993" font-size="16" fill="#17202a">En</text><text x="62.0" y="440.1499999999999" font-size="15" fill="#17202a">In [the]</text><text x="295.0" y="373.79999999999995" font-size="27" fill="#17202a" font-weight="700">ἀρχῇ</text><text x="295.0" y="409.94999999999993" font-size="16" fill="#17202a">archē</text><text x="295.0" y="440.1499999999999" font-size="15" fill="#17202a">beginning</text><text x="62" y="495.79999999999995" font-size="14" fill="#43516a">Transliteration: On  ·  Word details</text><path d="M64 530.0999999999999v12 q0 8 8 8 h16 q8 0 8 8 v8" fill="none" stroke="#000462" stroke-width="1.5"/><circle cx="64" cy="530.0999999999999" r="2.5" fill="#000462"/><text x="40" y="591.0999999999999" font-size="17" fill="#17202a">Keep each source token together with its gloss. These</text><text x="40" y="615.7499999999999" font-size="17" fill="#17202a">two opening words illustrate token association, not a</text><text x="40" y="640.3999999999999" font-size="17" fill="#17202a">complete verse.</text><text x="40" y="680.0499999999998" font-size="16" fill="#17202a">Use when: Small-screen token inspection is useful</text><text x="40" y="715.2499999999999" font-size="16" fill="#17202a">Consider: Wrap whole token groups rather than individual</text><text x="40" y="738.4499999999999" font-size="16" fill="#17202a">rows</text><text x="620" y="207.7" font-size="23" fill="#17202a" font-weight="700">B · Large screen: aligned rows</text><rect x="620" y="236.04999999999998" width="510" height="315.04999999999995" rx="6" fill="white" stroke="#8a959f"/><text x="642" y="274.04999999999995" font-size="18" fill="#17202a" font-weight="700">John 1:1 · Aligned rows</text><text x="642" y="323.15" font-size="17" fill="#17202a" font-weight="700">Two-token excerpt · Bible Hub</text><text x="642" y="359.79999999999995" font-size="13" fill="#17202a">Greek</text><text x="814.42" y="365.79999999999995" font-size="19" fill="#17202a">Ἐν</text><text x="968.2" y="365.79999999999995" font-size="19" fill="#17202a">ἀρχῇ</text><text x="642" y="405.79999999999995" font-size="13" fill="#17202a">Transliteration</text><text x="814.42" y="411.79999999999995" font-size="19" fill="#17202a">En</text><text x="968.2" y="411.79999999999995" font-size="19" fill="#17202a">archē</text><text x="642" y="451.79999999999995" font-size="13" fill="#17202a">Gloss</text><text x="814.42" y="457.79999999999995" font-size="19" fill="#17202a">In [the]</text><text x="968.2" y="457.79999999999995" font-size="19" fill="#17202a">beginning</text><text x="642" y="516.8" font-size="14" fill="#43516a">Glosses: On  ·  Transliteration: On</text><path d="M644 551.0999999999999v12 q0 8 8 8 h16 q8 0 8 8 v8" fill="none" stroke="#000462" stroke-width="1.5"/><circle cx="644" cy="551.0999999999999" r="2.5" fill="#000462"/><text x="620" y="612.0999999999999" font-size="17" fill="#17202a">Parallel rows support systematic comparison on a larger</text><text x="620" y="636.7499999999999" font-size="17" fill="#17202a">surface. Keep the column association clear when text</text><text x="620" y="661.3999999999999" font-size="17" fill="#17202a">grows.</text><text x="620" y="701.0499999999998" font-size="16" fill="#17202a">Use when: Several linguistic layers need comparison</text><text x="620" y="736.2499999999999" font-size="16" fill="#17202a">Consider: Alignment and metadata require reliable sources</text><text x="40" y="824.65" font-size="23" fill="#17202a" font-weight="700">C · Word detail on demand</text><rect x="40" y="853.0" width="510" height="350.89999999999986" rx="6" fill="white" stroke="#8a959f"/><text x="62" y="891.0" font-size="18" fill="#17202a" font-weight="700">John 1:1 · Word detail</text><text x="62" y="940.1" font-size="17" fill="#17202a" font-weight="700">Greek source · Bible Hub</text><text x="62" y="990.75" font-size="27" fill="#17202a">Ἐν ἀρχῇ</text><rect x="62" y="1022.9" width="466" height="80.39999999999998" rx="6" fill="#fff" stroke="#b8c0c8"/><text x="76" y="1054.9" font-size="18" fill="#17202a" font-weight="700">ἀρχῇ · archē</text><text x="76" y="1083.0" font-size="14" fill="#17202a">Gloss: beginning</text><text x="62" y="1133.3" font-size="14" fill="#43516a">Strong’s Greek 746 · Bible Hub</text><text x="62" y="1169.6" font-size="14" fill="#43516a">Open lexical source  ·  Back to passage</text><path d="M64 1203.8999999999999v12 q0 8 8 8 h16 q8 0 8 8 v8" fill="none" stroke="#000462" stroke-width="1.5"/><circle cx="64" cy="1203.8999999999999" r="2.5" fill="#000462"/><text x="40" y="1264.8999999999999" font-size="17" fill="#17202a">A selected word can reveal information on demand. A</text><text x="40" y="1289.55" font-size="17" fill="#17202a">gloss is a starting point, not a complete definition or</text><text x="40" y="1314.2" font-size="17" fill="#17202a">theological conclusion.</text><text x="40" y="1353.8500000000001" font-size="16" fill="#17202a">Use when: Only one word needs deeper analysis</text><text x="40" y="1389.0500000000002" font-size="16" fill="#17202a">Consider: An on-demand sheet must retain the source token</text><text x="40" y="1412.2500000000002" font-size="16" fill="#17202a">anchor</text><text x="40" y="1490.4500000000003" font-size="15" fill="#17202a">Original illustrative interfaces · Static controls · Any Scripture samples identify their edition. Sample catalogue and resource details are</text><text x="40" y="1512.2000000000003" font-size="15" fill="#17202a">illustrative.</text><text x="40" y="1567.9500000000003" font-size="14" fill="#17202a">patterns.missional.design/patterns/interlinear-reading/</text></g></svg>