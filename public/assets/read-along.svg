<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1695" role="img" aria-labelledby="title desc"><title id="title">Playback and reading positions can differ</title><desc id="desc">3 annotated interface examples with use cases and tradeoffs. Scripture samples are identified by edition.</desc><rect width="1200" height="1695" fill="#f6f5f2"/><g font-family="Arial, sans-serif"><text x="40" y="65" font-size="30" fill="#17202a" font-weight="700">Playback and reading positions can differ</text><text x="40" y="116.5" font-size="18" fill="#17202a">These are states of one interaction. Reading and playback positions can differ without either being lost.</text><text x="40" y="181.6" font-size="23" fill="#17202a" font-weight="700">A · Follow narration</text><rect x="40" y="209.95" width="510" height="406.65000000000003" rx="6" fill="white" stroke="#8a959f"/><text x="62" y="247.95" font-size="18" fill="#17202a" font-weight="700">Psalm 23 · BSB</text><text x="62" y="297.05" font-size="17" fill="#17202a" font-weight="700">Following narration · Verse timing</text><text x="62" y="332.7" font-size="12" fill="#17202a">1</text><text x="90" y="339.7" font-size="19" fill="#17202a">The LORD is my shepherd; I shall not want.</text><rect x="62" y="362.25" width="466" height="109.95000000000005" rx="5" fill="#edf0fa" stroke="#000462"/><text x="76" y="387.25" font-size="13" fill="#17202a">Verse 2 · Playing</text><text x="76" y="422.1" font-size="19" fill="#17202a">He makes me lie down in green pastures; He</text><text x="76" y="449.65000000000003" font-size="19" fill="#17202a">leads me beside quiet waters.</text><rect x="62" y="502.20000000000005" width="466" height="3" rx="0" fill="#d4d9e0" stroke="#d4d9e0"/><rect x="62" y="502.20000000000005" width="119.82857142857142" height="3" rx="0" fill="#000462" stroke="#000462"/><text x="62" y="528.2" font-size="14" fill="#17202a">00:18                          01:10</text><text x="62" y="572.5" font-size="18" fill="#17202a" font-weight="700">−10 s             Pause             +10 s</text><path d="M64 616.6v12 q0 8 8 8 h16 q8 0 8 8 v8" fill="none" stroke="#000462" stroke-width="1.5"/><circle cx="64" cy="616.6" r="2.5" fill="#000462"/><text x="40" y="677.6" font-size="17" fill="#17202a">The current verse is highlighted from a timing map.</text><text x="40" y="702.25" font-size="17" fill="#17202a">Word-level highlighting would require word-level data.</text><text x="40" y="741.9" font-size="16" fill="#17202a">Use when: The reader wants to follow narration</text><text x="40" y="777.1" font-size="16" fill="#17202a">Consider: Automatic following should yield to manual</text><text x="40" y="800.3000000000001" font-size="16" fill="#17202a">scrolling</text><text x="620" y="181.6" font-size="23" fill="#17202a" font-weight="700">B · Explore freely</text><rect x="620" y="209.95" width="510" height="413.40000000000003" rx="6" fill="white" stroke="#8a959f"/><text x="642" y="247.95" font-size="18" fill="#17202a" font-weight="700">Psalm 23 · BSB</text><text x="642" y="297.05" font-size="17" fill="#17202a" font-weight="700">Following paused</text><text x="642" y="332.7" font-size="12" fill="#17202a">1</text><text x="670" y="339.7" font-size="19" fill="#17202a">The LORD is my shepherd; I shall not want.</text><rect x="642" y="362.25" width="466" height="80.40000000000003" rx="6" fill="#fff" stroke="#b8c0c8"/><text x="656" y="394.25" font-size="18" fill="#17202a" font-weight="700">Audio continues at verse 2</text><text x="656" y="422.35" font-size="14" fill="#17202a">BSB · Example recording</text><text x="642" y="472.65000000000003" font-size="14" fill="#43516a">Return to spoken verse</text><rect x="642" y="508.95000000000005" width="466" height="3" rx="0" fill="#d4d9e0" stroke="#d4d9e0"/><rect x="642" y="508.95000000000005" width="119.82857142857142" height="3" rx="0" fill="#000462" stroke="#000462"/><text x="642" y="534.95" font-size="14" fill="#17202a">00:18                          01:10</text><text x="642" y="579.25" font-size="18" fill="#17202a" font-weight="700">−10 s             Pause             +10 s</text><path d="M644 623.35v12 q0 8 8 8 h16 q8 0 8 8 v8" fill="none" stroke="#000462" stroke-width="1.5"/><circle cx="644" cy="623.35" r="2.5" fill="#000462"/><text x="620" y="684.35" font-size="17" fill="#17202a">Manual exploration pauses automatic following without</text><text x="620" y="709.0" font-size="17" fill="#17202a">pausing the audio.</text><text x="620" y="748.65" font-size="16" fill="#17202a">Use when: The reader explores elsewhere while listening</text><text x="620" y="783.85" font-size="16" fill="#17202a">Consider: The audio anchor needs a separate label</text><text x="40" y="886.5000000000001" font-size="23" fill="#17202a" font-weight="700">C · Rejoin playback</text><rect x="40" y="914.8500000000001" width="510" height="427.9499999999998" rx="6" fill="white" stroke="#8a959f"/><text x="62" y="952.8500000000001" font-size="18" fill="#17202a" font-weight="700">Psalm 23 · BSB</text><rect x="62" y="984.9500000000002" width="466" height="109.94999999999993" rx="5" fill="#edf0fa" stroke="#000462"/><text x="76" y="1009.9500000000002" font-size="13" fill="#17202a">Verse 2 · Audio position</text><text x="76" y="1044.8000000000002" font-size="19" fill="#17202a">He makes me lie down in green pastures; He</text><text x="76" y="1072.3500000000001" font-size="19" fill="#17202a">leads me beside quiet waters.</text><rect x="62" y="1110.9" width="466" height="51.200000000000045" rx="6" fill="#000462" stroke="#b8c0c8"/><text x="76" y="1140.9" font-size="16" fill="#fff" font-weight="700">Follow narration</text><text x="62" y="1192.1000000000001" font-size="14" fill="#43516a">Keep exploring</text><rect x="62" y="1228.4" width="466" height="3" rx="0" fill="#d4d9e0" stroke="#d4d9e0"/><rect x="62" y="1228.4" width="119.82857142857142" height="3" rx="0" fill="#000462" stroke="#000462"/><text x="62" y="1254.4" font-size="14" fill="#17202a">00:18                          01:10</text><text x="62" y="1298.7" font-size="18" fill="#17202a" font-weight="700">−10 s             Pause             +10 s</text><path d="M64 1342.8v12 q0 8 8 8 h16 q8 0 8 8 v8" fill="none" stroke="#000462" stroke-width="1.5"/><circle cx="64" cy="1342.8" r="2.5" fill="#000462"/><text x="40" y="1403.8" font-size="17" fill="#17202a">Returning to the audio position does not have to resume</text><text x="40" y="1428.45" font-size="17" fill="#17202a">automatic scrolling. Make that choice explicit.</text><text x="40" y="1468.1000000000001" font-size="16" fill="#17202a">Use when: The reader chooses to return to playback</text><text x="40" y="1503.3000000000002" font-size="16" fill="#17202a">Consider: Rejoining must not silently save a personal mark</text><text x="40" y="1581.5000000000002" font-size="15" fill="#17202a">Original illustrative interfaces · Static controls · Any Scripture samples identify their edition. Sample catalogue and resource details are</text><text x="40" y="1603.2500000000002" font-size="15" fill="#17202a">illustrative.</text><text x="40" y="1659.0000000000002" font-size="14" fill="#17202a">patterns.missional.design/patterns/read-along/</text></g></svg>