<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1610 2958" role="img" aria-label="When the assistant writes first" data-illustration-theme="dark"><svg y="0" viewBox="0 0 1610 995" role="img" aria-labelledby="title-0 desc-0"><title id="title-0">When the assistant writes first</title><desc id="desc-0">3 English interface examples. From an assistant that waits to be asked, through a check-in the person set in their own words, the app’s own reminder, a daily page built from memory and a follow-up on something shared, to a persona that says it misses them and an app that tells their friends: decide who may start a conversation, about what, and what happens when it goes unanswered.</desc><rect width="1610" height="995" fill="#f6f9fa" /><g font-family="Arial, sans-serif"><text x="55" y="46" font-size="18" fill="#b9cddd" font-weight="700">BIBLE AND FAITH APP DESIGN PATTERNS</text><text x="55" y="110" font-size="40" fill="#e8f1f7" font-weight="700">When the assistant writes first</text><text x="55" y="159.0" font-size="23" fill="#b9cddd">From an assistant that waits to be asked, through a check-in the person set in their own words, the app’s own reminder, a</text><text x="55" y="190.05" font-size="23" fill="#b9cddd">daily page built from memory and a follow-up on something shared, to a persona that says it misses them and an app that</text><text x="55" y="221.10000000000002" font-size="23" fill="#b9cddd">tells their friends: decide who may start a conversation, about what, and what happens when it goes unanswered.</text><rect x="55" y="329.15000000000003" width="475" height="485.0" rx="20" fill="#162e40" stroke="#708892" stroke-width="2" /><text x="55" y="287.15000000000003" font-size="23" fill="#e8f1f7" font-weight="700">A · Waits to be asked</text><text x="75" y="364.15000000000003" font-size="15" fill="#b9cddd">CONVERSATION · EXAMPLE</text><rect x="120" y="399.15000000000003" width="390" height="48" rx="10" fill="#203b50" stroke="#668399" /><text x="135" y="424.15000000000003" font-size="16" fill="#e8f1f7">Earlier message</text><text x="75" y="480.15000000000003" font-size="17" fill="#b9cddd">Nothing sent</text><text x="75" y="524.1" font-size="21" fill="#e8f1f7">The chat is there when they come back</text><rect x="575" y="329.15000000000003" width="475" height="485.0" rx="20" fill="#162e40" stroke="#708892" stroke-width="2" /><text x="575" y="287.15000000000003" font-size="23" fill="#e8f1f7" font-weight="700">B · A check-in they set</text><text x="595" y="364.15000000000003" font-size="15" fill="#b9cddd">CONVERSATION · EXAMPLE</text><rect x="640" y="399.15000000000003" width="390" height="48" rx="10" fill="#203b50" stroke="#668399" /><text x="655" y="424.15000000000003" font-size="16" fill="#e8f1f7">Earlier message</text><text x="595" y="480.15000000000003" font-size="17" fill="#b9cddd">Saturday 10:00</text><text x="595" y="524.1" font-size="21" fill="#e8f1f7">“How did Friday go?”</text><rect x="1095" y="329.15000000000003" width="475" height="485.0" rx="20" fill="#162e40" stroke="#708892" stroke-width="2" /><text x="1095" y="287.15000000000003" font-size="23" fill="#e8f1f7" font-weight="700">C · The app’s reminder</text><text x="1115" y="364.15000000000003" font-size="15" fill="#b9cddd">CONVERSATION · EXAMPLE</text><rect x="1160" y="399.15000000000003" width="390" height="48" rx="10" fill="#203b50" stroke="#668399" /><text x="1175" y="424.15000000000003" font-size="16" fill="#e8f1f7">Earlier message</text><text x="1115" y="480.15000000000003" font-size="17" fill="#b9cddd">Daily · 20:00</text><text x="1115" y="524.1" font-size="21" fill="#e8f1f7">Your evening reflection is ready</text><text x="55" y="856.1500000000001" font-size="20" fill="#b9cddd">The assistant answers; it never writes</text><text x="55" y="883.1500000000001" font-size="20" fill="#b9cddd">first.</text><text x="575" y="856.1500000000001" font-size="20" fill="#b9cddd">The person chooses the day, the time and the</text><text x="575" y="883.1500000000001" font-size="20" fill="#b9cddd">words.</text><text x="1095" y="856.1500000000001" font-size="20" fill="#b9cddd">The app’s own reminder, with nothing from</text><text x="1095" y="883.1500000000001" font-size="20" fill="#b9cddd">the chat.</text><text x="55" y="946.1500000000001" font-size="16" fill="#b9cddd">SCHEMATIC TEXT ROWS, NOT LOADING STATES · ORIGINAL PROPOSALS · NOT PRODUCT SCREENSHOTS</text></g></svg><svg y="995" viewBox="0 0 1610 995" role="img" aria-labelledby="title-3 desc-3"><title id="title-3">When the assistant writes first</title><desc id="desc-3">3 English interface examples. From an assistant that waits to be asked, through a check-in the person set in their own words, the app’s own reminder, a daily page built from memory and a follow-up on something shared, to a persona that says it misses them and an app that tells their friends: decide who may start a conversation, about what, and what happens when it goes unanswered.</desc><rect width="1610" height="995" fill="#f6f9fa" /><g font-family="Arial, sans-serif"><text x="55" y="46" font-size="18" fill="#b9cddd" font-weight="700">BIBLE AND FAITH APP DESIGN PATTERNS</text><text x="55" y="110" font-size="40" fill="#e8f1f7" font-weight="700">When the assistant writes first</text><text x="55" y="159.0" font-size="23" fill="#b9cddd">From an assistant that waits to be asked, through a check-in the person set in their own words, the app’s own reminder, a</text><text x="55" y="190.05" font-size="23" fill="#b9cddd">daily page built from memory and a follow-up on something shared, to a persona that says it misses them and an app that</text><text x="55" y="221.10000000000002" font-size="23" fill="#b9cddd">tells their friends: decide who may start a conversation, about what, and what happens when it goes unanswered.</text><rect x="55" y="329.15000000000003" width="475" height="485.0" rx="20" fill="#162e40" stroke="#708892" stroke-width="2" /><text x="55" y="287.15000000000003" font-size="23" fill="#e8f1f7" font-weight="700">D · A daily page from memory</text><text x="75" y="364.15000000000003" font-size="15" fill="#b9cddd">CONVERSATION · EXAMPLE</text><rect x="120" y="399.15000000000003" width="390" height="48" rx="10" fill="#203b50" stroke="#668399" /><text x="135" y="424.15000000000003" font-size="16" fill="#e8f1f7">Earlier message</text><text x="75" y="480.15000000000003" font-size="17" fill="#b9cddd">Your morning page</text><text x="75" y="524.1" font-size="21" fill="#e8f1f7">That’s all for today</text><rect x="575" y="329.15000000000003" width="475" height="485.0" rx="20" fill="#162e40" stroke="#708892" stroke-width="2" /><text x="575" y="287.15000000000003" font-size="23" fill="#e8f1f7" font-weight="700">E · Follows up on what was shared</text><text x="595" y="364.15000000000003" font-size="15" fill="#b9cddd">CONVERSATION · EXAMPLE</text><rect x="640" y="399.15000000000003" width="390" height="48" rx="10" fill="#203b50" stroke="#668399" /><text x="655" y="424.15000000000003" font-size="16" fill="#e8f1f7">Earlier message</text><text x="595" y="489.15000000000003" font-size="26" fill="#e8f1f7" font-weight="700">How did the call go?</text><text x="595" y="536.25" font-size="21" fill="#e8f1f7">Grace · AI</text><rect x="1095" y="329.15000000000003" width="475" height="485.0" rx="20" fill="#162e40" stroke="#708892" stroke-width="2" /><text x="1095" y="287.15000000000003" font-size="23" fill="#e8f1f7" font-weight="700">F · Says it misses them</text><text x="1115" y="364.15000000000003" font-size="15" fill="#b9cddd">CONVERSATION · EXAMPLE</text><rect x="1160" y="399.15000000000003" width="390" height="48" rx="10" fill="#203b50" stroke="#668399" /><text x="1175" y="424.15000000000003" font-size="16" fill="#e8f1f7">Earlier message</text><text x="1115" y="489.15000000000003" font-size="26" fill="#e8f1f7" font-weight="700">I miss you</text><text x="1115" y="536.25" font-size="21" fill="#e8f1f7">Did I say something wrong?</text><text x="55" y="856.1500000000001" font-size="20" fill="#b9cddd">Built overnight from what it remembers, and</text><text x="55" y="883.1500000000001" font-size="20" fill="#b9cddd">finished.</text><text x="575" y="856.1500000000001" font-size="20" fill="#b9cddd">The assistant writes first about something</text><text x="575" y="883.1500000000001" font-size="20" fill="#b9cddd">confided.</text><text x="1095" y="856.1500000000001" font-size="20" fill="#b9cddd">A persona claims feelings to bring someone</text><text x="1095" y="883.1500000000001" font-size="20" fill="#b9cddd">back.</text><text x="55" y="946.1500000000001" font-size="16" fill="#b9cddd">SCHEMATIC TEXT ROWS, NOT LOADING STATES · ORIGINAL PROPOSALS · NOT PRODUCT SCREENSHOTS</text></g></svg><svg y="1990" viewBox="0 0 1610 968" role="img" aria-labelledby="title-6 desc-6"><title id="title-6">When the assistant writes first</title><desc id="desc-6">1 English interface examples. From an assistant that waits to be asked, through a check-in the person set in their own words, the app’s own reminder, a daily page built from memory and a follow-up on something shared, to a persona that says it misses them and an app that tells their friends: decide who may start a conversation, about what, and what happens when it goes unanswered.</desc><rect width="1610" height="968" fill="#f6f9fa" /><g font-family="Arial, sans-serif"><text x="55" y="46" font-size="18" fill="#b9cddd" font-weight="700">BIBLE AND FAITH APP DESIGN PATTERNS</text><text x="55" y="110" font-size="40" fill="#e8f1f7" font-weight="700">When the assistant writes first</text><text x="55" y="159.0" font-size="23" fill="#b9cddd">From an assistant that waits to be asked, through a check-in the person set in their own words, the app’s own reminder, a</text><text x="55" y="190.05" font-size="23" fill="#b9cddd">daily page built from memory and a follow-up on something shared, to a persona that says it misses them and an app that</text><text x="55" y="221.10000000000002" font-size="23" fill="#b9cddd">tells their friends: decide who may start a conversation, about what, and what happens when it goes unanswered.</text><rect x="55" y="329.15000000000003" width="475" height="485.0" rx="20" fill="#162e40" stroke="#708892" stroke-width="2" /><text x="55" y="287.15000000000003" font-size="23" fill="#e8f1f7" font-weight="700">G · Tells someone else</text><text x="75" y="364.15000000000003" font-size="15" fill="#b9cddd">CONVERSATION · EXAMPLE</text><rect x="120" y="399.15000000000003" width="390" height="48" rx="10" fill="#203b50" stroke="#668399" /><text x="135" y="424.15000000000003" font-size="16" fill="#e8f1f7">Earlier message</text><text x="75" y="489.15000000000003" font-size="26" fill="#e8f1f7" font-weight="700">Anna might need to call</text><text x="75" y="536.25" font-size="21" fill="#e8f1f7">Sent automatically</text><text x="55" y="856.1500000000001" font-size="20" fill="#b9cddd">The app writes to friends about the person.</text><text x="55" y="919.1500000000001" font-size="16" fill="#b9cddd">SCHEMATIC TEXT ROWS, NOT LOADING STATES · ORIGINAL PROPOSALS · NOT PRODUCT SCREENSHOTS</text></g></svg></svg>