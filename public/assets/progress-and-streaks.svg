"302.05" font-size="15" fill="#486078">PRACTICE · EXAMPLE</text><text x="595" y="363.05" font-size="26" fill="#102c47" font-weight="700">A seven-session plan</text><rect x="595" y="389.15000000000003" width="435" height="159.55" rx="8" fill="#ffffff" stroke="#9aafbf" /><text x="610" y="422.15000000000003" font-size="21" fill="#102c47" font-weight="700">3 of 7 marked complete</text><text x="610" y="454.50000000000006" font-size="18" fill="#486078">Session 1 · Complete</text><text x="610" y="478.80000000000007" font-size="18" fill="#486078">Session 2 · Complete</text><text x="610" y="503.1000000000001" font-size="18" fill="#486078">Session 3 · Complete</text><text x="610" y="527.4000000000001" font-size="18" fill="#486078">Session 4 · Not marked complete</text><rect x="595" y="564.7" width="435" height="55.35000000000002" rx="8" fill="#edf5f7" stroke="#9aafbf" /><text x="610" y="597.7" font-size="21" fill="#102c47" font-weight="700">Continue session 4</text><text x="595" y="657.0500000000001" font-size="21" fill="#102c47">Edit completion</text><rect x="1095" y="267.05" width="475" height="485.0" rx="20" fill="#ffffff" stroke="#708892" stroke-width="2" /><text x="1095" y="225.05" font-size="23" fill="#102c47" font-weight="700">C · Shared calendar</text><text x="1115" y="302.05" font-size="15" fill="#486078">PRACTICE · EXAMPLE</text><text x="1115" y="363.05" font-size="26" fill="#102c47" font-weight="700">Read with the group</text><rect x="1115" y="389.15000000000003" width="435" height="86.65000000000003" rx="8" fill="#ffffff" stroke="#9aafbf" /><text x="1130" y="422.15000000000003" font-size="21" fill="#102c47" font-weight="700">Today’s reading</text><text x="1130" y="454.50000000000006" font-size="18" fill="#486078">Session 8 · Luke 18</text><rect x="1115" y="491.80000000000007" width="435" height="86.64999999999998" rx="8" fill="#ffffff" stroke="#9aafbf" /><text x="1130" y="524.8000000000001" font-size="21" fill="#102c47" font-weight="700">Your saved place</text><text x="1130" y="557.1500000000001" font-size="18" fill="#486078">Session 4 · Luke 15</text><rect x="1115" y="594.45" width="435" height="55.35000000000002" rx="8" fill="#edf5f7" stroke="#9aafbf" /><text x="1130" y="627.45" font-size="21" fill="#102c47" font-weight="700">Open today’s reading</text><text x="1115" y="686.8000000000001" font-size="21" fill="#102c47">Continue from my saved place</text><text x="55" y="794.05" font-size="20" fill="#486078">Orientation without a completion score.</text><text x="575" y="794.05" font-size="20" fill="#486078">A record the reader can correct.</text><text x="1095" y="794.05" font-size="20" fill="#486078">Today’s reading and personal progress stay</text><text x="1095" y="821.05" font-size="20" fill="#486078">distinct.</text><text x="55" y="884.05" font-size="16" fill="#486078">SCHEMATIC TEXT ROWS, NOT LOADING STATES · ORIGINAL PROPOSALS · NOT PRODUCT SCREENSHOTS</text></g></svg>