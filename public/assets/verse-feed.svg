<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1610 1990" role="img" aria-label="Feeds, cards and stories" data-illustration-theme="light"><svg y="0" viewBox="0 0 1610 995" role="img" aria-labelledby="title-0 desc-0"><title id="title-0">Feeds, cards and stories</title><desc id="desc-0">3 English interface examples. From scrolling a chapter as one page, through pages to turn, full-screen cards in order and a small daily set of stories, to a feed that carries on verse after verse and a shuffled feed that never ends: decide how a reader moves through Scripture, where they stop, and how far each verse is from its context.</desc><rect width="1610" height="995" fill="#f6f9fa" /><g font-family="Arial, sans-serif"><text x="55" y="46" font-size="18" fill="#486078" font-weight="700">BIBLE AND FAITH APP DESIGN PATTERNS</text><text x="55" y="110" font-size="40" fill="#102c47" font-weight="700">Feeds, cards and stories</text><text x="55" y="159.0" font-size="23" fill="#486078">From scrolling a chapter as one page, through pages to turn, full-screen cards in order and a small daily set of stories,</text><text x="55" y="190.05" font-size="23" fill="#486078">to a feed that carries on verse after verse and a shuffled feed that never ends: decide how a reader moves through</text><text x="55" y="221.10000000000002" font-size="23" fill="#486078">Scripture, where they stop, and how far each verse is from its context.</text><rect x="55" y="329.15000000000003" width="475" height="485.0" rx="20" fill="#ffffff" stroke="#708892" stroke-width="2" /><text x="55" y="287.15000000000003" font-size="23" fill="#102c47" font-weight="700">A · The page</text><text x="75" y="364.15000000000003" font-size="15" fill="#486078">BIBLE READER · EXAMPLE</text><rect x="75" y="399.15000000000003" width="435" height="145" rx="10" fill="#ffffff" stroke="#9aafbf" /><text x="87" y="422.15000000000003" font-size="14" fill="#102c47" font-weight="700">Passage context · Schematic text</text><text x="85" y="454.05