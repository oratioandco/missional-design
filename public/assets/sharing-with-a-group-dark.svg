<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1610 2931" role="img" aria-label="Sharing with a group" data-illustration-theme="dark"><svg y="0" viewBox="0 0 1610 995" role="img" aria-labelledby="title-0 desc-0"><title id="title-0">Sharing with a group</title><desc id="desc-0">3 English interface examples. From a request kept between someone and God, through one listener they choose, a few friends and a group with a leader, to the whole church and a public wall, with a board ranked by prayer streaks as a warning case: decide who hears a request, what each listener can and must do with it, and what comes back.</desc><rect width="1610" height="995" fill="#f6f9fa" /><g font-family="Arial, sans-serif"><text x="55" y="46" font-size="18" fill="#b9cddd" font-weight="700">BIBLE AND FAITH APP DESIGN PATTERNS</text><text x="55" y="110" font-size="40" fill="#e8f1f7" font-weight="700">Sharing with a group</text><text x="55" y="159.0" font-size="23" fill="#b9cddd">From a request kept between someone and God, through one listener they choose, a few friends and a group with a leader, to</text><text x="55" y="190.05" font-size="23" fill="#b9cddd">the whole church and a public wall, with a board ranked by prayer streaks as a warning case: decide who hears a request,</text><text x="55" y="221.10000000000002" font-size="23" fill="#b9cddd">what each listener can and must do with it, and what comes back.</text><rect x="55" y="329.15000000000003" width="475" height="485.0" rx="20" fill="#162e40" stroke="#708892" stroke-width="2" /><text x="55" y="287.15000000000003" font-size="23" fill="#e8f1f7" font-weight="700">A · Between you and God</text><text x="75" y="364.15000000000003" font-size="15" fill="#b9cddd">PRACTICE · EXAMPLE</text><text x="75" y="416.15000000000003" font-size="17" fill="#b9cddd">Only on this phone</text><rect x="75" y="439.1" width="435" height="55.35000000000002" rx="8" fill="#edf5f7" stroke="#668399" /><text x="90" y="472.1" font-size="21" fill="#e8f1f7" font-weight="700">Who can I talk to?</text><rect x="575" y="329.15000000000003" width="475" height="485.0" rx="20" fill="#162e40" stroke="#708892" stroke-width="2" /><text x="575" y="287.15000000000003" font-size="23" fill="#e8f1f7" font-weight="700">B · Through a person you choose</text><text x="595" y="364.15000000000003" font-size="15" fill="#b9cddd">PRACTICE · EXAMPLE</text><text x="595" y="416.15000000000003" font-size="17" fill="#b9cddd">What happens next</text><rect x="595" y="439.1" width="435" height="55.35000000000002" rx="8" fill="#edf5f7" stroke="#668399" /><text x="610" y="472.1" font-size="21" fill="#e8f1f7" font-weight="700">Send to Maren</text><rect x="1095" y="329.15000000000003" width="475" height="485.0" rx="20" fill="#162e40" stroke="#708892" stroke-width="2" /><text x="1095" y="287.15000000000003" font-size="23" fill="#e8f1f7" font-weight="700">C · A few people you choose</text><text x="1115" y="364.15000000000003" font-size="15" fill="#b9cddd">PRACTICE · EXAMPLE</text><text x="1115" y="416.15000000000003" font-size="17" fill="#b9cddd">My circle · 4 friends</text><rect x="1115" y="439.1" width="435" height="55.35000000000002" rx="8" fill="#edf5f7" stroke="#668399" /><text x="1130" y="472.1" font-size="21" fill="#e8f1f7" font-weight="700">Share with my circle</text><text x="55" y="856.1500000000001" font-size="20" fill="#b9cddd">A private journal; the app points to people</text><text x="55" y="883.1500000000001" font-size="20" fill="#b9cddd">and churches.</text><text x="575" y="856.1500000000001" font-size="20" fill="#b9cddd">One listener, with what they can and must do</text><text x="575" y="883.1500000000001" font-size="20" fill="#b9cddd">shown first.</text><text x="1095" y="856.1500000000001" font-size="20" fill="#b9cddd">A small circle the person invited.</text><text x="55" y="946.1500000000001" font-size="16" fill="#b9cddd">SCHEMATIC TEXT ROWS, NOT LOADING STATES · ORIGINAL PROPOSALS · NOT PRODUCT SCREENSHOTS</text></g></svg><svg y="995" viewBox="0 0 1610 968" role="img" aria-labelledby="title-3 desc-3"><title id="title-3">Sharing with a group</title><desc id="desc-3">3 English interface examples. From a request kept between someone and God, through one listener they choose, a few friends and a group with a leader, to the whole church and a public wall, with a board ranked by prayer streaks as a warning case: decide who hears a request, what each listener can and must do with it, and what comes back.</desc><rect width="1610" height="968" fill="#f6f9fa" /><g font-family="Arial, sans-serif"><text x="55" y="46" font-size="18" fill="#b9cddd" font-weight="700">BIBLE AND FAITH APP DESIGN PATTERNS</text><text x="55" y="110" font-size="40" fill="#e8f1f7" font-weight="700">Sharing with a group</text><text x="55" y="159.0" font-size="23" fill="#b9cddd">From a request kept between someone and God, through one listener they choose, a few friends and a group with a leader, to</text><text x="55" y="190.05" font-size="23" fill="#b9cddd">the whole church and a public wall, with a board ranked by prayer streaks as a warning case: decide who hears a request,</text><text x="55" y="221.10000000000002" font-size="23" fill="#b9cddd">what each listener can and must do with it, and what comes back.</text><rect x="55" y="329.15000000000003" width="475" height="485.0" rx="20" fill="#162e40" stroke="#708892" stroke-width="2" /><text x="55" y="287.15000000000003" font-size="23" fill="#e8f1f7" font-weight="700">D · A group with a leader</text><text x="75" y="364.15000000000003" font-size="15" fill="#b9cddd">PRACTICE · EXAMPLE</text><text x="75" y="416.15000000000003" font-size="17" fill="#b9cddd">Joined with a code</text><text x="75" y="460.1" font-size="21" fill="#e8f1f7">Before you share: leaders may have to</text><text x="75" y="488.45000000000005" font-size="21" fill="#e8f1f7">pass things on.</text><rect x="575" y="329.15000000000003" width="475" height="485.0" rx="20" fill="#162e40" stroke="#708892" stroke-width="2" /><text x="575" 