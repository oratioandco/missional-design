st, what each listener can and must do with it, and what comes back.</desc><rect width="1610" height="968" fill="#f6f9fa" /><g font-family="Arial, sans-serif"><text x="55" y="46" font-size="18" fill="#b9cddd" font-weight="700">BIBLE AND FAITH APP DESIGN PATTERNS</text><text x="55" y="110" font-size="40" fill="#e8f1f7" font-weight="700">Sharing with a group</text><text x="55" y="159.0" font-size="23" fill="#b9cddd">From a request kept between someone and God, through one listener they choose, a few friends and a group with a leader, to</text><text x="55" y="190.05" font-size="23" fill="#b9cddd">the whole church and a public wall, with a board ranked by prayer streaks as a warning case: decide who hears a request,</text><text x="55" y="221.10000000000002" font-size="23" fill="#b9cddd">what each listener can and must do with it, and what comes back.</text><rect x="55" y="329.15000000000003" width="475" height="485.0" rx="20" fill="#162e40" stroke="#708892" stroke-width="2" /><text x="55" y="287.15000000000003" font-size="23" fill="#e8f1f7" font-weight="700">G · Ranked by streaks</text><text x="75" y="364.15000000000003" font-size="15" fill="#b9cddd">PRACTICE · EXAMPLE</text><text x="75" y="425.15000000000003" font-size="26" fill="#e8f1f7" font-weight="700">Active pray-ers</text><rect x="75" y="451.25000000000006" width="435" height="55.35000000000002" rx="8" fill="#edf5f7" stroke="#668399" /><text x="90" y="484.25000000000006" font-size="21" fill="#e8f1f7" font-weight="700">Remind</text><text x="55" y="856.1500000000001" font-size="20" fill="#b9cddd">Requests beside a board of streaks.</text><text x="55" y="919.1500000000001" font-size="16" fill="#b9cddd">SCHEMATIC TEXT ROWS, NOT LOADING STATES · ORIGINAL PROPOSALS · NOT PRODUCT SCREENSHOTS</text></g></svg></svg>