<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1573" role="img" aria-labelledby="title desc" data-illustration-theme="dark"><title id="title">Choose a translation with enough context</title><desc id="desc">3 annotated interface examples with use cases and tradeoffs. Scripture samples are identified by edition.</desc><rect width="1200" height="1573" fill="#102333" /><g font-family="Arial, sans-serif"><text x="40" y="65" font-size="30" fill="#e8f1f7" font-weight="700">Choose a translation with enough context</text><text x="40" y="116.5" font-size="18" fill="#e8f1f7">Make language, edition and availability understandable before switching.</text><text x="40" y="181.6" font-size="23" fill="#e8f1f7" font-weight="700">A · Search all editions</text><rect x="40" y="209.95" width="510" height="336.6499999999999" rx="6" fill="#162e40" stroke="#668399" /><text x="62" y="247.95" font-size="18" fill="#e8f1f7" font-weight="700">Choose a translation</text><rect x="62" y="280.05" width="466" height="51.19999999999999" rx="6" fill="#162e40" stroke="#668399" /><text x="76" y="310.05" font-size="16" fill="#e8f1f7">Search names or abbreviations</text><text x="62" y="364.25" font-size="17" fill="#e8f1f7" font-weight="700">English</text><rect x="62" y="387.9" width="466" height="39.19999999999999" fill="#294f6b" /><text x="72" y="411.9" font-size="16" fill="#e8f1f7" font-weight="700">King James Version · BSB · Selected</text><path d="M62 436.09999999999997h466" stroke="#668399" /><text x="72" y="460.09999999999997" font-size="16" fill="#e8f1f7">World English Bible · WEB</text><path d="M62 484.29999999999995h466" stroke="#668399" /><text x="62" y="512.3" font-size="14" fill="#b9cddd">Other languages  ·  Cancel</text><path d="M64 546.5999999999999v12 q0 8 8 8 h16 q8 0 8 8 v8" fill="none" stroke="#a7d2f0" stroke-width="1.5" /><circle cx="64" cy="546.5999999999999" r="2.5" fill="#a7d2f0" /><text x="40" y="607.5999999999999" font-size="17" fill="#e8f1f7">Names identify editions; the current choice is a state,</text><text x="40" y="632.2499999999999" font-size="17" fill="#e8f1f7">not a recommendation.</text><text x="40" y="671.8999999999999" font-size="16" fill="#e8f1f7">Use when: The desired edition is known or the list is large</text><text x="40" y="707.0999999999999" font-size="16" fill="#e8f1f7">Consider: Explain abbreviations and distinguish similarly</text><text x="40" y="730.3" font-size="16" fill="#e8f1f7">named releases.</text><text x="620" y="181.6" font-size="23" fill="#e8f1f7" font-weight="700">B · Small catalogue popover</text><rect x="620" y="209.95" width="510" height="366.75000000000006" rx="6" fill="#162e40" stroke="#668399" /><text x="642" y="247.95" font-size="18" fill="#e8f1f7" font-weight="700">Psalm 23 · BSB</text><text x="642" y="292.05" font-size="12" fill="#e8f1f7">1</text><text x="670" y="299.05" font-size="19" fill="#e8f1f7">The LORD is my shepherd; I shall not want.</text><rect x="642" y="321.6" width="466" height="80.40000000000003" rx="6" fill="#162e40" stroke="#668399" /><text x="656" y="353.6" font-size="18" fill="#e8f1f7" font-weight="700">Translation</text><text x="656" y="381.70000000000005" font-size="14" fill="#e8f1f7">Current: BSB</text><rect x="642" y="418.00000000000006" width="466" height="39.19999999999999" fill="#294f6b" /><text x="652" y="442.00000000000006" font-size="16" fill="#e8f1f7" font-weight="700">BSB · Berean Standard Bible · Selected</text><path d="M642 466.20000000000005h466" stroke="#668399" /><text x="652" y="490.20000000000005" font-size="16" fill="#e8f1f7">WEB · World English Bible</text><path d="M642 514.4000000000001h466" stroke="#668399" /><text x="642" y="542.4000000000001" font-size="14" fill="#b9cddd">All translations  ·  Cancel</text><path d="M644 576.7v12 q0 8 8 8 h16 q8 0 8 8 v8" fill="none" stroke="#a7d2f0" stroke-width="1.5" /><circle cx="644" cy="576.7" r="2.5" fill="#a7d2f0" /><text x="620" y="637.7" font-size="17" fill="#e8f1f7">A short switcher can stay close to the reader. Provide a</text><text x="620" y="662.35" font-size="17" fill="#e8f1f7">route to the full catalogue.</text><text x="620" y="702.0" font-size="16" fill="#e8f1f7">Use when: The catalogue is short and the reader switches</text><text x="620" y="725.2" font-size="16" fill="#e8f1f7">often</text><text x="620" y="760.4000000000001" font-size="16" fill="#e8f1f7">Consider: Use full names; retain a route to language and</text><text x="620" y="783.6000000000001" font-size="16" fill="#e8f1f7">availability details if the catalogue grows.</text><text x="40" y="869.8000000000002" font-size="23" fill="#e8f1f7" font-weight="700">C · Availability details</text><rect x="40" y="898.1500000000002" width="510" height="322.65" rx="6" fill="#162e40" stroke="#668399" /><text x="62" y="936.1500000000002" font-size="18" fill="#e8f1f7" font-weight="700">World English Bible</text><text x="62" y="985.2500000000002" font-size="17" fill="#e8f1f7" font-weight="700">WEB · English</text><rect x="62" y="1008.9000000000002" width="466" height="80.39999999999998" rx="6" fill="#162e40" stroke="#668399" /><text x="76" y="1040.9" font-size="18" fill="#e8f1f7" font-weight="700">Text available online</text><text x="76" y="1069.0000000000002" font-size="14" fill="#e8f1f7">Audio not available in this example</text><rect x="62" y="1105.3000000000002" width="466" height="51.200000000000045" rx="6" fill="#a7d2f0" stroke="#668399" /><text x="76" y="1135.3000000000002" font-size="16" fill="#102333" font-weight="700">Use WEB</text><text x="62" y="1186.5000000000002" font-size="14" fill="#b9cddd">Download options  ·  Back</text><path d="M64 1220.8000000000002v12 q0 8 8 8 h16 q8 0 8 8 v8" fill="none" stroke="#a7d2f0" stroke-width="1.5" /><circle cx="64" cy="1220.8000000000002" r="2.5" fill="#a7d2f0" /><text x="40" y="1281.8000000000002" font-size="17" fill="#e8f1f7">Choosing text and downloading text are different</text><text x="40" y="1306.4500000000003" font-size="17" fill="#e8f1f7">actions. Availability shown here is illustrative.</text><text x="40" y="1346.1000000000004" font-size="16" fill="#e8f1f7">Use when: Offline access or a capability affects the choice</text><text x="40" y="1381.3000000000004" font-size="16" fill="#e8f1f7">Consider: Add detail only where it supports a decision.</text><text x="40" y="1459.5000000000005" font-size="15" fill="#e8f1f7">Original illustrative interfaces · Static controls · Any Scripture samples identify their edition. Sample catalogue and resource details are</text><text x="40" y="1481.2500000000005" font-size="15" fill="#e8f1f7">illustrative.</text><text x="40" y="1537.0000000000005" font-size="14" fill="#e8f1f7">patterns.missional.design/patterns/translation-picker/</text></g></svg>