00000000003" font-size="15" fill="#486078">PRACTICE · EXAMPLE</text><text x="595" y="425.15000000000003" font-size="26" fill="#102c47" font-weight="700">Your 11-day streak ended</text><rect x="595" y="451.25000000000006" width="435" height="55.35000000000002" rx="8" fill="#edf5f7" stroke="#9aafbf" /><text x="610" y="484.25000000000006" font-size="21" fill="#102c47" font-weight="700">Repair streak · 3 gems</text><text x="55" y="856.1500000000001" font-size="20" fill="#486078">Each date has its own readings.</text><text x="575" y="856.1500000000001" font-size="20" fill="#486078">Consecutive days counted and protected.</text><text x="55" y="919.1500000000001" font-size="16" fill="#486078">SCHEMATIC TEXT ROWS, NOT LOADING STATES · ORIGINAL PROPOSALS · NOT PRODUCT SCREENSHOTS</text></g></svg></svg>