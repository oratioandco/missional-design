<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1610 1963" role="img" aria-label="Reading plans" data-illustration-theme="light"><svg y="0" viewBox="0 0 1610 995" role="img" aria-labelledby="title-0 desc-0"><title id="title-0">Reading plans</title><desc id="desc-0">3 English interface examples. From a plan tied to calendar dates, through a sequence that waits for the reader and a weekly rhythm, to readings that belong to each day, and streaks as a warning case: decide what a plan asks of time, and what happens when someone comes back after days away.</desc><rect width="1610" height="995" fill="#f6f9fa" /><g font-family="Arial, sans-serif"><text x="55" y="46" font-size="18" fill="#486078" font-weight="700">BIBLE AND FAITH APP DESIGN PATTERNS</text><text x="55" y="110" font-size="40" fill="#102c47" font-weight="700">Reading plans</text><text x="55" y="159.0" font-size="23" fill="#486078">From a plan tied to calendar dates, through a sequence that waits for the reader and a weekly rhythm, to readings that</text><text x="55" y="190.05" font-size="23" fill="#486078">belong to each day, and streaks as a warning case: decide what a plan asks of time, and what happens when someone comes</text><text x="55" y="221.10000000000002" font-size="23" fill="#486078">back after days away.</text><rect x="55" y="329.15000000000003" width="475" height="485.0" rx="20" fill="#ffffff" stroke="#708892" stroke-width="2" /><text x="55" y="287.15000000000003" font-size="23" fill="#102c47" font-weight="700">A · Dated plan</text><text x="75" y="364.15000000000003" font-size="15" fill="#486078">PRACTICE · EXAMPLE</text><text x="75" y="425.15000000000003" font-size="26" fill="#102c47" font-weight="700">Welcome back</text><rect x="75" y="451.25000000000006" width="435" height="83.69999999999999" rx="8" fill="#edf5f7" stroke="#9aafbf" /><text x="90" y="484.25000000000006" font-size="21" fill="#102c47" font-weight="700">Today’s reading · Where I stopped ·</text><text x="90" y="512.6000000000001" font-size="21" fill="#102c47" font-weight="700">Move my dates</text><rect x="575" y="329.15000000000003" width="475" height="485.0" rx="20" fill="#ffffff" stroke="#708892" stroke-width="2" /><text x="575" y="287.15000000000003" font-size="23" fill="#102c47" font-weight="700">B · Sequence</text><text x="595" y="364.15000000000003" font-size="15" fill="#486078">PRACTICE · EXAMPLE</text><text x="595" y="416.15000000000003" font-size="17" fill="#486078">Reading 12 of 40</text><rect x="595" y="439.1" width="435" height="55.35000000000002" rx="8" fill="#edf5f7" stroke="#9aafbf" /><text x="610" y="472.1" font-size="21" fill="#102c47" font-weight="700">Read Exodus 12</text><rect x="1095" y="329.15000000000003" width="475" height="485.0" rx="20" fill="#ffffff" stroke="#708892" stroke-width="2" /><text x="1095" y="287.15000000000003" font-size="23" fill="#102c47" font-weight="700">C · Weekly rhythm</text><text x="1115" y="364.15000000000003" font-size="15" fill="#486078">PRACTICE · EXAMPLE</text><text x="1115" y="416.15000000000003" font-size="17" fill="#486078">This week · 0 of 5</text><rect x="1115" y="439.1" width="435" height="55.35000000000002" rx="8" fill="#edf5f7" stroke="#9aafbf" /><text x="1130" y="472.1" font-size="21" fill="#102c47" font-weight="700">Read Exodus 12</text><text x="55" y="856.1500000000001" font-size="20" fill="#486078">Each reading has a date; returns offer a</text><text x="55" y="883.1500000000001" font-size="20" fill="#486078">choice.</text><text x="575" y="856.1500000000001" font-size="20" fill="#486078">One reading after another, no dates.</text><text x="1095" y="856.1500000000001" font-size="20" fill="#486078">A number per week, starting fresh each</text><text x="1095" y="883.1500000000001" font-size="20" fill="#486078">Monday.</text><text x="55" y="946.1500000000001" font-size="16" fill="#486078">SCHEMATIC TEXT ROWS, NOT LOADING STATES · ORIGINAL PROPOSALS · NOT PRODUCT SCREENSHOTS</text></g></svg><svg y="995" viewBox="0 0 1610 968" role="img