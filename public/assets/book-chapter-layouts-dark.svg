<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 2893" role="img" aria-labelledby="title desc" data-illustration-theme="dark"><title id="title">Book and chapter pickers: list, grid or drill-down?</title><desc id="desc">5 annotated interface examples with use cases and tradeoffs. Scripture samples are identified by edition.</desc><rect width="1200" height="2893" fill="#102333" /><g font-family="Arial, sans-serif"><text x="40" y="65" font-size="30" fill="#e8f1f7" font-weight="700">Book and chapter pickers: list, grid or drill-down?</text><text x="40" y="116.5" font-size="18" fill="#e8f1f7">Book lists and book grids are alternatives; chapter grids and chapter lists are another independent choice. Search</text><text x="40" y="142.6" font-size="18" fill="#e8f1f7">can stay above either book layout.</text><text x="40" y="207.7" font-size="23" fill="#e8f1f7" font-weight="700">A · Book list</text><rect x="40" y="236.04999999999998" width="510" height="488.80000000000007" rx="6" fill="#162e40" stroke="#668399" /><text x="62" y="274.04999999999995" font-size="18" fill="#e8f1f7" font-weight="700">Choose a book</text><rect x="62" y="306.15" width="466" height="51.19999999999999" rx="6" fill="#162e40" stroke="#668399" /><text x="76" y="336.15" font-size="16" fill="#e8f1f7">Find a book</text><text x="72" y="397.34999999999997" font-size="16" fill="#e8f1f7">Matthew</text><path d="M62 421.54999999999995h466" stroke="#668399" /><rect x="62" y="421.54999999999995" width="466" height="39.19999999999999" fill="#294f6b" /><text x="72" y="445.54999999999995" font-size="16" fill="#e8f1f7" font-weight="700">Mark · Selected</text><path d="M62 469.74999999999994h466" stroke="#668399" /><text x="72" y="493.74999999999994" font-size="16" fill="#e8f1f7">Luke</text><path d="M62 517.9499999999999h466" stroke="#668399" /><text x="72" y="541.9499999999999" font-size="16" fill="#e8f1f7">John</text><path d="M62 566.15h466" stroke="#668399" /><text x="72" y="590.15" font-size="16" fill="#e8f1f7">Acts</text><path d="M62 614.35h466" stroke="#668399" /><text x="72" y="638.35" font-size="16" fill="#e8f1f7">Romans</text><path d="M62 662.5500000000001h466" stroke="#668399" /><text x="62" y="690.5500000000001" font-size="14" fill="#b9cddd">Cancel</text><path d="M64 724.85v12 q0 8 8 8 h16 q8 0 8 8 v8" fill="none" stroke="#a7d2f0" stroke-width="1.5" /><circle cx="64" cy="724.85" r="2.5" fill="#a7d2f0" /><text x="40" y="785.85" font-size="17" fill="#e8f1f7">Full names and a predictable order help when a reader</text><text x="40" y="810.5" font-size="17" fill="#e8f1f7">does not know an abbreviation.</text><text x="40" y="850.15" font-size="16" fill="#e8f1f7">Use when: Readers may not recognise abbreviations</text><text x="40" y="885.35" font-size="16" fill="#e8f1f7">Consider: A long list needs preserved position, search and</text><text x="40" y="908.5500000000001" font-size="16" fill="#e8f1f7">meaningful headings.</text><text x="620" y="207.7" font-size="23" fill="#e8f1f7" font-weight="700">B · Book grid</text><rect x="620" y="236.04999999999998" width="510" height="346.5999999999999" rx="6" fill="#162e40" stroke="#668399" /><text x="642" y="274.04999999999995" font-size="18" fill="#e8f1f7" font-weight="700">Choose a book</text><rect x="642" y="306.15" width="466" height="51.19999999999999" rx="6" fill="#162e40" stroke="#668399" /><text x="656" y="336.15" font-size="16" fill="#e8f1f7">Find a book</text><rect x="642.0" y="373.34999999999997" width="229.0" height="40" rx="5" fill="#162e40" stroke="#668399" /><text x="650.0" y="396.34999999999997" font-size="15" fill="#e8f1f7">Matthew</text><rect x="879.0" y="373.34999999999997" width="229.0" height="40" rx="5" fill="#294f6b" stroke="#a7d2f0" /><text x="887.0" y="396.34999999999997" font-size="15" fill="#e8f1f7" font-weight="700">Mark</text><rect x="642.0" y="422.34999999999997" width="229.0" height="40" rx="5" fill="#162e40" stroke="#668399" /><text x="650.0" y="445.34999999999997" font-size="15" fill="#e8f1f7">Luke</text><rect x="879.0" y="422.34999999999997" width="229.0" height="40" rx="5" fill="#162e40" stroke="#668399" /><text x="887.0" y="445.34999999999997" font-size="15" fill="#e8f1f7">John</text><rect x="642.0" y="471.34999999999997" width="229.0" height="40" rx="5" fill="#162e40" stroke="#668399" /><text x="650.0" y="494.34999999999997" font-size="15" fill="#e8f1f7">Acts</text><rect x="879.0" y="471.34999999999997" width="229.0" height="40" rx="5" fill="#162e40" stroke="#668399" /><text x="887.0" y="494.34999999999997" font-size="15" fill="#e8f1f7">Romans</text><text x="642" y="548.3499999999999" font-size="14" fill="#b9cddd">List view  ·  Cancel</text><path d="M644 582.6499999999999v12 q0 8 8 8 h16 q8 0 8 8 v8" fill="none" stroke="#a7d2f0" stroke-width="1.5" /><circle cx="644" cy="582.6499999999999" r="2.5" fill="#a7d2f0" /><text x="620" y="643.6499999999999" font-size="17" fill="#e8f1f7">A grid improves visual scanning for some readers; long</text><text x="620" y="668.2999999999998" font-size="17" fill="#e8f1f7">names still need room.</text><text x="620" y="707.9499999999998" font-size="16" fill="#e8f1f7">Use when: Readers scan familiar books frequently</text><text x="620" y="743.1499999999999" font-size="16" fill="#e8f1f7">Consider: Long names and large text may require fewer</text><text x="620" y="766.3499999999999" font-size="16" fill="#e8f1f7">columns or a list fallback.</text><text x="40" y="994.7500000000001" font-size="23" fill="#e8f1f7" font-weight="700">C · Chapter grid</text><rect x="40" y="1023.1000000000001" width="510" height="431.89999999999986" rx="6" fill="#162e40" stroke="#668399" /><text x="62" y="1061.1000000000001" font-size="18" fill="#e8f1f7" font-weight="700">Mark · Choose chapter</text><text x="62" y="1107.2" font-size="14" fill="#b9cddd">Back to books</text><rect x="62.0" y="1129.5" width="110.5" height="40" rx="5" fill="#162e40" stroke="#668399" /><text x="70.0" y="1152.5" font-size="15" fill="#e8f1f7">1</text><rect x="180.5" y="1129.5" width="110.5" height="40" rx="5" fill="#162e40" stroke="#668399" /><text x="188.5" y="1152.5" font-size="15" fill="#e8f1f7">2</text><rect x="299.0" y="1129.5" width="110.5" height="40" rx="5" fill="#294f6b" stroke="#a7d2f0" /><text x="307.0" y="1152.5" font-size="15" fill="#e8f1f7" font-weight="700">3</text><rect x="417.5" y="1129.5" width="110.5" height="40" rx="5" fill="#162e40" stroke="#668399" /><text x="425.5" y="1152.5" font-size="15" fill="#e8f1f7">4</text><rect x="62.0" y="1178.5" width="110.5" height="40" rx="5" fill="#162e40" stroke="#668399" /><text x="70.0" y="1201.5" font-size="15" fill="#e8f1f7">5</text><rect x="180.5" y="1178.5" width="110.5" height="40" rx="5" fill="#162e40" stroke="#668399" /><text x="188.5" y="1201.5" font-size="15" fill="#e8f1f7">6</text><rect x="299.0" y="1178.5" width="110.5" height="40" rx="5" fill="#162e40" stroke="#668399" /><text x="307.0" y="1201.5" font-size="15" fill="#e8f1f7">7</text><rect x="417.5" y="1178.5" width="110.5" height="40" rx="5" fill="#162e40" stroke="#668399" /><text x="425.5" y="1201.5" font-size="15" fill="#e8f1f7">8</text><rect x="62.0" y="1227.5" width="110.5" height="40" rx="5" fill="#162e40" stroke="#668399" /><text x="70.0" y="1250.5" font-size="15" fill="#e8f1f7">9</text><rect x="180.5" y="1227.5" width="110.5" height="40" rx="5" fill="#162e40" stroke="#668399" /><text x="188.5" y="1250.5" font-size="15" fill="#e8f1f7">10</text><rect x="299.0" y="1227.5" width="110.5" height="40" rx="5" fill="#162e40" stroke="#668399" /><text x="307.0" y="1250.5" font-size="15" fill="#e8f1f7">11</text><rect x="417.5" y="1227.5" width="110.5" height="40" rx="5" fill="#162e40" stroke="#668399" /><text x="425.5" y="1250.5" font-size="15" fill="#e8f1f7">12</text><rect x="62.0" y="1276.5" width="110.5" height="40" rx="5" fill="#162e40" stroke="#668399" /><text x="70.0" y="1299.5" font-size="15" fill="#e8f1f7">13</text><rect x="180.5" y="1276.5" width="110.5" height="40" rx="5" fill="#162e40" stroke="#668399" /><text x="188.5" y="1299.5" font-size="15" fill="#e8f1f7">14</text><rect x="299.0" y="1276.5" width="110.5" height="40" rx="5" fill="#162e40" stroke="#668399" /><text x="307.0" y="1299.5" font-size="15" fill="#e8f1f7">15</text><rect x="417.5" y="1276.5" width="110.5" height="40" rx="5" fill="#162e40" stroke="#668399" /><text x="425.5" y="1299.5" font-size="15" fill="#e8f1f7">16</text><rect x="62" y="1339.5" width="466" height="51.200000000000045" rx="6" fill="#a7d2f0" stroke="#668399" /><text x="76" y="1369.5" font-size="16" fill="#102333" font-weight="700">Open Mark 3</text><text x="62" y="1420.7" font-size="14" fill="#b9cddd">Choose a verse</text><path d="M64 1455.0v12 q0 8 8 8 h16 q8 0 8 8 v8" fill="none" stroke="#a7d2f0" stroke-width="1.5" /><circle cx="64" cy="1455.0" r="2.5" fill="#a7d2f0" /><text x="40" y="1516.0" font-size="17" fill="#e8f1f7">The selected book stays visible; going back should</text><text x="40" y="1540.65" font-size="17" fill="#e8f1f7">preserve it.</text><text x="40" y="1580.3000000000002" font-size="16" fill="#e8f1f7">Use when: A small screen needs room for one choice at a time</text><text x="40" y="1615.5000000000002" font-size="16" fill="#e8f1f7">Consider: Extra steps should not erase the previous</text><text x="40" y="1638.7000000000003" font-size="16" fill="#e8f1f7">selection or scroll position.</text><text x="620" y="994.7500000000001" font-size="23" fill="#e8f1f7" font-weight="700">D · Chapter list</text><rect x="620" y="1023.1000000000001" width="510" height="476.9000000000001" rx="6" fill="#162e40" stroke="#668399" /><text x="642" y="1061.1000000000001" font-size="18" fill="#e8f1f7" font-weight="700">Mark · Chapter list</text><text x="642" y="1107.2" font-size="14" fill="#b9cddd">Back to books  ·  Grid view</text><text x="652" y="1153.5" font-size="16" fill="#e8f1f7">Chapter 1</text><path d="M642 1177.7h466" stroke="#668399" /><text x="652" y="1201.7" font-size="16" fill="#e8f1f7">Chapter 2</text><path d="M642 1225.9h466" stroke="#668399" /><rect x="642" y="1225.9" width="466" height="39.200000000000045" fill="#294f6b" /><text x="652" y="1249.9" font-size="16" fill="#e8f1f7" font-weight="700">Chapter 3 · Selected</text><path d="M642 1274.1000000000001h466" stroke="#668399" /><text x="652" y="1298.1000000000001" font-size="16" fill="#e8f1f7">Chapter 4</text><path d="M642 1322.3000000000002h466" stroke="#668399" /><text x="652" y="1346.3000000000002" font-size="16" fill="#e8f1f7">Chapter 5</text><path d="M642 1370.5000000000002h466" stroke="#668399" /><rect x="642" y="1384.5000000000002" width="466" height="51.200000000000045" rx="6" fill="#a7d2f0" stroke="#668399" /><text x="656" y="1414.5000000000002" font-size="16" fill="#102333" font-weight="700">Open Mark 3</text><text x="642" y="1465.7000000000003" font-size="14" fill="#b9cddd">Choose a verse</text><path d="M644 1500.0000000000002v12 q0 8 8 8 h16 q8 0 8 8 v8" fill="none" stroke="#a7d2f0" stroke-width="1.5" /><circle cx="644" cy="1500.0000000000002" r="2.5" fill="#a7d2f0" /><text x="620" y="1561.0000000000002" font-size="17" fill="#e8f1f7">A list and a grid can serve the same chapter step. This</text><text x="620" y="1585.6500000000003" font-size="17" fill="#e8f1f7">illustration shows an excerpt of the list.</text><text x="620" y="1625.3000000000004" font-size="16" fill="#e8f1f7">Use when: Larger labels, generous targets or chapter</text><text x="620" y="1648.5000000000005" font-size="16" fill="#e8f1f7">descriptions are more useful than density</text><text x="620" y="1683.7000000000005" font-size="16" fill="#e8f1f7">Consider: Long books need more scrolling; offer a direct</text><text x="620" y="1706.9000000000005" font-size="16" fill="#e8f1f7">chapter jump and preserve position.</text><text x="40" y="1793.1000000000006" font-size="23" fill="#e8f1f7" font-weight="700">E · Expand in place</text><rect x="40" y="1821.4500000000005" width="510" height="673.55" rx="6" fill="#162e40" stroke="#668399" /><text x="62" y="1859.4500000000005" font-size="18" fill="#e8f1f7" font-weight="700">Books</text><text x="72" y="1915.5500000000004" font-size="16" fill="#e8f1f7">Genesis</text><path d="M62 1939.7500000000005h466" stroke="#668399" /><text x="72" y="1963.7500000000005" font-size="16" fill="#e8f1f7">Exodus</text><path d="M62 1987.9500000000005h466" stroke="#668399" /><text x="72" y="2011.9500000000005" font-size="16" fill="#e8f1f7">Leviticus</text><path d="M62 2036.1500000000005h466" stroke="#668399" /><text x="72" y="2060.1500000000005" font-size="16" fill="#e8f1f7">Numbers</text><path d="M62 2084.3500000000004h466" stroke="#668399" /><text x="62" y="2115.3500000000004" font-size="17" fill="#e8f1f7" font-weight="700">Deuteronomy · Expanded</text><rect x="62.0" y="2139.0000000000005" width="110.5" height="40" rx="5" fill="#162e40" stroke="#668399" /><text x="70.0" y="2162.0000000000005" font-size="15" fill="#e8f1f7">21</text><rect x="180.5" y="2139.0000000000005" width="110.5" height="40" rx="5" fill="#162e40" stroke="#668399" /><text x="188.5" y="2162.0000000000005" font-size="15" fill="#e8f1f7">22</text><rect x="299.0" y="2139.0000000000005" width="110.5" height="40" rx="5" fill="#162e40" stroke="#668399" /><text x="307.0" y="2162.0000000000005" font-size="15" fill="#e8f1f7">23</text><rect x="417.5" y="2139.0000000000005" width="110.5" height="40" rx="5" fill="#162e40" stroke="#668399" /><text x="425.5" y="2162.0000000000005" font-size="15" fill="#e8f1f7">24</text><rect x="62.0" y="2188.0000000000005" width="110.5" height="40" rx="5" fill="#294f6b" stroke="#a7d2f0" /><text x="70.0" y="2211.0000000000005" font-size="15" fill="#e8f1f7" font-weight="700">25</text><rect x="180.5" y="2188.0000000000005" width="110.5" height="40" rx="5" fill="#162e40" stroke="#668399" /><text x="188.5" y="2211.0000000000005" font-size="15" fill="#e8f1f7">26</text><rect x="299.0" y="2188.0000000000005" width="110.5" height="40" rx="5" fill="#162e40" stroke="#668399" /><text x="307.0" y="2211.0000000000005" font-size="15" fill="#e8f1f7">27</text><rect x="417.5" y="2188.0000000000005" width="110.5" height="40" rx="5" fill="#162e40" stroke="#668399" /><text x="425.5" y="2211.0000000000005" font-size="15" fill="#e8f1f7">28</text><rect x="62.0" y="2237.0000000000005" width="110.5" height="40" rx="5" fill="#162e40" stroke="#668399" /><text x="70.0" y="2260.0000000000005" font-size="15" fill="#e8f1f7">29</text><rect x="180.5" y="2237.0000000000005" width="110.5" height="40" rx="5" fill="#162e40" stroke="#668399" /><text x="188.5" y="2260.0000000000005" font-size="15" fill="#e8f1f7">30</text><text x="62" y="2314.0000000000005" font-size="14" fill="#b9cddd">Excerpt of the 34-chapter grid</text><text x="72" y="2360.3000000000006" font-size="16" fill="#e8f1f7">Joshua</text><path d="M62 2384.5000000000005h466" stroke="#668399" /><text x="72" y="2408.5000000000005" font-size="16" fill="#e8f1f7">Judges</text><path d="M62 2432.7000000000003h466" stroke="#668399" /><text x="62" y="2460.7000000000003" font-size="14" fill="#b9cddd">Cancel</text><path d="M64 2495.0000000000005v12 q0 8 8 8 h16 q8 0 8 8 v8" fill="none" stroke="#a7d2f0" stroke-width="1.5" /><circle cx="64" cy="2495.0000000000005" r="2.5" fill="#a7d2f0" /><text x="40" y="2556.0000000000005" font-size="17" fill="#e8f1f7">The chapter grid expands inside its book row. Other</text><text x="40" y="2580.6500000000005" font-size="17" fill="#e8f1f7">books remain part of the same list.</text><text x="40" y="2620.3000000000006" font-size="16" fill="#e8f1f7">Use when: Keeping neighbouring books visible helps</text><text x="40" y="2643.5000000000005" font-size="16" fill="#e8f1f7">orientation</text><text x="40" y="2678.7000000000003" font-size="16" fill="#e8f1f7">Consider: Long chapter grids push later books down; preserve</text><text x="40" y="2701.9" font-size="16" fill="#e8f1f7">the expanded book and scroll position.</text><text x="40" y="2780.1" font-size="15" fill="#e8f1f7">Original illustrative interfaces · Static controls · Any Scripture samples identify their edition. Sample catalogue and resource details are</text><text x="40" y="2801.85" font-size="15" fill="#e8f1f7">illustrative.</text><text x="40" y="2857.6" font-size="14" fill="#e8f1f7">patterns.missional.design/patterns/book-chapter-layouts/</text></g></svg>