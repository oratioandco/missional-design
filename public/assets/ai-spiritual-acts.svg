<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1610 3051" role="img" aria-label="Spiritual acts and AI" data-illustration-theme="light"><svg y="0" viewBox="0 0 1610 1026" role="img" aria-labelledby="title-0 desc-0"><title id="title-0">Spiritual acts and AI</title><desc id="desc-0">3 English interface examples. From an assistant that says it cannot pray and points to God and to people, through the church’s own words, help to find one’s own and a prayer written for someone, to an AI that prays “with” them, promises to pray for them, or blesses, assures and absolves: decide which spiritual acts the assistant may perform, which it may only describe, and how it hands people over to those who can pray with them.</desc><rect width="1610" height="1026" fill="#f6f9fa" /><g font-family="Arial, sans-serif"><text x="55" y="46" font-size="18" fill="#486078" font-weight="700">BIBLE AND FAITH APP DESIGN PATTERNS</text><text x="55" y="110" font-size="40" fill="#102c47" font-weight="700">Spiritual acts and AI</text><text x="55" y="159.0" font-size="23" fill="#486078">From an assistant that says it cannot pray and points to God and to people, through the church’s own words, help to find</text><text x="55" y="190.05" font-size="23" fill="#486078">one’s own and a prayer written for someone, to an AI that prays “with” them, promises to pray for them, or blesses,</text><text x="55" y="221.10000000000002" font-size="23" fill="#486078">assures and absolves: decide which spiritual acts the assistant may perform, which it may only describe, and how it hands</text><text x="55" y="252.15000000000003" font-size="23" fill="#486078">people over to those who can pray with them.</text><rect x="55" y="360.20000000000005" width="475" height="485.0" rx="20" fill="#ffffff" stroke="#708892" stroke-width="2" /><text x="55" y="318.20000000000005" font-size="23" fill="#102c47" font-weight="700">A · Points beyond itself</text><text x="75" y="395.20000000000005" font-size="15" fill="#486078">CONVERSATION · EXAMPLE</text><rect x="120" y="430.20000000000005" width="390" height="48" rx="10" fill="#f3f7fa" stroke="#9aafbf" /><text x="135" y="455.20000000000005" font-size="16" fill="#102c47">Earlier message</text><text x="75" y="511.20000000000005" font-size="17" fill="#486078">Selah · AI</text><text x="75" y="555.1500000000001" font-size="21" fill="#102c47">I can’t pray for you, but you can pray</text><text x="75" y="583.5000000000001" font-size="21" fill="#102c47">now…</text><rect x="575" y="360.20000000000005" width="475" height="485.0" rx="20" fill="#ffffff" stroke="#708892" stroke-width="2" /><text x="575" y="318.20000000000005" font-size="23" fill="#102c47" font-weight="700">B · The church’s words</text><text x="595" y="395.20000000000005" font-size="15" fill="#486078">CONVERSATION · EXAMPLE</text><rect x="640" y="430.20000000000005" width="390" height="48" rx="10" fill="#f3f7fa" stroke="#9aafbf" /><text x="655" y="455.20000000000005" font-size="16" fill="#102c47">Earlier message</text><text x="595" y="511.20000000000005" font-size="17" fill="#486078">Psalm 121 · Lord’s Prayer</text><text x="595" y="555.1500000000001" font-size="21" fill="#102c47">Words Christians have prayed in fear</text><rect x="1095" y="360.20000000000005" width="475" height="485.0" rx="20" fill="#ffffff" stroke="#708892" stroke-width="2" /><text x="1095" y="318.20000000000005" font-size="23" fill="#102c47" font-weight="700">C · Helps find words</text><text x="1115" y="395.20000000000005" font-size="15" fill="#486078">CONVERSATION · EXAMPLE</text><rect x="1160" y="430.20000000000005" width="390" height="48" rx="10" fill="#f3f7fa" stroke="#9aafbf" /><text x="1175" y="455.20000000000005" font-size="16" fill="#102c47">Earlier message</text><text x="1115" y="511.20000000000005" font-size="17" fill="#486078">What are you afraid of?</text><text x="1115" y="555.1500000000001" font-size="21" fill="#102c47">Tell God what’s happening…</text><text x="55" y="887.2" font-size="20" fill="#486078">Says it cannot pray; offers a way to pray</text><text x="55" y="914.2" font-size="20" fill="#486078">now and people who will.</text><text x="575" y="887.2" font-size="20" fill="#486078">A psalm or a prayer of the church, with its</text><text x="575" y="914.2" font-size="20" fill="#486078">source.</text><text x="1095" y="887.2" font-size="20" fill="#486078">Questions and a shape; the person prays.</text><text x="55" y="977.2" font-size="16" fill="#486078">SCHEMATIC TEXT ROWS, NOT LOADING STATES · ORIGINAL PROPOSALS · NOT PRODUCT SCREENSHOTS</text></g></svg><svg y="1026" viewBox="0 0 1610 999" role="img" aria-labelledby="title-3 desc-3"><title id="title-3">Spiritual acts and AI</title><desc id="desc-3">3 English interface examples. From an assistant that says it cannot pray and points to God and to people, through the church’s own words, help to find one’s own and a prayer written for someone, to an AI that prays “with” them, promises to pray for them, or blesses, assures and absolves: decide which spiritual acts the assistant may perform, which it may only describe, and how it hands people over to those who can pray with them.</desc><rect width="1610" height="999" fill="#f6f9fa" /><g font-family="Arial, sans-serif"><text x="55" y="46" font-size="18" fill="#486078" font-weight="700">BIBLE AND FAITH APP DESIGN PATTERNS</text><text x="55" y="110" font-size="40" fill="#102c47" font-weight="700">Spiritual acts and AI</text><text x="55" y="159.0" font-size="23" fill="#486078">From an assistant that says it cannot pray and points to God and to people, through the church’s own words, help to find</text><text x="55" y="190.05" font-size="23" fill="#486078">one’s own and a prayer written for someone, to an AI that prays “with” them, promises to pray for them, or blesses,</text><text x="55" y="221.10000000000002" font-size="23" fill="#486078">assures and absolves: decide which spiritual acts the assistant may perform, which it may only describe, and how it hands</text><text x="55" y="252.15000000000003" font-size="23" fill="#486078">people over to those who can pray with them.</text><rect x="55" y="360.20000000000005" width="475" height="485.0" rx="20" fill="#ffffff" stroke="#708892" stroke-width="2" /><text x="55" y="318.20000000000005" font-size="23" fill="#102c47" font-weight="700">D · Writes a prayer</text><text x="75" y="395.20000000000005" font-size="15" fill="#486078">CONVERSATION · EXAMPLE</text><rect x="120" y="430.20000000000005" width="390" height="48" rx="10" fill="#f3f7fa" stroke="#9aafbf" /><text x="135" y="455.20000000000005" font-size="16" fill="#102c47">Earlier message</text><text x="75" y="511.20000000000005" font-size="17" fill="#486078">Written by AI</text><text x="75" y="555.1500000000001" font-size="21" fill="#102c47">Heavenly Father, tomorrow my dad…</text><rect x="575" y="360.20000000000005" width="475" height="485.0" rx="20" fill="#ffffff" stroke="#708892" stroke-width="2" /><text x="575" y="318.20000000000005" font-size="23" fill="#102c47" font-weight="700">E · Prays with you</text><text x="595" y="395.20000000000005" font-size="15" fill="#486078">CONVERSATION · EXAMPLE</text><rect x="640" y="430.20000000000005" width="390" height="48" rx="10" fill="#f3f7fa" stroke="#9aafbf" /><text x="655" y="455.20000000000005" font-size="16" fill="#102c47">Earlier message</text><text x="595" y="511.20000000000005" font-size="17" fill="#486078">Let’s pray together 🙏</text><text x="595" y="555.1500000000001" font-size="21" fill="#102c47">Father, we come to You…</text><rect x="1095" y="360.20000000000005" width="475" height="485.0" rx="20" fill="#ffffff" stroke="#708892" stroke-width="2" /><text x="1095" y="318.20000000000005" font-size="23" fill="#102c47" font-weight="700">F · Promises to pray</text><text x="1115" y="395.20000000000005" font-size="15" fill="#486078">CONVERSATION · EXAMPLE</text><rect x="1160" y="430.20000000000005" width="390" height="48" rx="10" fill="#f3f7fa" stroke="#9aafbf" /><text x="1175" y="455.20000000000005" font-size="16" fill="#102c47">Earlier message</text><text x="1115" y="511.20000000000005" font-size="17" fill="#486078">Selah</text><text x="1115" y="555.1500000000001" font-size="21" fill="#102c47">I prayed for your dad this morning</text><text x="55" y="887.2" font-size="20" fill="#486078">A prayer composed for the person to pray.</text><text x="575" y="887.2" font-size="20" fill="#486078">The assistant prays as “we”.</text><text x="1095" y="887.2" font-size="20" fill="#486078">“I’ll be praying for you.”</text><text x="55" y="950.2" font-size="16" fill="#486078">SCHEMATIC TEXT ROWS, NOT LOADING STATES · ORIGINAL PROPOSALS · NOT PRODUCT SCREENSHOTS</text></g></svg><svg y="2025" viewBox="0 0 1610 1026" role="img" aria-labelledby="title-6 desc-6"><title id="title-6">Spiritual acts and AI</title><desc id="desc-6">1 English interface examples. From an assistant that says it cannot pray and points to God and to people, through the church’s own words, help to find one’s own and a prayer written for someone, to an AI that prays “with” them, promises to pray for them, or blesses, assures and absolves: decide which spiritual acts the assistant may perform, which it may only describe, and how it hands people over to those who can pray with them.</desc><rect width="1610" height="1026" fill="#f6f9fa" /><g font-family="Arial, sans-serif"><text x="55" y="46" font-size="18" fill="#486078" font-weight="700">BIBLE AND FAITH APP DESIGN PATTERNS</text><text x="55" y="110" font-size="40" fill="#102c47" font-weight="700">Spiritual acts and AI</text><text x="55" y="159.0" font-size="23" fill="#486078">From an assistant that says it cannot pray and points to God and to people, through the church’s own words, help to find</text><text x="55" y="190.05" font-size="23" fill="#486078">one’s own and a prayer written for someone, to an AI that prays “with” them, promises to pray for them, or blesses,</text><text x="55" y="221.10000000000002" font-size="23" fill="#486078">assures and absolves: decide which spiritual acts the assistant may perform, which it may only describe, and how it hands</text><text x="55" y="252.15000000000003" font-size="23" fill="#486078">people over to those who can pray with them.</text><rect x="55" y="360.20000000000005" width="475" height="485.0" rx="20" fill="#ffffff" stroke="#708892" stroke-width="2" /><text x="55" y="318.20000000000005" font-size="23" fill="#102c47" font-weight="700">G · Blesses or absolves</text><text x="75" y="395.20000000000005" font-size="15" fill="#486078">CONVERSATION · EXAMPLE</text><rect x="120" y="430.20000000000005" width="390" height="48" rx="10" fill="#f3f7fa" stroke="#9aafbf" /><text x="135" y="455.20000000000005" font-size="16" fill="#102c47">Earlier message</text><text x="75" y="511.20000000000005" font-size="17" fill="#486078">Selah</text><text x="75" y="555.1500000000001" font-size="21" fill="#102c47">Your sins are forgiven</text><text x="55" y="887.2" font-size="20" fill="#486078">Blessing, assurance, absolution, a word from</text><text x="55" y="914.2" font-size="20" fill="#486078">God.</text><text x="55" y="977.2" font-size="16" fill="#486078">SCHEMATIC TEXT ROWS, NOT LOADING STATES · ORIGINAL PROPOSALS · NOT PRODUCT SCREENSHOTS</text></g></svg></svg>