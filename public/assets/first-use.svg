<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1610 1990" role="img" aria-label="First use" data-illustration-theme="light"><svg y="0" viewBox="0 0 1610 995" role="img" aria-labelledby="title-0 desc-0"><title id="title-0">First use</title><desc id="desc-0">3 English interface examples. From opening on a passage, a prayer or a question box with nothing asked, through a first page of places to start, guest use and a short tour, to questions first and payment before the first use: decide what a new person must give, and when, before they reach what they came for.</desc><rect width="1610" height="995" fill="#f6f9fa" /><g font-family="Arial, sans-serif"><text x="55" y="46" font-size="18" fill="#486078" font-weight="700">BIBLE AND FAITH APP DESIGN PATTERNS</text><text x="55" y="110" font-size="40" fill="#102c47" font-weight="700">First use</text><text x="55" y="159.0" font-size="23" fill="#486078">From opening on a passage, a prayer or a question box with nothing asked, through a first page of places to start, guest</text><text x="55" y="190.05" font-size="23" fill="#486078">use and a short tour, to questions first and payment before the first use: decide what a new person must give, and when,</text><text x="55" y="221.10000000000002" font-size="23" fill="#486078">before they reach what they came for.</text><rect x="55" y="329.15000000000003" width="475" height="485.0" rx="20" fill="#ffffff" stroke="#708892" stroke-width="2" /><text x="55" y="287.15000000000003" font-size="23" fill="#102c47" font-weight="700">A · Open on what they came for</text><text x="75" y="364.15000000000003" font-size="15" fill="#486078">PRACTICE · EXAMPLE</text><text x="75" y="416.15000000000003" font-size="17" fill="#486078">John 1 · today</text><rect x="75" y="439.1" width="435" height="55.35000000000002" rx="8" fill="#edf5f7" stroke="#9aafbf" /><text x="90" y="472.1" font-size="21" fill="#102c47" font-weight="700">Read</text><rect x="575" y="329.15000000000003" width="475" height="485.0" rx="20" fill="#ffffff" stroke="#708892" stroke-width="2" /><text x="575" y="287.15000000000003" font-size="23" fill="#102c47" font-weight="700">B · A first page of places to start</text><text x="595" y="364.15000000000003" font-size="15" fill="#486078">PRACTICE · EXAMPLE</text><text x="595" y="425.15000000000003" font-size="26" fill="#102c47" font-weight="700">Where would you like to start?</text><text x="595" y="472.25000000000006" font-size="21" fill="#102c47">I need someone to talk to now</text><rect x="1095" y="329.15000000000003" width="475" height="485.0" rx="20" fill="#ffffff" stroke="#708892" stroke-width="2" /><text x="1095" y="287.15000000000003" font-size="23" fill="#102c47" font-weight="700">C · Guest first</text><text x="1115" y="364.15000000000003" font-size="15" fill="#486078">PRACTICE · EXAMPLE</text><text x="1115" y="416.15000000000003" font-size="17" fill="#486078">Guest</text><rect x="1115" y="439.1" width="435" height="83.70000000000005" rx="8" fill="#edf5f7" stroke="#9aafbf" /><text x="1130" y="472.1" font-size="21" fill="#102c47" font-weight="700">Create an account to keep this</text><text x="1130" y="500.45000000000005" font-size="21" fill="#102c47" font-weight="700">highlight</text><text x="55" y="856.1500000000001" font-size="20" fill="#486078">Today’s passage, a prayer or a question box;</text><text x="55" y="883.1500000000001" font-size="20" fill="#486078">nothing asked.</text><text x="575" y="856.1500000000001" font-size="20" fill="#486078">A short list of situations, with help at the</text><text x="575" y="883.1500000000001" font-size="20" fill="#486078">top.</text><text x="1095" y="856.1500000000001" font-size="20" fill="#486078">Use it now; an account when there is</text><text x="1095" y="883.1500000000001" font-size="20" fill="#486078">something to keep.</text><text x="55" y="946.1500000000001" font-size="16" fill="#486078">SCHEMATIC TEXT ROWS, NOT LOADING STATES · ORIGINAL PROPOSALS · NOT PRODUCT SCREENSHOTS</text></g></svg><svg y="995" viewBox="0 0 1610 995" role="img" aria-labelledby="title-3 desc-3"><title id="title-3">First use</title><desc id="desc-3">3 English interface examples. From opening on a passage, a prayer or a question box with nothing asked, through a first page of places to start, guest use and a short tour, to questions first and payment before the first use: decide what a new person must give, and when, before they reach what they came for.</desc><rect width="1610" height="995" fill="#f6f9fa" /><g font-family="Arial, sans-serif"><text x="55" y="46" font-size="18" fill="#486078" font-weight="700">BIBLE AND FAITH APP DESIGN PATTERNS</text><text x="55" y="110" font-size="40" fill="#102c47" font-weight="700">First use</text><text x="55" y="159.0" font-size="23" fill="#486078">From opening on a passage, a prayer or a question box with nothing asked, through a first page of places to start, guest</text><text x="55" y="190.05" font-size="23" fill="#486078">use and a short tour, to questions first and payment before the first use: decide what a new person must give, and when,</text><text x="55" y="221.10000000000002" font-size="23" fill="#486078">before they reach what they came for.</text><rect x="55" y="329.15000000000003" width="475" height="485.0" rx="20" fill="#ffffff" stroke="#708892" stroke-width="2" /><text x="55" y="287.15000000000003" font-size="23" fill="#102c47" font-weight="700">D · A short tour first</text><text x="75" y="364.15000000000003" font-size="15" fill="#486078">PRACTICE · EXAMPLE</text><text x="75" y="416.15000000000003" font-size="17" fill="#486078">2 of 4</text><rect x="75" y="439.1" width="435" height="55.35000000000002" rx="8" fill="#edf5f7" stroke="#9aafbf" /><text x="90" y="472.1" font-size="21" fill="#102c47" font-weight="700">Skip</text><rect x="575" y="329.15000000000003" width="475" height="485.0" rx="20" fill="#ffffff" stroke="#708892" stroke-width="2" /><text x="575" y="287.15000000000003" font-size="23" fill="#102c47" font-weight="700">E · Questions first</text><text x="595" y="364.15000000000003" font-size="15" fill="#486078">PRACTICE · EXAMPLE</text><text x="595" y="425.15000000000003" font-size="26" fill="#102c47" font-weight="700">What brings you here?</text><rect x="595" y="451.25000000000006" width="435" height="55.35000000000002" rx="8" fill="#edf5f7" stroke="#9aafbf" /><text x="610" y="484.25000000000006" font-size="21" fill="#102c47" font-weight="700">Continue</text><rect x="1095" y="329.15000000000003" width="475" height="485.0" rx="20" fill="#ffffff" stroke="#708892" stroke-width="2" /><text x="1095" y="287.15000000000003" font-size="23" fill="#102c47" font-weight="700">F · Asking for payment</text><text x="1115" y="364.15000000000003" font-size="15" fill="#486078">PRACTICE · EXAMPLE</text><text x="1115" y="425.15000000000003" font-size="26" fill="#102c47" font-weight="700">Start your free trial</text><text x="1115" y="472.25000000000006" font-size="21" fill="#102c47">3 days free, then $6.99 a week</text><text x="55" y="856.1500000000001" font-size="20" fill="#486078">A few skippable slides before the first use.</text><text x="575" y="856.1500000000001" font-size="20" fill="#486078">Goals, age and familiarity before any</text><text x="575" y="883.1500000000001" font-size="20" fill="#486078">content.</text><text x="1095" y="856.1500000000001" font-size="20" fill="#486078">Before the first use it is a gate; after, it</text><text x="1095" y="883.1500000000001" font-size="20" fill="#486078">can be honest.</text><text x="55" y="946.1500000000001" font-size="16" fill="#486078">SCHEMATIC TEXT ROWS, NOT LOADING STATES · ORIGINAL PROPOSALS · NOT PRODUCT SCREENSHOTS</text></g></svg></svg>