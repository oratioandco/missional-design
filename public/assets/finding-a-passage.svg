<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1872" role="img" aria-labelledby="title desc"><title id="title">Finding a passage</title><desc id="desc">4 annotated interface examples with use cases and tradeoffs. Scripture samples are identified by edition.</desc><rect width="1200" height="1872" fill="#f6f5f2"/><g font-family="Arial, sans-serif"><text x="40" y="65" font-size="30" fill="#30343b" font-weight="700">Finding a passage</text><text x="40" y="116.5" font-size="18" fill="#30343b">Browse step by step, keep levels together on a larger screen, or enter a known reference. These routes can coexist.</text><text x="40" y="181.6" font-size="23" fill="#30343b" font-weight="700">A · Step by step</text><rect x="40" y="209.95" width="510" height="431.90000000000003" rx="8" fill="#fcfbf7" stroke="#c2c8c2"/><text x="62" y="247.95" font-size="18" fill="#30343b" font-weight="700">Mark · Choose chapter</text><text x="62" y="294.05" font-size="14" fill="#53615c">Back to books</text><rect x="62.0" y="316.35" width="110.5" height="40" rx="5" fill="#fff" stroke="#c7cbd0"/><text x="70.0" y="339.35" font-size="15" fill="#30343b">1</text><rect x="180.5" y="316.35" width="110.5" height="40" rx="5" fill="#fff" stroke="#c7cbd0"/><text x="188.5" y="339.35" font-size="15" fill="#30343b">2</text><rect x="299.0" y="316.35" width="110.5" height="40" rx="5" fill="#f5e2ae" stroke="#42565a"/><text x="307.0" y="339.35" font-size="15" fill="#30343b" font-weight="700">3</text><rect x="417.5" y="316.35" width="110.5" height="40" rx="5" fill="#fff" stroke="#c7cbd0"/><text x="425.5" y="339.35" font-size="15" fill="#30343b">4</text><rect x="62.0" y="365.35" width="110.5" height="40" rx="5" fill="#fff" stroke="#c7cbd0"/><text x="70.0" y="388.35" font-size="15" fill="#30343b">5</text><rect x="180.5" y="365.35" width="110.5" height="40" rx="5" fill="#fff" stroke="#c7cbd0"/><text x="188.5" y="388.35" font-size="15" fill="#30343b">6</text><rect x="299.0" y="365.35" width="110.5" height="40" rx="5" fill="#fff" stroke="#c7cbd0"/><text x="307.0" y="388.35" font-size="15" fill="#30343b">7</text><rect x="417.5" y="365.35" width="110.5" height="40" rx="5" fill="#fff" stroke="#c7cbd0"/><text x="425.5" y="388.35" font-size="15" fill="#30343b">8</text><rect x="62.0" y="414.35" width="110.5" height="40" rx="5" fill="#fff" stroke="#c7cbd0"/><text x="70.0" y="437.35" font-size="15" fill="#30343b">9</text><rect x="180.5" y="414.35" width="110.5" height="40" rx="5" fill="#fff" stroke="#c7cbd0"/><text x="188.5" y="437.35" font-size="15" fill="#30343b">10</text><rect x="299.0" y="414.35" width="110.5" height="40" rx="5" fill="#fff" stroke="#c7cbd0"/><text x="307.0" y="437.35" font-size="15" fill="#30343b">11</text><rect x="417.5" y="414.35" width="110.5" height="40" rx="5" fill="#fff" stroke="#c7cbd0"/><text x="425.5" y="437.35" font-size="15" fill="#30343b">12</text><rect x="62.0" y="463.35" width="110.5" height="40" rx="5" fill="#fff" stroke="#c7cbd0"/><text x="70.0" y="486.35" font-size="15" fill="#30343b">13</text><rect x="180.5" y="463.35" width="110.5" height="40" rx="5" fill="#fff" stroke="#c7cbd0"/><text x="188.5" y="486.35" font-size="15" fill="#30343b">14</text><rect x="299.0" y="463.35" width="110.5" height="40" rx="5" fill="#fff" stroke="#c7cbd0"/><text x="307.0" y="486.35" font-size="15" fill="#30343b">15</text><rect x="417.5" y="463.35" width="110.5" height="40" rx="5" fill="#fff" stroke="#c7cbd0"/><text x="425.5" y="486.35" font-size="15" fill="#30343b">16</text><rect x="62" y="526.35" width="180" height="49.200000000000045" rx="12" fill="#e0ece7" stroke="#839188"/><text x="80" y="555.35" font-size="16" fill="#244a43" font-weight="700">Open Mark 3</text><text x="62" y="607.5500000000001" font-size="14" fill="#53615c">Choose a verse</text><path d="M64 641.85v12 q0 8 8 8 h16 q8 0 8 8 v8" fill="none" stroke="#42565a" stroke-width="1.5"/><circle cx="64" cy="641.85" r="2.5" fill="#42565a"/><text x="40" y="702.85" font-size="17" fill="#30343b">This is the chapter step after choosing a book. Back</text><text x="40" y="727.5" font-size="17" fill="#30343b">returns to the book list.</text><text x="40" y="767.15" font-size="16" fill="#30343b">Use when: Small screens or readers who need full names</text><text x="40" y="802.35" font-size="16" fill="#30343b">Consider: More steps; show the selected book and let back</text><text x="40" y="825.5500000000001" font-size="16" fill="#30343b">retain it.</text><text x="620" y="181.6" font-size="23" fill="#30343b" font-weight="700">B · Browse together</text><rect x="620" y="209.95" width="510" height="488.8" rx="8" fill="#fcfbf7" stroke="#c2c8c2"/><text x="642" y="247.95" font-size="18" fill="#30343b" font-weight="700">Choose a passage</text><text x="652" y="304.05" font-size="16" fill="#30343b">Matthew</text><path d="M642 328.25h223.67999999999998" stroke="#d7d9dd"/><rect x="642" y="328.25" width="223.67999999999998" height="39.19999999999999" fill="#f5e2ae"/><text x="652" y="352.25" font-size="16" fill="#30343b" font-weight="700">Mark · Selected</text><path d="M642 376.45h223.67999999999998" stroke="#d7d9dd"/><text x="652" y="400.45" font-size="16" fill="#30343b">Luke</text><path d="M642 424.65h223.67999999999998" stroke="#d7d9dd"/><text x="652" y="448.65" font-size="16" fill="#30343b">John</text><path d="M642 472.84999999999997h223.67999999999998" stroke="#d7d9dd"/><text x="652" y="496.84999999999997" font-size="16" fill="#30343b">Acts</text><path d="M642 521.05h223.67999999999998" stroke="#d7d9dd"/><text x="652" y="545.05" font-size="16" fill="#30343b">Romans</text><path d="M642 569.25h223.67999999999998" stroke="#d7d9dd"/><rect x="884.32" y="280.05" width="49.919999999999995" height="40" rx="5" fill="#fff" stroke="#c7cbd0"/><text x="892.32" y="303.05" font-size="15" fill="#30343b">1</text><rect x="942.24" y="280.05" width="49.919999999999995" height="40" rx="5" fill="#fff" stroke="#c7cbd0"/><text x="950.24" y="303.05" font-size="15" fill="#30343b">2</text><rect x="1000.1600000000001" y="280.05" width="49.919999999999995" height="40" rx="5" fill="#f5e2ae" stroke="#42565a"/><text x="1008.1600000000001" y="303.05" font-size="15" fill="#30343b" font-weight="700">3</text><rect x="1058.08" y="280.05" width="49.919999999999995" height="40" rx="5" fill="#fff" stroke="#c7cbd0"/><text x="1066.08" y="303.05" font-size="15" fill="#30343b">4</text><rect x="884.32" y="329.05" width="49.919999999999995" height="40" rx="5" fill="#fff" stroke="#c7cbd0"/><text x="892.32" y="352.05" font-size="15" fill="#30343b">5</text><rect x="942.24" y="329.05" width="49.919999999999995" height="40" rx="5" fill="#fff" stroke="#c7cbd0"/><text x="950.24" y="352.05" font-size="15" fill="#30343b">6</text><rect x="1000.1600000000001" y="329.05" width="49.919999999999995" height="40" rx="5" fill="#fff" stroke="#c7cbd0"/><text x="1008.1600000000001" y="352.05" font-size="15" fill="#30343b">7</text><rect x="1058.08" y="329.05" width="49.919999999999995" height="40" rx="5" fill="#fff" stroke="#c7cbd0"/><text x="1066.08" y="352.05" font-size="15" fill="#30343b">8</text><rect x="884.32" y="378.05" width="49.919999999999995" height="40" rx="5" fill="#fff" stroke="#c7cbd0"/><text x="892.32" y="401.05" font-size="15" fill="#30343b">9</text><rect x="942.24" y="378.05" width="49.919999999999995" height="40" rx="5" fill="#fff" stroke="#c7cbd0"/><text x="950.24" y="401.05" font-size="15" fill="#30343b">10</text><rect x="1000.1600000000001" y="378.05" width="49.919999999999995" height="40" rx="5" fill="#fff" stroke="#c7cbd0"/><text x="1008.1600000000001" y="401.05" font-size="15" fill="#30343b">11</text><rect x="1058.08" y="378.05" width="49.919999999999995" height="40" rx="5" fill="#fff" stroke="#c7cbd0"/><text x="1066.08" y="401.05" font-size="15" fill="#30343b">12</text><rect x="884.32" y="427.05" width="49.919999999999995" height="40" rx="5" fill="#fff" stroke="#c7cbd0"/><text x="892.32" y="450.05" font-size="15" fill="#30343b">13</text><rect x="942.24" y="427.05" width="49.919999999999995" height="40" rx="5" fill="#fff" stroke="#c7cbd0"/><text x="950.24" y="450.05" font-size="15" fill="#30343b">14</text><rect x="1000.1600000000001" y="427.05" width="49.919999999999995" height="40" rx="5" fill="#fff" stroke="#c7cbd0"/><text x="1008.1600000000001" y="450.05" font-size="15" fill="#30343b">15</text><rect x="1058.08" y="427.05" width="49.919999999999995" height="40" rx="5" fill="#fff" stroke="#c7cbd0"/><text x="1066.08" y="450.05" font-size="15" fill="#30343b">16</text><rect x="642" y="583.25" width="180" height="49.200000000000045" rx="12" fill="#e0ece7" stroke="#839188"/><text x="660" y="612.25" font-size="16" fill="#244a43" font-weight="700">Open Mark 3</text><text x="642" y="664.45" font-size="14" fill="#53615c">Cancel</text><path d="M644 698.75v12 q0 8 8 8 h16 q8 0 8 8 v8" fill="none" stroke="#42565a" stroke-width="1.5"/><circle cx="644" cy="698.75" r="2.5" fill="#42565a"/><text x="620" y="759.75" font-size="17" fill="#30343b">On a larger surface, retain both levels instead of</text><text x="620" y="784.4" font-size="17" fill="#30343b">replacing the book list.</text><text x="620" y="824.05" font-size="16" fill="#30343b">Use when: There is room to keep both levels visible</text><text x="620" y="859.25" font-size="16" fill="#30343b">Consider: On narrow screens, stack or use steps instead of</text><text x="620" y="882.45" font-size="16" fill="#30343b">shrinking targets.</text><text x="40" y="968.6500000000001" font-size="23" fill="#30343b" font-weight="700">C · Type or return</text><rect x="40" y="997.0000000000001" width="510" height="463.95000000000016" rx="8" fill="#fcfbf7" stroke="#c2c8c2"/><text x="62" y="1035.0" font-size="18" fill="#30343b" font-weight="700">Go to a passage</text><rect x="62" y="1067.1000000000001" width="466" height="51.200000000000045" rx="8" fill="#fff" stroke="#a4ada6"/><text x="76" y="1097.1000000000001" font-size="16" fill="#30343b">Mark 3:1–6</text><rect x="62" y="1134.3000000000002" width="466" height="80.39999999999986" rx="8" fill="#fff" stroke="#a4ada6"/><text x="76" y="1166.3000000000002" font-size="18" fill="#30343b" font-weight="700">Mark 3:1–6</text><text x="76" y="1194.4" font-size="14" fill="#30343b">BSB · Reference found</text><rect x="62" y="1230.7" width="180" height="49.200000000000045" rx="12" fill="#e0ece7" stroke="#839188"/><text x="80" y="1259.7" font-size="16" fill="#244a43" font-weight="700">Open passage</text><text x="62" y="1314.9" font-size="17" fill="#30343b" font-weight="700">Recent</text><text x="72" y="1362.5500000000002" font-size="16" fill="#30343b">Luke 15:1–3</text><path d="M62 1386.7500000000002h466" stroke="#d7d9dd"/><text x="72" y="1410.7500000000002" font-size="16" fill="#30343b">Psalm 23</text><path d="M62 1434.9500000000003h466" stroke="#d7d9dd"/><path d="M64 1460.9500000000003v12 q0 8 8 8 h16 q8 0 8 8 v8" fill="none" stroke="#42565a" stroke-width="1.5"/><circle cx="64" cy="1460.9500000000003" r="2.5" fill="#42565a"/><text x="40" y="1521.9500000000003" font-size="17" fill="#30343b">Resolve the typed reference before opening it; keep</text><text x="40" y="1546.6000000000004" font-size="17" fill="#30343b">recent passages separate from results.</text><text x="40" y="1586.2500000000005" font-size="16" fill="#30343b">Use when: The reader knows the reference or wants a recent</text><text x="40" y="1609.4500000000005" font-size="16" fill="#30343b">passage</text><text x="40" y="1644.6500000000005" font-size="16" fill="#30343b">Consider: Localised aliases, ranges and ambiguous</text><text x="40" y="1667.8500000000006" font-size="16" fill="#30343b">abbreviations need resolution.</text><text x="620" y="968.6500000000001" font-size="23" fill="#30343b" font-weight="700">D · Chapter list</text><rect x="620" y="997.0000000000001" width="510" height="476.9000000000002" rx="8" fill="#fcfbf7" stroke="#c2c8c2"/><text x="642" y="1035.0" font-size="18" fill="#30343b" font-weight="700">Mark · Chapter list</text><text x="642" y="1081.1000000000001" font-size="14" fill="#53615c">Back to books  ·  Grid view</text><text x="652" y="1127.4" font-size="16" fill="#30343b">Chapter 1</text><path d="M642 1151.6000000000001h466" stroke="#d7d9dd"/><text x="652" y="1175.6000000000001" font-size="16" fill="#30343b">Chapter 2</text><path d="M642 1199.8000000000002h466" stroke="#d7d9dd"/><rect x="642" y="1199.8000000000002" width="466" height="39.200000000000045" fill="#f5e2ae"/><text x="652" y="1223.8000000000002" font-size="16" fill="#30343b" font-weight="700">Chapter 3 · Selected</text><path d="M642 1248.0000000000002h466" stroke="#d7d9dd"/><text x="652" y="1272.0000000000002" font-size="16" fill="#30343b">Chapter 4</text><path d="M642 1296.2000000000003h466" stroke="#d7d9dd"/><text x="652" y="1320.2000000000003" font-size="16" fill="#30343b">Chapter 5</text><path d="M642 1344.4000000000003h466" stroke="#d7d9dd"/><rect x="642" y="1358.4000000000003" width="180" height="49.200000000000045" rx="12" fill="#e0ece7" stroke="#839188"/><text x="660" y="1387.4000000000003" font-size="16" fill="#244a43" font-weight="700">Open Mark 3</text><text x="642" y="1439.6000000000004" font-size="14" fill="#53615c">Choose a verse</text><path d="M644 1473.9000000000003v12 q0 8 8 8 h16 q8 0 8 8 v8" fill="none" stroke="#42565a" stroke-width="1.5"/><circle cx="644" cy="1473.9000000000003" r="2.5" fill="#42565a"/><text x="620" y="1534.9000000000003" font-size="17" fill="#30343b">A list and a grid can serve the same chapter step. This</text><text x="620" y="1559.5500000000004" font-size="17" fill="#30343b">illustration shows an excerpt of the list.</text><text x="620" y="1599.2000000000005" font-size="16" fill="#30343b">Use when: Larger labels, generous targets or chapter</text><text x="620" y="1622.4000000000005" font-size="16" fill="#30343b">descriptions are more useful than density</text><text x="620" y="1657.6000000000006" font-size="16" fill="#30343b">Consider: Long books need more scrolling; offer a direct</text><text x="620" y="1680.8000000000006" font-size="16" fill="#30343b">chapter jump and preserve position.</text><text x="40" y="1759.0000000000007" font-size="15" fill="#30343b">Original illustrative interfaces · Static controls · Any Scripture samples identify their edition. Sample catalogue and resource details are</text><text x="40" y="1780.7500000000007" font-size="15" fill="#30343b">illustrative.</text><text x="40" y="1836.5000000000007" font-size="14" fill="#30343b">patterns.missional.design/patterns/finding-a-passage/</text></g></svg>