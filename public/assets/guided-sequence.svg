<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1836" role="img" aria-labelledby="title desc"><title id="title">Choose a devotional format</title><desc id="desc">3 annotated interface examples with use cases and tradeoffs. Scripture samples are identified by edition.</desc><rect width="1200" height="1836" fill="#f6f5f2"/><g font-family="Arial, sans-serif"><text x="40" y="65" font-size="30" fill="#17202a" font-weight="700">Choose a devotional format</text><text x="40" y="116.5" font-size="18" fill="#17202a">A page, a sequence and audio can carry related material. They need not all be offered, or be identical adaptations.</text><text x="40" y="181.6" font-size="23" fill="#17202a" font-weight="700">A · Continuous page</text><rect x="40" y="209.95" width="510" height="363.3999999999999" rx="6" fill="white" stroke="#8a959f"/><text x="62" y="247.95" font-size="18" fill="#17202a" font-weight="700">A moment of gratitude</text><text x="62" y="297.05" font-size="17" fill="#17202a" font-weight="700">Illustrative devotional · Original reflection</text><rect x="62" y="320.7" width="466" height="82.40000000000003" rx="6" fill="#f5f4f0" stroke="#b8c0c8"/><text x="76" y="347.7" font-size="13" fill="#17202a" font-weight="700">Psalm 23:1 · BSB</text><text x="76" y="380.55" font-size="19" fill="#17202a">The LORD is my shepherd; I shall not want.</text><text x="62" y="436.1" font-size="17" fill="#17202a" font-weight="700">Reflection</text><text x="62" y="476.75" font-size="17" fill="#17202a">Who has offered you care this week? You might hold</text><text x="62" y="501.4" font-size="17" fill="#17202a">that person in prayer.</text><text x="62" y="539.05" font-size="14" fill="#43516a">Optional audio  ·  Finish for now</text><path d="M64 573.3499999999999v12 q0 8 8 8 h16 q8 0 8 8 v8" fill="none" stroke="#000462" stroke-width="1.5"/><circle cx="64" cy="573.3499999999999" r="2.5" fill="#000462"/><text x="40" y="634.3499999999999" font-size="17" fill="#17202a">One readable page supports scanning and revisiting. Keep</text><text x="40" y="658.9999999999999" font-size="17" fill="#17202a">Scripture and the author’s reflection distinct.</text><text x="40" y="698.6499999999999" font-size="16" fill="#17202a">Use when: The reader wants to scan, linger or compare</text><text x="40" y="721.8499999999999" font-size="16" fill="#17202a">sections</text><text x="40" y="757.05" font-size="16" fill="#17202a">Consider: Long sessions need landmarks and a saved position;</text><text x="40" y="780.25" font-size="16" fill="#17202a">a complete text alternative may require editorial work.</text><text x="620" y="181.6" font-size="23" fill="#17202a" font-weight="700">B · Cards or pages</text><rect x="620" y="209.95" width="510" height="307.55" rx="6" fill="white" stroke="#8a959f"/><text x="642" y="247.95" font-size="18" fill="#17202a" font-weight="700">A moment of gratitude</text><text x="642" y="297.05" font-size="17" fill="#17202a" font-weight="700">2 of 4 · Reflection</text><text x="642" y="337.7" font-size="17" fill="#17202a">Who has offered you care this week?</text><text x="642" y="378.34999999999997" font-size="17" fill="#17202a">Take a moment. No written answer is needed.</text><rect x="642" y="401.99999999999994" width="466" height="51.19999999999999" rx="6" fill="#000462" stroke="#b8c0c8"/><text x="656" y="431.99999999999994" font-size="16" fill="#fff" font-weight="700">Continue</text><text x="642" y="483.19999999999993" font-size="14" fill="#43516a">Previous  ·  Outline  ·  Finish for now</text><path d="M644 517.5v12 q0 8 8 8 h16 q8 0 8 8 v8" fill="none" stroke="#000462" stroke-width="1.5"/><circle cx="644" cy="517.5" r="2.5" fill="#000462"/><text x="620" y="578.5" font-size="17" fill="#17202a">A bounded sequence can guide attention without automatic</text><text x="620" y="603.15" font-size="17" fill="#17202a">advance. Make the outline and exit available.</text><text x="620" y="642.8" font-size="16" fill="#17202a">Use when: The session has distinct short stages or media</text><text x="620" y="678.0" font-size="16" fill="#17202a">Consider: Story familiarity does not justify automatic</text><text x="620" y="701.2" font-size="16" fill="#17202a">advance or swipe-only navigation. Multi-page reading must</text><text x="620" y="724.4000000000001" font-size="16" fill="#17202a">allow reflow.</text><text x="40" y="866.45" font-size="23" fill="#17202a" font-weight="700">C · Chaptered audio</text><rect x="40" y="894.8000000000001" width="510" height="518.5500000000001" rx="6" fill="white" stroke="#8a959f"/><text x="62" y="932.8000000000001" font-size="18" fill="#17202a" font-weight="700">Listen · A moment of gratitude</text><text x="62" y="981.9000000000001" font-size="17" fill="#17202a" font-weight="700">Illustrative recording · Reflection</text><rect x="62" y="1019.5500000000001" width="466" height="3" rx="0" fill="#d4d9e0" stroke="#d4d9e0"/><rect x="62" y="1019.5500000000001" width="126.20833333333333" height="3" rx="0" fill="#000462" stroke="#000462"/><text x="62" y="1045.5500000000002" font-size="14" fill="#17202a">02:10                          08:00</text><text x="62" y="1089.8500000000001" font-size="18" fill="#17202a" font-weight="700">−10 s             Pause             +10 s</text><text x="72" y="1145.95" font-size="16" fill="#17202a">Scripture</text><path d="M62 1170.15h466" stroke="#d7d9dd"/><rect x="62" y="1170.15" width="466" height="39.200000000000045" fill="#edf0fa"/><text x="72" y="1194.15" font-size="16" fill="#17202a" font-weight="700">Reflection · Selected</text><path d="M62 1218.3500000000001h466" stroke="#d7d9dd"/><text x="72" y="1242.3500000000001" font-size="16" fill="#17202a">Prayer</text><path d="M62 1266.5500000000002h466" stroke="#d7d9dd"/><text x="72" y="1290.5500000000002" font-size="16" fill="#17202a">Silence</text><path d="M62 1314.7500000000002h466" stroke="#d7d9dd"/><text x="62" y="1342.7500000000002" font-size="14" fill="#43516a">Read transcript</text><text x="62" y="1379.0500000000002" font-size="14" fill="#43516a">Stops after this session</text><path d="M64 1413.3500000000001v12 q0 8 8 8 h16 q8 0 8 8 v8" fill="none" stroke="#000462" stroke-width="1.5"/><circle cx="64" cy="1413.3500000000001" r="2.5" fill="#000462"/><text x="40" y="1474.3500000000001" font-size="17" fill="#17202a">Audio chapters help someone return to one part of a</text><text x="40" y="1499.0000000000002" font-size="17" fill="#17202a">practice. Provide a transcript and an intentional</text><text x="40" y="1523.6500000000003" font-size="17" fill="#17202a">endpoint.</text><text x="40" y="1563.3000000000004" font-size="16" fill="#17202a">Use when: The person wants to listen with less screen</text><text x="40" y="1586.5000000000005" font-size="16" fill="#17202a">attention</text><text x="40" y="1621.7000000000005" font-size="16" fill="#17202a">Consider: Audio and text may differ; identify adaptations</text><text x="40" y="1644.9000000000005" font-size="16" fill="#17202a">and do not claim exact alignment without timing data.</text><text x="40" y="1723.1000000000006" font-size="15" fill="#17202a">Original illustrative interfaces · Static controls · Any Scripture samples identify their edition. Sample catalogue and resource details are</text><text x="40" y="1744.8500000000006" font-size="15" fill="#17202a">illustrative.</text><text x="40" y="1800.6000000000006" font-size="14" fill="#17202a">patterns.missional.design/patterns/guided-sequence/</text></g></svg>