<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1030 2050" role="img" aria-labelledby="title desc"><title id="title">Prayer interfaces with annotations</title><desc id="desc">A prayer text, guided reflection and untimed quiet prayer, with external notes linked by rounded right-angle connectors.</desc><rect width="1030" height="2050" fill="#f5f3ef"/><g font-family="Arial, sans-serif" fill="#121923"><text x="40" y="48" font-size="30" font-weight="700">Make room for prayer</text><text x="40" y="90" font-size="18">Three prayer practices · Original illustrative interfaces</text><text x="40" y="145" font-size="25" font-weight="700">Pray with a text</text><rect x="40" y="170" width="340" height="485" rx="6" fill="white" stroke="#81909b"/><text x="63" y="210" font-size="18" font-weight="700">A prayer text</text><text x="63" y="245" font-size="13">Illustrative prayer · Written for</text><text x="63" y="264.5" font-size="13">this example</text><text x="63" y="320" font-size="23" font-weight="700">At the close of the day</text><text x="63" y="357" font-size="17">God of mercy,</text><text x="63" y="382.5" font-size="17">receive the joys and burdens of</text><text x="63" y="408.0" font-size="17">this day.</text><text x="63" y="433.5" font-size="17">Help us rest in your care</text><text x="63" y="459.0" font-size="17">and meet tomorrow with love.</text><text x="63" y="484.5" font-size="17">Amen.</text><rect x="63" y="559" width="294" height="42" rx="5" fill="#000462"/><text x="210" y="586" text-anchor="middle" font-size="16" fill="white">Listen</text><text x="80" y="633" font-size="14">Text size</text><path d="M376 243 H402 Q410 243 410 251 V263 Q410 271 418 271 H455" fill="none" stroke="#000462" stroke-width="1.5"/><circle cx="376" cy="243" r="3" fill="#000462"/><text x="467" y="277" font-size="17" font-weight="700">1</text><text x="497" y="277" font-size="19" font-weight="700">Keep the source visible</text><text x="497" y="313.5" font-size="17">Name the author, tradition and any adaptation.</text><text x="497" y="339.0" font-size="17">This example uses original illustrative wording.</text><path d="M376 385 H402 Q410 385 410 393 V405 Q410 413 418 413 H455" fill="none" stroke="#000462" stroke-width="1.5"/><circle cx="376" cy="385" r="3" fill="#000462"/><text x="467" y="419" font-size="17" font-weight="700">2</text><text x="497" y="419" font-size="19" font-weight="700">Let the words remain readable</text><text x="497" y="455.5" font-size="17">Use paragraphs and generous spacing. A full order</text><text x="497" y="481.0" font-size="17">of service also needs distinct instructions and</text><text x="497" y="506.5" font-size="17">responses.</text><path d="M376 580 H402 Q410 580 410 588 V600 Q410 608 418 608 H455" fill="none" stroke="#000462" stroke-width="1.5"/><circle cx="376" cy="580" r="3" fill="#000462"/><text x="467" y="614" font-size="17" font-weight="700">3</text><text x="497" y="614" font-size="19" font-weight="700">Offer another way to participate</text><text x="497" y="650.5" font-size="17">Audio can be optional. Reading the text requires</text><text x="497" y="676.0" font-size="17">no completion action.</text><text x="40" y="694" font-size="14">Illustration only · No live controls</text><text x="40" y="755" font-size="25" font-weight="700">Follow a gentle prompt</text><rect x="40" y="780" width="340" height="485" rx="6" fill="white" stroke="#81909b"/><text x="63" y="820" font-size="18" font-weight="700">Guided prayer</text><text x="63" y="855" font-size="13">Reflection 2 of 4 · View outline</text><text x="63" y="930" font-size="23" font-weight="700">Give thanks</text><text x="63" y="967" font-size="17">Bring to mind someone</text><text x="63" y="992.5" font-size="17">whose kindness stayed with you.</text><text x="63" y="1018.0" font-size="17"></text><text x="63" y="1043.5" font-size="17">You might hold them in prayer</text><text x="63" y="1069.0" font-size="17">for a moment.</text><rect x="63" y="1169" width="294" height="42" rx="5" fill="#000462"/><text x="210" y="1196" text-anchor="middle" font-size="16" fill="white">Continue</text><text x="80" y="1243" font-size="14">Previous · Finish for now</text><path d="M376 853 H402 Q410 853 410 861 V873 Q410 881 418 881 H455" fill="none" stroke="#000462" stroke-width="1.5"/><circle cx="376" cy="853" r="3" fill="#000462"/><text x="467" y="887" font-size="17" font-weight="700">1</text><text x="497" y="887" font-size="19" font-weight="700">Make the scope understandable</text><text x="497" y="923.5" font-size="17">Show where this moment sits in the sequence. An</text><text x="497" y="949.0" font-size="17">outline lets people revisit a section.</text><path d="M376 995 H402 Q410 995 410 1003 V1015 Q410 1023 418 1023 H455" fill="none" stroke="#000462" stroke-width="1.5"/><circle cx="376" cy="995" r="3" fill="#000462"/><text x="467" y="1029" font-size="17" font-weight="700">2</text><text x="497" y="1029" font-size="19" font-weight="700">Invite reflection without collecting it</text><text x="497" y="1065.5" font-size="17">A prompt does not need an answer field. Pausing</text><text x="497" y="1091.0" font-size="17">here should not require a tap.</text><path d="M376 1190 H402 Q410 1190 410 1198 V1210 Q410 1218 418 1218 H455" fill="none" stroke="#000462" stroke-width="1.5"/><circle cx="376" cy="1190" r="3" fill="#000462"/><text x="467" y="1224" font-size="17" font-weight="700">3</text><text x="497" y="1224" font-size="19" font-weight="700">Keep moving optional</text><text x="497" y="1260.5" font-size="17">Give the next step priority, with a quieter way</text><text x="497" y="1286.0" font-size="17">back or out. Do not advance automatically.</text><text x="40" y="1304" font-size="14">Illustration only · No live controls</text><text x="40" y="1365" font-size="25" font-weight="700">Make room for silence</text><rect x="40" y="1390" width="340" height="485" rx="6" fill="white" stroke="#81909b"/><text x="63" y="1430" font-size="18" font-weight="700">Quiet prayer</text><text x="63" y="1465" font-size="13">Untimed session</text><text x="63" y="1540" font-size="23" font-weight="700">Take your time.</text><text x="63" y="1577" font-size="17">You can finish whenever</text><text x="63" y="1602.5" font-size="17">you are ready.</text><rect x="63" y="1779" width="294" height="42" rx="5" fill="#000462"/><text x="210" y="1806" text-anchor="middle" font-size="16" fill="white">Finish for now</text><text x="80" y="1853" font-size="14"></text><path d="M376 1463 H402 Q410 1463 410 1471 V1483 Q410 1491 418 1491 H455" fill="none" stroke="#000462" stroke-width="1.5"/><circle cx="376" cy="1463" r="3" fill="#000462"/><text x="467" y="1497" font-size="17" font-weight="700">1</text><text x="497" y="1497" font-size="19" font-weight="700">Make the conditions clear</text><text x="497" y="1533.5" font-size="17">This is an untimed session. Offer an optional</text><text x="497" y="1559.0" font-size="17">duration before it begins.</text><path d="M376 1605 H402 Q410 1605 410 1613 V1625 Q410 1633 418 1633 H455" fill="none" stroke="#000462" stroke-width="1.5"/><circle cx="376" cy="1605" r="3" fill="#000462"/><text x="467" y="1639" font-size="17" font-weight="700">2</text><text x="497" y="1639" font-size="19" font-weight="700">Let the interface recede</text><text x="497" y="1675.5" font-size="17">No input is required. The person can put the</text><text x="497" y="1701.0" font-size="17">phone down.</text><path d="M376 1800 H402 Q410 1800 410 1808 V1820 Q410 1828 418 1828 H455" fill="none" stroke="#000462" stroke-width="1.5"/><circle cx="376" cy="1800" r="3" fill="#000462"/><text x="467" y="1834" font-size="17" font-weight="700">3</text><text x="497" y="1834" font-size="19" font-weight="700">Provide an ending</text><text x="497" y="1870.5" font-size="17">Finish without a score, a required journal entry</text><text x="497" y="1896.0" font-size="17">or an automatically starting session.</text><text x="40" y="1914" font-size="14">Illustration only · No live controls</text><text x="40" y="2015" font-size="16">Original illustrative prayer wording; not a quotation from a liturgy.</text></g></svg>