20" fill="#526b72">Each pane can show a different reference</text><text x="575" y="869.35" font-size="20" fill="#526b72">without snapping back.</text><text x="1095" y="842.35" font-size="20" fill="#526b72">A gap interrupts synchronisation honestly.</text><text x="55" y="932.35" font-size="16" fill="#526b72">SCHEMATIC TEXT ROWS, NOT LOADING STATES · ORIGINAL PROPOSALS · NOT PRODUCT SCREENSHOTS</text></g></svg>