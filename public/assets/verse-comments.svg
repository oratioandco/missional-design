<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1610 994" role="img" aria-labelledby="title desc" data-illustration-theme="light"><title id="title">Keep my note distinct from a shared comment</title><desc id="desc">3 English interface examples. Origin, audience and anchor belong to the note—not just its screen.</desc><rect width="1610" height="994" fill="#f6f9fa" /><g font-family="Arial, sans-serif"><text x="55" y="46" font-size="18" fill="#486078" font-weight="700">BIBLE AND FAITH APP DESIGN PATTERNS</text><text x="55" y="110" font-size="40" fill="#102c47" font-weight="700">Keep my note distinct from a shared comment</text><text x="55" y="159.0" font-size="23" fill="#486078">Origin, audience and anchor belong to the note—not just its screen.</text><rect x="55" y="267.05" width="475" height="546.3" rx="20" fill="#ffffff" stroke="#708892" stroke-width="2" /><text x="55" y="225.05" font-size="23" fill="#102c47" font-weight="700">A · Private note</text><text x="75" y="302.05" font-size="15" fill="#486078">BIBLE STUDY · EXAMPLE</text><rect x="75" y="337.05" width="435" height="190" rx="10" fill="#ffffff" stroke="#9aafbf" /><text x="87" y="360.05" font-size="14" fill="#102c47" font-weight="700">Mark 1:8 · Selected verse</text><text x="85" y="391.95" font-size="12" fill="#486078">8</text><rect x="107" y="384.95" width="362.70000000000005" height="4" fill="#c3c8ce" /><rect x="107" y="394.95" width="280.8" height="4" fill="#c3c8ce" /><text x="85" y="429.95" font-size="12" fill="#486078">9</text><rect x="107" y="422.95" width="362.70000000000005" height="4" fill="#c3c8ce" /><rect x="107" y="432.95" width="280.8" height="4" fill="#c3c8ce" /><text x="85" y="467.95" font-size="12" fill="#486078">10</text><rect x="107" y="460.95" width="362.70000000000005" height="4" fill="#c3c8ce" /><rect x="107" y="470.95" width="280.8" height="4" fill="#c3c8ce" /><text x="75" y="560.05" font-size="17" fill="#486078">My note · Private</text><rect x="75" y="583.0" width="435" height="55.35000000000002" rx="8" fill="#ffffff" stroke="#9aafbf" /><text x="90" y="616.0" font-size="21" fill="#102c47">Write a reflection…</text><rect x="75" y="654.35" width="435" height="55.35000000000002" rx="8" fill="#edf5f7" stroke="#9aafbf" /><text x="90" y="687.35" font-size="21" fill="#102c47" font-weight="700">Saved on this device · Sync pending</text><rect x="575" y="267.05" width="475" height="546.3" rx="20" fill="#ffffff" stroke="#708892" stroke-width="2" /><text x="575" y="225.05" font-size="23" fill="#102c47" font-weight="700">B · Share deliberately</text><text x="595" y="302.05" font-size="15" fill="#486078">BIBLE STUDY · EXAMPLE</text><rect x="595" y="337.05" width="435" height="145" rx="10" fill="#ffffff" stroke="#9aafbf" /><text x="607" y="360.05" font-size="14" fill="#102c47" font-weight="700">Passage context · Schematic text</text><text x="605" y="391.95" font-size="12" fill="#486078">8</text><rect x="627" y="384.95" width="362.70000000000005" height="4" fill="#c3c8ce" /><rect x="627" y="394.95" width="280.8" height="4" fill="#c3c8ce" /><text x="605" y="419.95" font-size="12" fill="#486078">9</text><rect x="627" y="412.95" width="362.70000000000005" height="4" fill="#c3c8ce" /><rect x="627" y="422.95" width="280.8" height="4" fill="#c3c8ce" /><text x="605" y="447.95" font-size="12" fill="#486078">10</text><rect x="627" y="440.95" width="362.70000000000005" height="4" fill="#c3c8ce" /><rect x="627" y="450.95" width="280.8" height="4" fill="#c3c8ce" /><rect x="595" y="498.05" width="435" height="86.64999999999992" rx="8" fill="#ffffff" stroke="#9aafbf" /><text x="610" y="531.05" font-size="21" fill="#102c47" font-weight="700">Share this note?</text><text x="610" y="563.4" font-size="18" fill="#486078">Preview of selected text only</text><text x="595" y="617.6999999999999" font-size="17" fill="#486078">Audience: My reading group</text><rect x="595" y="640.65" width="435" height="55.35000000000002" rx="8" fill="#edf5f7" stroke="#9aafbf" /><text x="610" y="673.65" font-size="21" fill="#102c47" font-weight="700">Publish to group</text><rect x="595" y="712.0" width="435" height="55.35000000000002" rx="8" fill="#edf5f7" stroke="#9aafbf" /><text x="610" y="745.0" font-size="21" fill="#102c47" font-weight="700">Keep private</text><rect x="1095" y="267.05" width="475" height="546.3" rx="20" fill="#ffffff" stroke="#708892" stroke-width="2" /><text x="1095" y="225.05" font-size="23" fill="#102c47" font-weight="700">C · Separate sources</text><text x="1115" y="302.05" font-size="15" fill="#486078">BIBLE STUDY · EXAMPLE</text><text x="1115" y="356.05" font-size="19" fill="#102c47" font-weight="700">Mark 1:8</text><rect x="1115" y="374.7" width="435" height="49" rx="10" fill="#f5f3ef" stroke="#9aafbf" /><text x="1125" y="400.7" font-size="17" fill="#102c47">My note · Private</text><rect x="1115" y="430.7" width="435" height="49" rx="10" fill="#f5f3ef" stroke="#9aafbf" /><text x="1125" y="456.7" font-size="17" fill="#102c47">Group discussion · 2 replies</text><rect x="1115" y="486.7" width="435" height="49" rx="10" fill="#f5f3ef" stroke="#9aafbf" /><text x="1125" y="512.7" font-size="17" fill="#102c47">Publisher commentary · Author</text><rect x="1115" y="554.7" width="435" height="55.35000000000002" rx="8" fill="#edf5f7" stroke="#9aafbf" /><text x="1130" y="587.7" font-size="21" fill="#102c47" font-weight="700">Open chosen layer</text><text x="55" y="855.35" font-size="20" fill="#486078">A personal reflection has a visible audience</text><text x="55" y="882.35" font-size="20" fill="#486078">and save state.</text><text x="575" y="855.35" font-size="20" fill="#486078">Preview the exact content and recipients</text><text x="575" y="882.35" font-size="20" fill="#486078">before publication.</text><text x="1095" y="855.35" font-size="20" fill="#486078">Different authorship remains apparent beside</text><text x="1095" y="882.35" font-size="20" fill="#486078">the same passage.</text><text x="55" y="945.35" font-size="16" fill="#486078">SCHEMATIC TEXT ROWS, NOT LOADING STATES · ORIGINAL PROPOSALS · NOT PRODUCT SCREENSHOTS</text></g></svg>