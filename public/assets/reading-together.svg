<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1610 1990" role="img" aria-label="Reading together" data-illustration-theme="light"><svg y="0" viewBox="0 0 1610 995" role="img" aria-labelledby="title-0 desc-0"><title id="title-0">Reading together</title><desc id="desc-0">3 English interface examples. From the same passage on the same day with nothing shown, through a guide for meeting in person, a group with a leader and a plan with friends, to a feed of friends’ activity and a public thread on the verse: decide what the others see of each person’s reading, and who looks after what is said.</desc><rect width="1610" height="995" fill="#f6f9fa" /><g font-family="Arial, sans-serif"><text x="55" y="46" font-size="18" fill="#486078" font-weight="700">BIBLE AND FAITH APP DESIGN PATTERNS</text><text x="55" y="110" font-size="40" fill="#102c47" font-weight="700">Reading together</text><text x="55" y="159.0" font-size="23" fill="#486078">From the same passage on the same day with nothing shown, through a guide for meeting in person, a group with a leader and</text><text x="55" y="190.05" font-size="23" fill="#486078">a plan with friends, to a feed of friends’ activity and a public thread on the verse: decide what the others see of each</text><text x="55" y="221.10000000000002" font-size="23" fill="#486078">person’s reading, and who looks after what is said.</text><rect x="55" y="329.15000000000003" width="475" height="485.0" rx="20" fill="#ffffff" stroke="#708892" stroke-width="2" /><text x="55" y="287.15000000000003" font-size="23" fill="#102c47" font-weight="700">A · The same passage, nothing shown</text><text x="75" y="364.15000000000003" font-size="15" fill="#486078">PRACTICE · EXAMPLE</text><text x="75" y="416.15000000000003" font-size="17" fill="#486078">Read by your church today</text><rect x="75" y="439.1" width="435" height="55.35000000000002" rx="8" fill="#edf5f7" stroke="#9aafbf" /><text x="90" y="472.1" font-size="21" fill="#102c47" font-weight="700">Read</text><rect x="575" y="329.15000000000003" width="475" height="485.0" rx="20" fill="#ffffff" stroke="#708892" stroke-width="2" /><text x="575" y="287.15000000000003" font-size="23" fill="#102c47" font-weight="700">B · A guide for meeting in person</text><text x="595" y="364.15000000000003" font-size="15" fill="#486078">PRACTICE · EXAMPLE</text><text x="595" y="416.15000000000003" font-size="17" fill="#486078">Step 5 of 7 · Share</text><text x="595" y="460.1" font-size="21" fill="#102c47">Speak about yourself. No discussion.</text><rect x="1095" y="329.15000000000003" width="475" height="485.0" rx="20" fill="#ffffff" stroke="#708892" stroke-width="2" /><text x="1095" y="287.15000000000003" font-size="23" fill="#102c47" font-weight="700">C · A group with a leader</text><text x="1115" y="364.15000000000003" font-size="15" fill="#486078">PRACTICE · EXAMPLE</text><text x="1115" y="416.15000000000003" font-size="17" fill="#486078">Joined with a code from Petra</text><rect x="1115" y="439.1" width="435" height="55.35000000000002" rx="8" fill="#edf5f7" stroke="#9aafbf" /><text x="1130" y="472.1" font-size="21" fill="#102c47" font-weight="700">Answer if you want</text><text x="55" y="856.1500000000001" font-size="20" fill="#486078">Everyone reads today’s passage; nobody sees</text><text x="55" y="883.1500000000001" font-size="20" fill="#486078">who read.</text><text x="575" y="856.1500000000001" font-size="20" fill="#486078">The app leads the steps; nothing said is</text><text x="575" y="883.1500000000001" font-size="20" fill="#486078">stored.</text><text x="1095" y="856.1500000000001" font-size="20" fill="#486078">Joined with a code; a leader looks after the</text><text x="1095" y="883.1500000000001" font-size="20" fill="#486078">answers.</text><text x="55" y="946.1500000000001" font-size="16" fill="#486078">SCHEMATIC TEXT ROWS, NOT LOADING STATES · ORIGINAL PROPOSALS · NOT PRODUCT SCREENSHOTS</text></g></svg><svg y="995" viewBox="0 0 1610 995" role="img" aria-labelledby="title-3 desc-3"><title id="title-3">Reading together</title><desc id="desc-3">3 English interface examples. From the same passage on the same day with nothing shown, through a guide for meeting in person, a group with a leader and a plan with friends, to a feed of friends’ activity and a public thread on the verse: decide what the others see of each person’s reading, and who looks after what is said.</desc><rect width="1610" height="995" fill="#f6f9fa" /><g font-family="Arial, sans-serif"><text x="55" y="46" font-size="18" fill="#486078" font-weight="700">BIBLE AND FAITH APP DESIGN PATTERNS</text><text x="55" y="110" font-size="40" fill="#102c47" font-weight="700">Reading together</text><text x="55" y="159.0" font-size="23" fill="#486078">From the same passage on the same day with nothing shown, through a guide for meeting in person, a group with a leader and</text><text x="55" y="190.05" font-size="23" fill="#486078">a plan with friends, to a feed of friends’ activity and a public thread on the verse: decide what the others see of each</text><text x="55" y="221.10000000000002" font-size="23" fill="#486078">person’s reading, and who looks after what is said.</text><rect x="55" y="329.15000000000003" width="475" height="485.0" rx="20" fill="#ffffff" stroke="#708892" stroke-width="2" /><text x="55" y="287.15000000000003" font-size="23" fill="#102c47" font-weight="700">D · A plan with friends</text><text x="75" y="364.15000000000003" font-size="15" fill="#486078">PRACTICE · EXAMPLE</text><text x="75" y="416.15000000000003" font-size="17" fill="#486078">Day 3 · 4 of 5 done</text><rect x="75" y="439.1" width="435" height="55.35000000000002" rx="8" fill="#edf5f7" stroke="#9aafbf" /><text x="90" y="472.1" font-size="21" fill="#102c47" font-weight="700">Talk it over</text><rect x="575" y="329.15000000000003" width="475" height="485.0" rx="20" fill="#ffffff" stroke="#708892" stroke-width="2" /><text x="575" y="287.15000000000003" font-size="23" fill="#102c47" font-weight="700">E · A feed of friends’ activity</text><text x="595" y="364.15000000000003" font-size="15" fill="#486078">PRACTICE · EXAMPLE</text><text x="595" y="425.15000000000003" font-size="26" fill="#102c47" font-weight="700">Community</text><text x="595" y="472.25000000000006" font-size="21" fill="#102c47">Anna completed Day 7</text><rect x="1095" y="329.15000000000003" width="475" height="485.0" rx="20" fill="#ffffff" stroke="#708892" stroke-width="2" /><text x="1095" y="287.15000000000003" font-size="23" fill="#102c47" font-weight="700">F · A public thread on the verse</text><text x="1115" y="364.15000000000003" font-size="15" fill="#486078">PRACTICE · EXAMPLE</text><text x="1115" y="416.15000000000003" font-size="17" fill="#486078">711 comments</text><rect x="1115" y="439.1" width="435" height="55.35000000000002" rx="8" fill="#edf5f7" stroke="#9aafbf" /><text x="1130" y="472.1" font-size="21" fill="#102c47" font-weight="700">Share your thoughts</text><text x="55" y="856.1500000000001" font-size="20" fill="#486078">The same days, ticks for each, and a</text><text x="55" y="883.1500000000001" font-size="20" fill="#486078">discussion per day.</text><text x="575" y="856.1500000000001" font-size="20" fill="#486078">Completed days, highlights and notes in a</text><text x="575" y="883.1500000000001" font-size="20" fill="#486078">stream.</text><text x="1095" y="856.1500000000001" font-size="20" fill="#486078">Strangers’ comments under the passage.</text><text x="55" y="946.1500000000001" font-size="16" fill="#486078">SCHEMATIC TEXT ROWS, NOT LOADING STATES · ORIGINAL PROPOSALS · NOT PRODUCT SCREENSHOTS</text></g></svg></svg>