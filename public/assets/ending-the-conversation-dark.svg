<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1610 2958" role="img" aria-label="Ending the conversation" data-illustration-theme="dark"><svg y="0" viewBox="0 0 1610 995" role="img" aria-labelledby="title-0 desc-0"><title id="title-0">Ending the conversation</title><desc id="desc-0">3 English interface examples. From an assistant that closes well, through a suggested break and a length the person chooses, to a chat that never ends, a reply that always offers one more thing, a hook at goodbye and guilt to keep someone talking: decide how a conversation with the assistant ends, and whose good the ending serves.</desc><rect width="1610" height="995" fill="#f6f9fa" /><g font-family="Arial, sans-serif"><text x="55" y="46" font-size="18" fill="#b9cddd" font-weight="700">BIBLE AND FAITH APP DESIGN PATTERNS</text><text x="55" y="110" font-size="40" fill="#e8f1f7" font-weight="700">Ending the conversation</text><text x="55" y="159.0" font-size="23" fill="#b9cddd">From an assistant that closes well, through a suggested break and a length the person chooses, to a chat that never ends,</text><text x="55" y="190.05" font-size="23" fill="#b9cddd">a reply that always offers one more thing, a hook at goodbye and guilt to keep someone talking: decide how a conversation</text><text x="55" y="221.10000000000002" font-size="23" fill="#b9cddd">with the assistant ends, and whose good the ending serves.</text><rect x="55" y="329.15000000000003" width="475" height="485.0" rx="20" fill="#162e40" stroke="#708892" stroke-width="2" /><text x="55" y="287.15000000000003" font-size="23" fill="#e8f1f7" font-weight="700">A · Closes well</text><text x="75" y="364.15000000000003" font-size="15" fill="#b9cddd">CONVERSATION · EXAMPLE</text><rect x="120" y="399.15000000000003" width="390" height="48" rx="10" fill="#203b50" stroke="#668399" /><text x="135" y="424.15000000000003" font-size="16" fill="#e8f1f7">Earlier message</text><text x="75" y="480.15000000000003" font-size="17" fill="#b9cddd">Goodnight</text><text x="75" y="524.1" font-size="21" fill="#e8f1f7">Psalm 4:8 · Sleep well</text><rect x="575" y="329.15000000000003" width="475" height="485.0" rx="20" fill="#162e40" stroke="#708892" stroke-width="2" /><text x="575" y="287.15000000000003" font-size="23" fill="#e8f1f7" font-weight="700">B · Suggests a break</text><text x="595" y="364.15000000000003" font-size="15" fill="#b9cddd">CONVERSATION · EXAMPLE</text><rect x="640" y="399.15000000000003" width="390" height="48" rx="10" fill="#203b50" stroke="#668399" /><text x="655" y="424.15000000000003" font-size="16" fill="#e8f1f7">Earlier message</text><text x="595" y="480.15000000000003" font-size="17" fill="#b9cddd">It’s past one</text><text x="595" y="524.1" font-size="21" fill="#e8f1f7">Time for a break?</text><rect x="1095" y="329.15000000000003" width="475" height="485.0" rx="20" fill="#162e40" stroke="#708892" stroke-width="2" /><text x="1095" y="287.15000000000003" font-size="23" fill="#e8f1f7" font-weight="700">C · A length they choose</text><text x="1115" y="364.15000000000003" font-size="15" fill="#b9cddd">CONVERSATION · EXAMPLE</text><rect x="1160" y="399.15000000000003" width="390" height="48" rx="10" fill="#203b50" stroke="#668399" /><text x="1175" y="424.15000000000003" font-size="16" fill="#e8f1f7">Earlier message</text><text x="1115" y="480.15000000000003" font-size="17" fill="#b9cddd">Evening limit</text><text x="1115" y="524.1" font-size="21" fill="#e8f1f7">Your evening time has ended</text><text x="55" y="856.1500000000001" font-size="20" fill="#b9cddd">Gathers what was said, offers one thing to</text><text x="55" y="883.1500000000001" font-size="20" fill="#b9cddd">carry, says goodbye.</text><text x="575" y="856.1500000000001" font-size="20" fill="#b9cddd">A reminder in long sessions and late at</text><text x="575" y="883.1500000000001" font-size="20" fill="#b9cddd">night.</text><text x="1095" y="856.1500000000001" font-size="20" fill="#b9cddd">The person sets how long; the chat ends</text><text x="1095" y="883.1500000000001" font-size="20" fill="#b9cddd">there.</text><text x="55" y="946.1500000000001" font-size="16" fill="#b9cddd">SCHEMATIC TEXT ROWS, NOT LOADING STATES · ORIGINAL PROPOSALS · NOT PRODUCT SCREENSHOTS</text></g></svg><svg y="995" viewBox="0 0 1610 968" role="img" aria-labelledby="title-3 desc-3"><title id="title-3">Ending the conversation</title><desc id="desc-3">3 English interface examples. From an assistant that closes well, through a suggested break and a length the person chooses, to a chat that never ends, a reply that always offers one more thing, a hook at goodbye and guilt to keep someone talking: decide how a conversation with the assistant ends, and whose good the ending serves.</desc><rect width="1610" height="968" fill="#f6f9fa" /><g font-family="Arial, sans-serif"><text x="55" y="46" font-size="18" fill="#b9cddd" font-weight="700">BIBLE AND FAITH APP DESIGN PATTERNS</text><text x="55" y="110" font-size="40" fill="#e8f1f7" font-weight="700">Ending the conversation</text><text x="55" y="159.0" font-size="23" fill="#b9cddd">From an assistant that closes well, through a suggested break and a length the person chooses, to a chat that never ends,</text><text x="55" y="190.05" font-size="23" fill="#b9cddd">a reply that always offers one more thing, a hook at goodbye and guilt to keep someone talking: decide how a conversation</text><text x="55" y="221.10000000000002" font-size="23" fill="#b9cddd">with the assistant ends, and whose good the ending serves.</text><rect x="55" y="329.15000000000003" width="475" height="485.0" rx="20" fill="#162e40" stroke="#708892" stroke-width="2" /><text x="55" y="287.15000000000003" font-size="23" fill="#e8f1f7" font-weight="700">D · Always open</text><text x="75" y="364.15000000000003" font-size="15" fill="#b9cddd">CONVERSATION · EXAMPLE</text><rect x="120" y="399.15000000000003" width="390" height="48" rx="10" fill="#203b50" stroke="#668399" /><text x="135" y="424.15000000000003" font-size="16" fill="#e8f1f7">Earlier message</text><text x="75" y="489.15000000000003" font-size="26" fill="#e8f1f7" font-weight="700">Always here</text><text x="75" y="536.25" font-size="21" fill="#e8f1f7">Day or night</text><rect x="575" y="329.15000000000003" width="475" height="485.0" rx="20" fill="#162e40" stroke="#708892" stroke-width="2" /><text x="575" y="287.15000000000003" font-size="23" fill="#e8f1f7" font-weight="700">E · One more question</text><text x="595" y="364.15000000000003" font-size="15" fill="#b9cddd">CONVERSATION · EXAMPLE</text><rect x="640" y="399.15000000000003" width="390" height="48" rx="10" fill="#203b50" stroke="#668399" /><text x="655" y="424.15000000000003" font-size="16" fill="#e8f1f7">Earlier message</text><text x="595" y="480.15000000000003" font-size="17" fill="#b9cddd">Assistant</text><text x="595" y="524.1" font-size="21" fill="#e8f1f7">Would you like me to…?</text><rect x="1095" y="329.15000000000003" width="475" height="485.0" rx="20" fill="#162e40" stroke="#708892" stroke-width="2" /><text x="1095" y="287.15000000000003" font-size="23" fill="#e8f1f7" font-weight="700">F · A hook at goodbye</text><text x="1115" y="364.15000000000003" font-size="15" fill="#b9cddd">CONVERSATION · EXAMPLE</text><rect x="1160" y="399.15000000000003" width="390" height="48" rx="10" fill="#203b50" stroke="#668399" /><text x="1175" y="424.15000000000003" font-size="16" fill="#e8f1f7">Earlier message</text><text x="1115" y="480.15000000000003" font-size="17" fill="#b9cddd">Before you go</text><text x="1115" y="524.1" font-size="21" fill="#e8f1f7">There’s one more thing…</text><text x="55" y="856.1500000000001" font-size="20" fill="#b9cddd">Answers until the person closes the app.</text><text x="575" y="856.1500000000001" font-size="20" fill="#b9cddd">Every reply ends with an offer to do more.</text><text x="1095" y="856.1500000000001" font-size="20" fill="#b9cddd">Curiosity to stop someone leaving.</text><text x="55" y="919.1500000000001" font-size="16" fill="#b