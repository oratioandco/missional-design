<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1610 906" role="img" aria-labelledby="title desc"><title id="title">Return without shame</title><desc id="desc">3 English interface examples. Make it easy to pick up a reading practice after time away.</desc><rect width="1610" height="906" fill="#f6f9fa"/><g font-family="Arial, sans-serif"><text x="55" y="46" font-size="18" fill="#526b72" font-weight="700">BIBLE AND FAITH APP DESIGN PATTERNS</text><text x="55" y="110" font-size="40" fill="#122c35" font-weight="700">Return without shame</text><text x="55" y="159.0" font-size="23" fill="#526b72">Make it easy to pick up a reading practice after time away.</text><rect x="55" y="267.05" width="475" height="485.0" rx="20" fill="#fff" stroke="#708892" stroke-width="2"/><text x="55" y="225.05" font-size="23" fill="#122c35" font-weight="700">A · Fresh entry</text><text x="75" y="302.05" font-size="15" fill="#526b72">PRACTICE · EXAMPLE</text><text x="75" y="363.05" font-size="26" fill="#122c35" font-weight="700">What fits today?</text><rect x="75" y="389.15000000000003" width="435" height="55.35000000000002" rx="8" fill="#edf5f7" stroke="#bdd0d6"/><text x="90" y="422.15000000000003" font-size="21" fill="#122c35" font-weight="700">A short passage</text><rect x="75" y="460.50000000000006" width="435" height="55.35000000000008" rx="8" fill="#edf5f7" stroke="#bdd0d6"/><text x="90" y="493.50000000000006" font-size="21" fill="#122c35" font-weight="700">Listen for a few minutes</text><rect x="75" y="531.8500000000001" width="435" height="55.35000000000002" rx="8" fill="#edf5f7" stroke="#bdd0d6"/><text x="90" y="564.8500000000001" font-size="21" fill="#122c35" font-weight="700">Continue my plan</text><rect x="575" y="267.05" width="475" height="485.0" rx="20" fill="#fff" stroke="#708892" stroke-width="2"/><text x="575" y="225.05" font-size="23" fill="#122c35" font-weight="700">B · Resume</text><text x="595" y="302.05" font-size="15" fill="#526b72">PRACTICE · EXAMPLE</text><rect x="595" y="337.05" width="435" height="86.65000000000003" rx="8" fill="#fff" stroke="#bdd0d6"/><text x="610" y="370.05" font-size="21" fill="#122c35" font-weight="700">Your saved place</text><text x="610" y="402.40000000000003" font-size="18" fill="#526b72">Passage and session.</text><rect x="595" y="439.70000000000005" width="435" height="55.35000000000002" rx="8" fill="#edf5f7" stroke="#bdd0d6"/><text x="610" y="472.70000000000005" font-size="21" fill="#122c35" font-weight="700">Continue from here</text><rect x="595" y="511.05000000000007" width="435" height="55.35000000000002" rx="8" fill="#edf5f7" stroke="#bdd0d6"/><text x="610" y="544.0500000000001" font-size="21" fill="#122c35" font-weight="700">Choose a different starting point</text><rect x="1095" y="267.05" width="475" height="485.0" rx="20" fill="#fff" stroke="#708892" stroke-width="2"/><text x="1095" y="225.05" font-size="23" fill="#122c35" font-weight="700">C · Reduce pressure</text><text x="1115" y="302.05" font-size="15" fill="#526b72">PRACTICE · EXAMPLE</text><rect x="1115" y="337.05" width="435" height="55.35000000000002" rx="8" fill="#edf5f7" stroke="#bdd0d6"/><text x="1130" y="370.05" font-size="21" fill="#122c35" font-weight="700">Keep reminders paused</text><rect x="1115" y="408.40000000000003" width="435" height="55.35000000000002" rx="8" fill="#edf5f7" stroke="#bdd0d6"/><text x="1130" y="441.40000000000003" font-size="21" fill="#122c35" font-weight="700">Choose new reminder times</text><rect x="1115" y="479.75000000000006" width="435" height="55.349999999999966" rx="8" fill="#edf5f7" stroke="#bdd0d6"/><text x="1130" y="512.75" font-size="21" fill="#122c35" font-weight="700">Continue without reminders</text><text x="55" y="794.05" font-size="20" fill="#526b72">A new session can be enough.</text><text x="575" y="794.05" font-size="20" fill="#526b72">The saved anchor remains useful.</text><text x="1095" y="794.05" font-size="20" fill="#526b72">Notification control is part of returning.</text><text x="55" y="857.05" font-size="16" fill="#526b72">SCHEMATIC TEXT ROWS, NOT LOADING STATES · ORIGINAL PROPOSALS · NOT PRODUCT SCREENSHOTS</text></g></svg>