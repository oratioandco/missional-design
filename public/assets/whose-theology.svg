t-size="20" fill="#526b72">The person picks a tradition and the answers</text><text x="575" y="883.1500000000001" font-size="20" fill="#526b72">follow it.</text><text x="1095" y="856.1500000000001" font-size="20" fill="#526b72">The answer bends to the person’s view.</text><text x="55" y="946.1500000000001" font-size="16" fill="#526b72">SCHEMATIC TEXT ROWS, NOT LOADING STATES · ORIGINAL PROPOSALS · NOT PRODUCT SCREENSHOTS</text></g></svg></svg>