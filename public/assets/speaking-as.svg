<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1610 2958" role="img" aria-label="AI personas and roles"><svg y="0" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1610 995" role="img" aria-labelledby="title-0 desc-0"><title id="title-0">AI personas and roles</title><desc id="desc-0">3 English interface examples. From answers with no speaker, through a guide, a friend and a church’s teaching, to a pastor, a saint and Christ himself: decide whose voice an AI in a faith app speaks in, what authority that voice borrows, and what it says when someone asks who it really is.</desc><rect width="1610" height="995" fill="#f6f9fa"/><g font-family="Arial, sans-serif"><text x="55" y="46" font-size="18" fill="#526b72" font-weight="700">BIBLE AND FAITH APP DESIGN PATTERNS</text><text x="55" y="110" font-size="40" fill="#122c35" font-weight="700">AI personas and roles</text><text x="55" y="159.0" font-size="23" fill="#526b72">From answers with no speaker, through a guide, a friend and a church’s teaching, to a pastor, a saint and Christ himself:</text><text x="55" y="190.05" font-size="23" fill="#526b72">decide whose voice an AI in a faith app speaks in, what authority that voice borrows, and what it says when someone asks</text><text x="55" y="221.10000000000002" font-size="23" fill="#526b72">who it really is.</text><rect x="55" y="329.15000000000003" width="475" height="485.0" rx="20" fill="#fff" stroke="#708892" stroke-width="2"/><text x="55" y="287.15000000000003" font-size="23" fill="#122c35" font-weight="700">A · No speaker</text><text x="75" y="364.15000000000003" font-size="15" fill="#526b72">CONVERSATION · EXAMPLE</text><rect x="120" y="399.15000000000003" width="390" height="48" rx="10" fill="#edf0f3" stroke="#bdd0d6"/><text x="135" y="424.15000000000003" font-size="16" fill="#122c35">Earlier message</text><text x="75" y="489.15000000000003" font-size="26" fill="#122c35" font-weight="700">Passages on confession and</text><text x="75" y="524.25" font-size="26" fill="#122c35" font-weight="700">forgiveness</text><text x="75" y="567.35" font-size="17" fill="#526b72">Summary · generated with AI</text><rect x="575" y="329.15000000000003" width="475" height="485.0" rx="20" fill="#fff" stroke="#708892" stroke-width="2"/><text x="575" y="287.15000000000003" font-size="23" fill="#122c35" font-weight="700">B · A guide</text><text x="595" y="364.15000000000003" font-size="15" fill="#526b72">CONVERSATION · EXAMPLE</text><rect x="640" y="399.15000000000003" width="390" height="48" rx="10" fill="#edf0f3" stroke="#bdd0d6"/><text x="655" y="424.15000000000003" font-size="16" fill="#122c35">Earlier message</text><text x="595" y="480.15000000000003" font-size="17" fill="#526b72">Bible guide · AI</text><text x="595" y="524.1" font-size="21" fill="#122c35">I can show you what Scripture says…</text><rect x="1095" y="329.15000000000003" width="475" height="485.0" rx="20" fill="#fff" stroke="#708892" stroke-width="2"/><text x="1095" y="287.15000000000003" font-size="23" fill="#122c35" font-weight="700">C · A friend</text><text x="1115" y="364.15000000000003" font-size="15" fill="#526b72">CONVERSATION · EXAMPLE</text><rect x="1160" y="399.15000000000003" width="390" height="48" rx="10" fill="#edf0f3" stroke="#bdd0d6"/><text x="1175" y="424.15000000000003" font-size="16" fill="#122c35">Earlier message</text><text x="1115" y="480.15000000000003" font-size="17" fill="#526b72">Sam · your Bible friend</text><text x="1115" y="524.1" font-size="21" fill="#122c35">Of course God forgives you!</text><text x="55" y="856.1500000000001" font-size="20" fill="#526b72">Scripture and named sources speak; no “I”.</text><text x="575" y="856.1500000000001" font-size="20" fill="#526b72">Explains, asks and points to people; says</text><text x="575" y="883.1500000000001" font-size="20" fill="#526b72">what it is.</text><text x="1095" y="856.1500000000001" font-size="20" fill="#526b72">A casual, warm voice that reassures.</text><text x="55" y="946.1500000000001" font-size="16" fill="#526b72">SCHEMATIC TEXT ROWS, NOT LOADING STATES · ORIGINAL PROPOSALS · NOT PRODUCT SCREENSHOTS</text></g></svg><svg y="995" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1610 995" role="img" aria-labelledby="title-3 desc-3"><title id="title-3">AI personas and roles</title><desc id="desc-3">3 English interface examples. From answers with no speaker, through a guide, a friend and a church’s teaching, to a pastor, a saint and Christ himself: decide whose voice an AI in a faith app speaks in, what authority that voice borrows, and what it says when someone asks who it really is.</desc><rect width="1610" height="995" fill="#f6f9fa"/><g font-family="Arial, sans-serif"><text x="55" y="46" font-size="18" fill="#526b72" font-weight="700">BIBLE AND FAITH APP DESIGN PATTERNS</text><text x="55" y="110" font-size="40" fill="#122c35" font-weight="700">AI personas and roles</text><text x="55" y="159.0" font-size="23" fill="#526b72">From answers with no speaker, through a guide, a friend and a church’s teaching, to a pastor, a saint and Christ himself:</text><text x="55" y="190.05" font-size="23" fill="#526b72">decide whose voice an AI in a faith app speaks in, what authority that voice borrows, and what it says when someone asks</text><text x="55" y="221.10000000000002" font-size="23" fill="#526b72">who it really is.</text><rect x="55" y="329.15000000000003" width="475" height="485.0" rx="20" fill="#fff" stroke="#708892" stroke-width="2"/><text x="55" y="287.15000000000003" font-size="23" fill="#122c35" font-weight="700">D · A church’s teaching</text><text x="75" y="364.15000000000003" font-size="15" fill="#526b72">CONVERSATION · EXAMPLE</text><rect x="120" y="399.15000000000003" width="390" height="48" rx="10" fill="#edf0f3" stroke="#bdd0d6"/><text x="135" y="424.15000000000003" font-size="16" fill="#122c35">Earlier message</text><text x="75" y="480.15000000000003" font-size="17" fill="#526b72">St Luke’s · answers from our teaching</text><text x="75" y="524.1" font-size="21" fill="#122c35">Our church teaches…</text><rect x="575" y="329.15000000000003" width="475" height="485.0" rx="20" fill="#fff" stroke="#708892" stroke-width="2"/><text x="575" y="287.15000000000003" font-size="23" fill="#122c35" font-weight="700">E · A pastor or priest</text><text x="595" y="364.15000000000003" font-size="15" fill="#526b72">CONVERSATION · EXAMPLE</text><rect x="640" y="399.15000000000003" width="390" height="48" rx="10" fill="#edf0f3" stroke="#bdd0d6"/><text x="655" y="424.15000000000003" font-size="16" fill="#122c35">Earlier message</text><text x="595" y="480.15000000000003" font-size="17" fill="#526b72">Pastor Dan · AI</text><text x="595" y="524.1" font-size="21" fill="#122c35">As your pastor: you are forgiven.</text><rect x="1095" y="329.15000000000003" width="475" height="485.0" rx="20" fill="#fff" stroke="#708892" stroke-width="2"/><text x="1095" y="287.15000000000003" font-size="23" fill="#122c35" font-weight="700">F · A saint or figure</text><text x="1115" y="364.15000000000003" font-size="15" fill="#526b72">CONVERSATION · EXAMPLE</text><rect x="1160" y="399.15000000000003" width="390" height="48" rx="10" fill="#edf0f3" stroke="#bdd0d6"/><text x="1175" y="424.15000000000003" font-size="16" fill="#122c35">Earlier message</text><text x="1115" y="480.15000000000003" font-size="17" fill="#526b72">Peter · AI character</text><text x="1115" y="524.1" font-size="21" fill="#122c35">I denied him three times…</text><text x="55" y="856.1500000000001" font-size="20" fill="#526b72">Answers from one tradition, owned and</text><text x="55" y="883.1500000000001" font-size="20" fill="#526b72">reviewed by it.</text><text x="575" y="856.1500000000001" font-size="20" fill="#526b72">A minister’s title, and what goes with it.</text><text x="1095" y="856.1500000000001" font-size="20" fill="#526b72">Peter, Mary or Moses, speaking in the first</text><text x="1095" y="883.1500000000001" font-size="20" fill="#526b72">person.</text><text x="55" y="946.1500000000001" font-size="16" fill="#526b72">SCHEMATIC TEXT ROWS, NOT LOADING STATES · ORIGINAL PROPOSALS · NOT PRODUCT SCREENSHOTS</text></g></svg><svg y="1990" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1610 968" role="img" aria-labelledby="title-6 desc-6"><title id="title-6">AI personas and roles</title><desc id="desc-6">1 English interface examples. From answers with no speaker, through a guide, a friend and a church’s teaching, to a pastor, a saint and Christ himself: decide whose voice an AI in a faith app speaks in, what authority that voice borrows, and what it says when someone asks who it really is.</desc><rect width="1610" height="968" fill="#f6f9fa"/><g font-family="Arial, sans-serif"><text x="55" y="46" font-size="18" fill="#526b72" font-weight="700">BIBLE AND FAITH APP DESIGN PATTERNS</text><text x="55" y="110" font-size="40" fill="#122c35" font-weight="700">AI personas and roles</text><text x="55" y="159.0" font-size="23" fill="#526b72">From answers with no speaker, through a guide, a friend and a church’s teaching, to a pastor, a saint and Christ himself:</text><text x="55" y="190.05" font-size="23" fill="#526b72">decide whose voice an AI in a faith app speaks in, what authority that voice borrows, and what it says when someone asks</text><text x="55" y="221.10000000000002" font-size="23" fill="#526b72">who it really is.</text><rect x="55" y="329.15000000000003" width="475" height="485.0" rx="20" fill="#fff" stroke="#708892" stroke-width="2"/><text x="55" y="287.15000000000003" font-size="23" fill="#122c35" font-weight="700">G · Christ or God</text><text x="75" y="364.15000000000003" font-size="15" fill="#526b72">CONVERSATION · EXAMPLE</text><rect x="120" y="399.15000000000003" width="390" height="48" rx="10" fill="#edf0f3" stroke="#bdd0d6"/><text x="135" y="424.15000000000003" font-size="16" fill="#122c35">Earlier message</text><text x="75" y="480.15000000000003" font-size="17" fill="#526b72">Jesus · AI character</text><text x="75" y="524.1" font-size="21" fill="#122c35">My child, I forgive you.</text><text x="55" y="856.1500000000001" font-size="20" fill="#526b72">Generated words in God’s own voice.</text><text x="55" y="919.1500000000001" font-size="16" fill="#526b72">SCHEMATIC TEXT ROWS, NOT LOADING STATES · ORIGINAL PROPOSALS · NOT PRODUCT SCREENSHOTS</text></g></svg></svg>