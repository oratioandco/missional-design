<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1610 1990" role="img" aria-label="Children and AI" data-illustration-theme="light"><svg y="0" viewBox="0 0 1610 995" role="img" aria-labelledby="title-0 desc-0"><title id="title-0">Children and AI</title><desc id="desc-0">3 English interface examples. From no AI for children, through an assistant for the grown-ups who teach them, asking together, and written answers with no generation, to a filtered chat for children and an open companion rated for all ages: decide whether a child meets an AI at all, who is beside them, and what happens when a child asks it to be their friend or says they are scared.</desc><rect width="1610" height="995" fill="#f6f9fa" /><g font-family="Arial, sans-serif"><text x="55" y="46" font-size="18" fill="#486078" font-weight="700">BIBLE AND FAITH APP DESIGN PATTERNS</text><text x="55" y="110" font-size="40" fill="#102c47" font-weight="700">Children and AI</text><text x="55" y="159.0" font-size="23" fill="#486078">From no AI for children, through an assistant for the grown-ups who teach them, asking together, and written answers with</text><text x="55" y="190.05" font-size="23" fill="#486078">no generation, to a filtered chat for children and an open companion rated for all ages: decide whether a child meets an</text><text x="55" y="221.10000000000002" font-size="23" fill="#486078">AI at all, who is beside them, and what happens when a child asks it to be their friend or says they are scared.</text><rect x="55" y="329.15000000000003" width="475" height="485.0" rx="20" fill="#ffffff" stroke="#708892" stroke-width="2" /><text x="55" y="287.15000000000003" font-size="23" fill="#102c47" font-weight="700">A · No AI for children</text><text x="75" y="364.15000000000003" font-size="15" fill="#486078">CONVERSATION · EXAMPLE</text><rect x="120" y="399.15000000000003" width="390" height="48" rx="10" fill="#f3f7fa" stroke="#9aafbf" /><text x="135" y="424.15000000000003" font-size="16" fill="#102c47">Earlier message</text><text x="75" y="480.15000000000003" font-size="17" fill="#486078">For reading together</text><text x="75" y="524.1" font-size="21" fill="#102c47">Ask the grown-up who reads with you</text><rect x="575" y="329.15000000000003" width="475" height="485.0" rx="20" fill="#ffffff" stroke="#708892" stroke-width="2" /><text x="575" y="287.15000000000003" font-size="23" fill="#102c47" font-weight="700">B · AI for the grown-ups</text><text x="595" y="364.15000000000003" font-size="15" fill="#486078">CONVERSATION · EXAMPLE</text><rect x="640" y="399.15000000000003" width="390" height="48" rx="10" fill="#f3f7fa" stroke="#9aafbf" /><text x="655" y="424.15000000000003" font-size="16" fill="#102c47">Earlier message</text><text x="595" y="489.15000000000003" font-size="26" fill="#102c47" font-weight="700">Help me answer my child</text><text x="595" y="536.25" font-size="21" fill="#102c47">“Is Grandpa in heaven?”</text><rect x="1095" y="329.15000000000003" width="475" height="485.0" rx="20" fill="#ffffff" stroke="#708892" stroke-width="2" /><text x="1095" y="287.15000000000003" font-size="23" fill="#102c47" font-weight="700">C · Ask together</text><text x="1115" y="364.15000000000003" font-size="15" fill="#486078">CONVERSATION · EXAMPLE</text><rect x="1160" y="399.15000000000003" width="390" height="48" rx="10" fill="#f3f7fa" stroke="#9aafbf" /><text x="1175" y="424.15000000000003" font-size="16" fill="#102c47">Earlier message</text><text x="1115" y="480.15000000000003" font-size="17" fill="#486078">Asking together</text><text x="1115" y="524.1" font-size="21" fill="#102c47">Something to wonder about together</text><text x="55" y="856.1500000000001" font-size="20" fill="#486078">Stories and prayers, and “ask a grown-up”.</text><text x="575" y="856.1500000000001" font-size="20" fill="#486078">Helps a parent or leader prepare an answer.</text><text x="1095" y="856.1500000000001" font-size="20" fill="#486078">A child asks with a grown-up beside them; it</text><text x="1095" y="883.1500000000001" font-size="20" fill="#486078">answers both.</text><text x="55" y="946.1500000000001" font-size="16" fill="#486078">SCHEMATIC TEXT ROWS, NOT LOADING STATES · ORIGINAL PROPOSALS · NOT PRODUCT SCREENSHOTS</text></g></svg><svg y="995" viewBox="0 0 1610 995" role="img" aria-labelledby="title-3 desc-3"><title id="title-3">Children and AI</title><desc id="desc-3">3 English interface examples. From no AI for children, through an assistant for the grown-ups who teach them, asking together, and written answers with no generation, to a filtered chat for children and an open companion rated for all ages: decide whether a child meets an AI at all, who is beside them, and what happens when a child asks it to be their friend or says they are scared.</desc><rect width="1610" height="995" fill="#f6f9fa" /><g font-family="Arial, sans-serif"><text x="55" y="46" font-size="18" fill="#486078" font-weight="700">BIBLE AND FAITH APP DESIGN PATTERNS</text><text x="55" y="110" font-size="40" fill="#102c47" font-weight="700">Children and AI</text><text x="55" y="159.0" font-size="23" fill="#486078">From no AI for children, through an assistant for the grown-ups who teach them, asking together, and written answers with</text><text x="55" y="190.05" font-size="23" fill="#486078">no generation, to a filtered chat for children and an open companion rated for all ages: decide whether a child meets an</text><text x="55" y="221.10000000000002" font-size="23" fill="#486078">AI at all, who is beside them, and what happens when a child asks it to be their friend or says they are scared.</text><rect x="55" y="329.15000000000003" width="475" height="485.0" rx="20" fill="#ffffff" stroke="#708892" stroke-width="2" /><text x="55" y="287.15000000000003" font-size="23" fill="#102c47" font-weight="700">D · Written answers</text><text x="75" y="364.15000000000003" font-size="15" fill="#486078">CONVERSATION · EXAMPLE</text><rect x="120" y="399.15000000000003" width="390" height="48" rx="10" fill="#f3f7fa" stroke="#9aafbf" /><text x="135" y="424.15000000000003" font-size="16" fill="#102c47">Earlier message</text><text x="75" y="489.15000000000003" font-size="26" fill="#102c47" font-weight="700">Questions kids ask</text><text x="75" y="536.25" font-size="21" fill="#102c47">What is heaven like?</text><rect x="575" y="329.15000000000003" width="475" height="485.0" rx="20" fill="#ffffff" stroke="#708892" stroke-width="2" /><text x="575" y="287.15000000000003" font-size="23" fill="#102c47" font-weight="700">E · A filtered chat for children</text><text x="595" y="364.15000000000003" font-size="15" fill="#486078">CONVERSATION · EXAMPLE</text><rect x="640" y="399.15000000000003" width="390" height="48" rx="10" fill="#f3f7fa" stroke="#9aafbf" /><text x="655" y="424.15000000000003" font-size="16" fill="#102c47">Earlier message</text><text x="595" y="489.15000000000003" font-size="26" fill="#102c47" font-weight="700">Ask your Bible tutor</text><text x="595" y="536.25" font-size="21" fill="#102c47">Your parents can see this chat</text><rect x="1095" y="329.15000000000003" width="475" height="485.0" rx="20" fill="#ffffff" stroke="#708892" stroke-width="2" /><text x="1095" y="287.15000000000003" font-size="23" fill="#102c47" font-weight="700">F · An open companion</text><text x="1115" y="364.15000000000003" font-size="15" fill="#486078">CONVERSATION · EXAMPLE</text><rect x="1160" y="399.15000000000003" width="390" height="48" rx="10" fill="#f3f7fa" stroke="#9aafbf" /><text x="1175" y="424.15000000000003" font-size="16" fill="#102c47">Earlier message</text><text x="1115" y="489.15000000000003" font-size="26" fill="#102c47" font-weight="700">Your Bible bestie</text><text x="1115" y="536.25" font-size="21" fill="#102c47">Rated 4+ · Unlimited chat</text><text x="55" y="856.1500000000001" font-size="20" fill="#486078">Questions answered by people, no generation.</text><text x="575" y="856.1500000000001" font-size="20" fill="#486078">Generated answers with filters and a parent</text><text x="575" y="883.1500000000001" font-size="20" fill="#486078">dashboard.</text><text x="1095" y="856.1500000000001" font-size="20" fill="#486078">A friend who chats about anything, rated for</text><text x="1095" y="883.1500000000001" font-size="20" fill="#486078">all ages.</text><text x="55" y="946.1500000000001" font-size="16" fill="#486078">SCHEMATIC TEXT ROWS, NOT LOADING STATES · ORIGINAL PROPOSALS · NOT PRODUCT SCREENSHOTS</text></g></svg></svg>