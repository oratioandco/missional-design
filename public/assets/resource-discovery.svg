<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1599" role="img" aria-labelledby="title desc"><title id="title">How visible should extra resources be?</title><desc id="desc">3 annotated interface examples with use cases and tradeoffs. Scripture samples are identified by edition.</desc><rect width="1200" height="1599" fill="#f6f5f2"/><g font-family="Arial, sans-serif"><text x="40" y="65" font-size="30" fill="#17202a" font-weight="700">How visible should extra resources be?</text><text x="40" y="116.5" font-size="18" fill="#17202a">Compare inline cards, small markers and resources revealed on demand.</text><text x="40" y="181.6" font-size="23" fill="#17202a" font-weight="700">A · Inline resource card</text><rect x="40" y="209.95" width="510" height="325.4500000000001" rx="6" fill="white" stroke="#8a959f"/><text x="62" y="247.95" font-size="18" fill="#17202a" font-weight="700">Psalm 23 · BSB</text><text x="62" y="292.05" font-size="12" fill="#17202a">1</text><text x="90" y="299.05" font-size="19" fill="#17202a">The LORD is my shepherd; I shall not want.</text><rect x="62" y="321.6" width="466" height="80.40000000000003" rx="6" fill="#fff" stroke="#b8c0c8"/><text x="76" y="353.6" font-size="18" fill="#17202a" font-weight="700">Related reflection</text><text x="76" y="381.70000000000005" font-size="14" fill="#17202a">Example author · Supplementary content</text><text x="62" y="432.00000000000006" font-size="14" fill="#43516a">Open reflection  ·  Hide resources</text><text x="62" y="466.30000000000007" font-size="12" fill="#17202a">2</text><text x="90" y="473.30000000000007" font-size="19" fill="#17202a">He makes me lie down in green pastures; He</text><text x="90" y="500.8500000000001" font-size="19" fill="#17202a">leads me beside quiet waters.</text><path d="M64 535.4000000000001v12 q0 8 8 8 h16 q8 0 8 8 v8" fill="none" stroke="#000462" stroke-width="1.5"/><circle cx="64" cy="535.4000000000001" r="2.5" fill="#000462"/><text x="40" y="596.4000000000001" font-size="17" fill="#17202a">A supplementary card interrupts the reading surface.</text><text x="40" y="621.0500000000001" font-size="17" fill="#17202a">Identify it as interpretation and make it hideable.</text><text x="40" y="660.7" font-size="16" fill="#17202a">Use when: A chosen study mode makes supplementary teaching</text><text x="40" y="683.9000000000001" font-size="16" fill="#17202a">part of the task</text><text x="40" y="719.1000000000001" font-size="16" fill="#17202a">Consider: High discoverability also means more interruption</text><text x="40" y="742.3000000000002" font-size="16" fill="#17202a">and visual authority.</text><text x="620" y="181.6" font-size="23" fill="#17202a" font-weight="700">B · Small resource marker</text><rect x="620" y="209.95" width="510" height="366.3500000000001" rx="6" fill="white" stroke="#8a959f"/><text x="642" y="247.95" font-size="18" fill="#17202a" font-weight="700">Psalm 23 · BSB</text><text x="642" y="292.05" font-size="12" fill="#17202a">1</text><text x="670" y="299.05" font-size="19" fill="#17202a">The LORD is my shepherd; I shall not want.</text><text x="642" y="333.6" font-size="12" fill="#17202a">2</text><text x="670" y="340.6" font-size="19" fill="#17202a">He makes me lie down in green pastures; He</text><text x="670" y="368.15000000000003" font-size="19" fill="#17202a">leads me beside quiet waters.</text><text x="642" y="402.70000000000005" font-size="12" fill="#17202a">3</text><text x="670" y="409.70000000000005" font-size="19" fill="#17202a">He restores my soul; He guides me in the</text><text x="670" y="437.25000000000006" font-size="19" fill="#17202a">paths of righteousness for the sake of His</text><text x="670" y="464.80000000000007" font-size="19" fill="#17202a">name.</text><text x="642" y="504.3500000000001" font-size="17" fill="#17202a">Verse 2 · 3 resources</text><text x="642" y="542.0000000000001" font-size="14" fill="#43516a">The marker opens a labelled resource list.</text><path d="M644 576.3000000000001v12 q0 8 8 8 h16 q8 0 8 8 v8" fill="none" stroke="#000462" stroke-width="1.5"/><circle cx="644" cy="576.3000000000001" r="2.5" fill="#000462"/><text x="620" y="637.3000000000001" font-size="17" fill="#17202a">A small marker keeps resources discoverable without</text><text x="620" y="661.95" font-size="17" fill="#17202a">placing the resource itself in the text.</text><text x="620" y="701.6" font-size="16" fill="#17202a">Use when: Continuous reading is primary but resources should</text><text x="620" y="724.8000000000001" font-size="16" fill="#17202a">remain discoverable</text><text x="620" y="760.0000000000001" font-size="16" fill="#17202a">Consider: Icons need meaning, adequate targets and a way to</text><text x="620" y="783.2000000000002" font-size="16" fill="#17202a">distinguish resource types.</text><text x="40" y="869.4000000000002" font-size="23" fill="#17202a" font-weight="700">C · Reveal when requested</text><rect x="40" y="897.7500000000002" width="510" height="325.6999999999998" rx="6" fill="white" stroke="#8a959f"/><text x="62" y="935.7500000000002" font-size="18" fill="#17202a" font-weight="700">Psalm 23 · BSB</text><text x="62" y="979.8500000000003" font-size="12" fill="#17202a">1</text><text x="90" y="986.8500000000003" font-size="19" fill="#17202a">The LORD is my shepherd; I shall not want.</text><text x="62" y="1021.4000000000002" font-size="12" fill="#17202a">2</text><text x="90" y="1028.4" font-size="19" fill="#17202a">He makes me lie down in green pastures; He</text><text x="90" y="1055.9500000000003" font-size="19" fill="#17202a">leads me beside quiet waters.</text><text x="62" y="1090.5000000000002" font-size="12" fill="#17202a">3</text><text x="90" y="1097.5000000000002" font-size="19" fill="#17202a">He restores my soul; He guides me in the</text><text x="90" y="1125.0500000000002" font-size="19" fill="#17202a">paths of righteousness for the sake of His</text><text x="90" y="1152.6000000000001" font-size="19" fill="#17202a">name.</text><text x="62" y="1189.15" font-size="14" fill="#43516a">Select a verse  ·  Passage resources</text><path d="M64 1223.45v12 q0 8 8 8 h16 q8 0 8 8 v8" fill="none" stroke="#000462" stroke-width="1.5"/><circle cx="64" cy="1223.45" r="2.5" fill="#000462"/><text x="40" y="1284.45" font-size="17" fill="#17202a">A quiet default shifts discovery to selection or an</text><text x="40" y="1309.1000000000001" font-size="17" fill="#17202a">explicit resources action.</text><text x="40" y="1348.7500000000002" font-size="16" fill="#17202a">Use when: The person prefers an uncluttered reading surface</text><text x="40" y="1383.9500000000003" font-size="16" fill="#17202a">Consider: Selection or tap must not be the only way to</text><text x="40" y="1407.1500000000003" font-size="16" fill="#17202a">discover the feature.</text><text x="40" y="1485.3500000000004" font-size="15" fill="#17202a">Original illustrative interfaces · Static controls · Any Scripture samples identify their edition. Sample catalogue and resource details are</text><text x="40" y="1507.1000000000004" font-size="15" fill="#17202a">illustrative.</text><text x="40" y="1562.8500000000004" font-size="14" fill="#17202a">patterns.missional.design/patterns/resource-discovery/</text></g></svg>