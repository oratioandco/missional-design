<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1610 933" role="img" aria-labelledby="title desc" data-illustration-theme="light"><title id="title">A flexible reading rhythm</title><desc id="desc">3 English interface examples. Help someone choose a reading rhythm—and adjust it when life changes.</desc><rect width="1610" height="933" fill="#f6f9fa" /><g font-family="Arial, sans-serif"><text x="55" y="46" font-size="18" fill="#486078" font-weight="700">BIBLE AND FAITH APP DESIGN PATTERNS</text><text x="55" y="110" font-size="40" fill="#102c47" font-weight="700">A flexible reading rhythm</text><text x="55" y="159.0" font-size="23" fill="#486078">Help someone choose a reading rhythm—and adjust it when life changes.</text><rect x="55" y="267.05" width="475" height="485.0" rx="20" fill="#ffffff" stroke="#708892" stroke-width="2" /><text x="55" y="225.05" font-size="23" fill="#102c47" font-weight="700">A · Choose a rhythm</text><text x="75" y="302.05" font-size="15" fill="#486078">PRACTICE · EXAMPLE</text><rect x="75" y="337.05" width="435" height="55.35000000000002" rx="8" fill="#edf5f7" stroke="#9aafbf" /><text x="90" y="370.05" font-size="21" fill="#102c47" font-weight="700">Read on chosen days</text><rect x="75" y="408.40000000000003" width="435" height="55.35000000000002" rx="8" fill="#edf5f7" stroke="#9aafbf" /><text x="90" y="441.40000000000003" font-size="21" fill="#102c47" font-weight="700">Continue one session at a time</text><rect x="75" y="479.75000000000006" width="435" height="55.349999999999966" rx="8" fill="#edf5f7" stroke="#9aafbf" /><text x="90" y="512.75" font-size="21" fill="#102c47" font-weight="700">Set my own pace</text><rect x="575" y="267.05" width="475" height="485.0" rx="20" fill="#ffffff" stroke="#708892" stroke-width="2" /><text x="575" y="225.05" font-size="23" fill="#102c47" font-weight="700">B · Pause</text><text x="595" y="302.05" font-size="15" fill="#486078">PRACTICE · EXAMPLE</text><rect x="595" y="337.05" width="435" height="86.65000000000003" rx="8" fill="#ffffff" stroke="#9aafbf" /><text x="610" y="370.05" font-size="21" fill="#102c47" font-weight="700">Pause this plan</text><text x="610" y="402.40000000000003" font-size="18" fill="#486078">Completed sessions remain saved.</text><rect x="595" y="439.70000000000005" width="435" height="55.35000000000002" rx="8" fill="#edf5f7" stroke="#9aafbf" /><text x="610" y="472.70000000000005" font-size="21" fill="#102c47" font-weight="700">Pause until I return</text><rect x="595" y="511.05000000000007" width="435" height="55.35000000000002" rx="8" fill="#edf5f7" stroke="#9aafbf" /><text x="610" y="544.0500000000001" font-size="21" fill="#102c47" font-weight="700">Choose a return date</text><rect x="1095" y="267.05" width="475" height="485.0" rx="20" fill="#ffffff" stroke="#708892" stroke-width="2" /><text x="1095" y="225.05" font-size="23" fill="#102c47" font-weight="700">C · Reschedule</text><text x="1115" y="302.05" font-size="15" fill="#486078">PRACTICE · EXAMPLE</text><rect x="1115" y="337.05" width="435" height="86.65000000000003" rx="8" fill="#ffffff" stroke="#9aafbf" /><text x="1130" y="370.05" font-size="21" fill="#102c47" font-weight="700">New rhythm</text><text x="1130" y="402.40000000000003" font-size="18" fill="#486078">Two sessions each week.</text><rect x="1115" y="439.70000000000005" width="435" height="55.35000000000002" rx="8" fill="#edf5f7" stroke="#9aafbf" /><text x="1130" y="472.70000000000005" font-size="21" fill="#102c47" font-weight="700">Preview updated schedule</text><rect x="1115" y="511.05000000000007" width="435" height="55.35000000000002" rx="8" fill="#edf5f7" stroke="#9aafbf" /><text x="1130" y="544.0500000000001" font-size="21" fill="#102c47" font-weight="700">Keep existing progress</text><text x="55" y="794.05" font-size="20" fill="#486078">Daily and sequential plans are distinct</text><text x="55" y="821.05" font-size="20" fill="#486078">options.</text><text x="575" y="794.05" font-size="20" fill="#486078">A pause has clear effects.</text><text x="1095" y="794.05" font-size="20" fill="#486078">Upcoming work moves without creating a debt.</text><text x="55" y="884.05" font-size="16" fill="#486078">SCHEMATIC TEXT ROWS, NOT LOADING STATES · ORIGINAL PROPOSALS · NOT PRODUCT SCREENSHOTS</text></g></svg>