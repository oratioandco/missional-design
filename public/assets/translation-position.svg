" stroke="#bdd0d6"/><text x="610" y="642.35" font-size="21" fill="#122c35" font-weight="700">Translation B · Mark 1:5</text><text x="610" y="674.7" font-size="18" fill="#526b72">Reading anchor restored.</text><rect x="595" y="712.0" width="435" height="55.35000000000002" rx="8" fill="#edf5f7" stroke="#bdd0d6"/><text x="610" y="745.0" font-size="21" fill="#122c35" font-weight="700">Return to spoken verse</text><rect x="1095" y="267.05" width="475" height="646.1000000000001" rx="20" fill="#fff" stroke="#708892" stroke-width="2"/><text x="1095" y="225.05" font-size="23" fill="#122c35" font-weight="700">C · Mapping or audio differs</text><text x="1115" y="302.05" font-size="15" fill="#526b72">BIBLE READER · EXAMPLE</text><rect x="1115" y="337.05" width="435" height="145" rx="10" fill="#fff" stroke="#aab2bd"/><text x="1127" y="360.05" font-size="14" fill="#122c35" font-weight="700">Passage context · Schematic text</text><text x="1125" y="391.95" font-size="12" fill="#667085">8</text><rect x="1147" y="384.95" width="362.70000000000005" height="4" fill="#c3c8ce"/><rect x="1147" y="394.95" width="280.8" height="4" fill="#c3c8ce"/><text x="1125" y="419.95" font-size="12" fill="#667085">9</text><rect x="1147" y="412.95" width="362.70000000000005" height="4" fill="#c3c8ce"/><rect x="1147" y="422.95" width="280.8" height="4" fill="#c3c8ce"/><text x="1125" y="447.95" font-size="12" fill="#667085">10</text><rect x="1147" y="440.95" width="362.70000000000005" height="4" fill="#c3c8ce"/><rect x="1147" y="450.95" width="280.8" height="4" fill="#c3c8ce"/><rect x="1115" y="498.05" width="435" height="83.69999999999999" rx="8" fill="#edf5f7" stroke="#bdd0d6"/><text x="1130" y="531.05" font-size="21" fill="#122c35" font-weight="700">The selected verse has different</text><text x="1130" y="559.4" font-size="21" fill="#122c35" font-weight="700">numbering.</text><rect x="1115" y="597.75" width="435" height="55.35000000000002" rx="8" fill="#edf5f7" stroke="#bdd0d6"/><text x="1130" y="630.75" font-size="21" fill="#122c35" font-weight="700">Open the mapped passage</text><rect x="1115" y="669.1" width="435" height="55.35000000000002" rx="8" fill="#edf5f7" stroke="#bdd0d6"/><text x="1130" y="702.1" font-size="21" fill="#122c35" font-weight="700">This recording uses Translation A.</text><rect x="1115" y="740.45" width="435" height="55.35000000000002" rx="8" fill="#edf5f7" stroke="#bdd0d6"/><text x="1130" y="773.45" font-size="21" fill="#122c35" font-weight="700">Keep audio without word cues</text><rect x="1115" y="811.8000000000001" width="435" height="55.35000000000002" rx="8" fill="#edf5f7" stroke="#bdd0d6"/><text x="1130" y="844.8000000000001" font-size="21" fill="#122c35" font-weight="700">Choose matching audio</text><text x="55" y="955.1500000000001" font-size="20" fill="#526b72">A semantic anchor survives a different</text><text x="55" y="982.1500000000001" font-size="20" fill="#526b72">paragraph height.</text><text x="575" y="955.1500000000001" font-size="20" fill="#526b72">Preserve the visible reading place rather</text><text x="575" y="982.1500000000001" font-size="20" fill="#526b72">than the audio position.</text><text x="1095" y="955.1500000000001" font-size="20" fill="#526b72">Unavailable equivalence has an explicit</text><text x="1095" y="982.1500000000001" font-size="20" fill="#526b72">recovery.</text><text x="55" y="1045.15" font-size="16" fill="#526b72">SCHEMATIC TEXT ROWS, NOT LOADING STATES · ORIGINAL PROPOSALS · NOT PRODUCT SCREENSHOTS</text></g></svg>