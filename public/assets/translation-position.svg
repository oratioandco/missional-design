<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1610 1094" role="img" aria-labelledby="title desc"><title id="title">Change translation without losing the passage</title><desc id="desc">3 English interface examples. Preserve a semantic reading anchor rather than a pixel offset.</desc><rect width="1610" height="1094" fill="#f6f9fa"/><g font-family="Arial, sans-serif"><text x="55" y="46" font-size="18" fill="#526b72" font-weight="700">BIBLE AND FAITH APP DESIGN PATTERNS</text><text x="55" y="110" font-size="40" fill="#122c35" font-weight="700">Change translation without losing the passage</text><text x="55" y="159.0" font-size="23" fill="#526b72">Preserve a semantic reading anchor rather than a pixel offset.</text><rect x="55" y="267.05" width="475" height="646.1000000000001" rx="20" fill="#fff" stroke="#708892" stroke-width="2"/><text x="55" y="225.05" font-size="23" fill="#122c35" font-weight="700">A · Selected verse</text><text x="75" y="302.05" font-size="15" fill="#526b72">BIBLE READER · EXAMPLE</text><rect x="75" y="337.05" width="435" height="145" rx="10" fill="#fff" stroke="#aab2bd"/><text x="87" y="360.05" font-size="14" fill="#122c35" font-weight="700">Passage context · Schematic text</text><text x="85" y="391.95" font-size="12" fill="#667085">8</text><rect x="107" y="384.95" width="362.70000000000005" height="4" fill="#c3c8ce"/><rect x="107" y="394.95" width="280.8" height="4" fill="#c3c8ce"/><text x="85" y="419.95" font-size="12" fill="#667085">9</text><rect x="107" y="412.95" width="362.70000000000005" height="4" fill="#c3c8ce"/><rect x="107" y="422.95" width="280.8" height="4" fill="#c3c8ce"/><text x="85" y="447.95" font-size="12" fill="#667085">10</text><rect x="107" y="440.95" width="362.70000000000005" height="4" fill="#c3c8ce"/><rect x="107" y="450.95" width="280.8" height="4" fill="#c3c8ce"/><text x="75" y="515.05" font-size="17" fill="#526b72">Before: Translation A · Mark 1:8</text><rect x="75" y="538.0" width="435" height="70" rx="10" fill="#