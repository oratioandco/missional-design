<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1610 2931" role="img" aria-label="What the assistant talks about" data-illustration-theme="dark"><svg y="0" viewBox="0 0 1610 968" role="img" aria-labelledby="title-0 desc-0"><title id="title-0">What the assistant talks about</title><desc id="desc-0">3 English interface examples. From the passage in front of the reader, through the Bible and Christian faith, everyday life and hard days, to a therapist, a spiritual companion and anything at all: decide what the assistant takes on, say it before the first message, and decide what someone meets when they bring more than it can hold.</desc><rect width="1610" height="968" fill="#f6f9fa" /><g font-family="Arial, sans-serif"><text x="55" y="46" font-size="18" fill="#b9cddd" font-weight="700">BIBLE AND FAITH APP DESIGN PATTERNS</text><text x="55" y="110" font-size="40" fill="#e8f1f7" font-weight="700">What the assistant talks about</text><text x="55" y="159.0" font-size="23" fill="#b9cddd">From the passage in front of the reader, through the Bible and Christian faith, everyday life and hard days, to a</text><text x="55" y="190.05" font-size="23" fill="#b9cddd">therapist, a spiritual companion and anything at all: decide what the assistant takes on, say it before the first message,</text><text x="55" y="221.10000000000002" font-size="23" fill="#b9cddd">and decide what someone meets when they bring more than it can hold.</text><rect x="55" y="329.15000000000003" width="475" height="485.0" rx="20" fill="#162e40" stroke="#708892" stroke-width="2" /><text x="55" y="287.15000000000003" font-size="23" fill="#e8f1f7" font-weight="700">A · The passage in front of you</text><text x="75" y="364.15000000000003" font-size="15" fill="#b9cddd">CONVERSATION · EXAMPLE</text><rect x="120" y="399.15000000000003" width="390" height="48" rx="10" fill="#203b50" stroke="#668399" /><text x="135" y="424.15000000000003" font-size="16" fill="#e8f1f7">Earlier message</text><text x="75" y="480.150000