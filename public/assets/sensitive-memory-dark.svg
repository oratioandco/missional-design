<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1610 933" role="img" aria-labelledby="title desc" data-illustration-theme="dark"><title id="title">Sensitive memory by permission</title><desc id="desc">3 English interface examples. Make persistent memory specific, inspectable and reversible.</desc><rect width="1610" height="933" fill="#f6f9fa" /><g font-family="Arial, sans-serif"><text x="55" y="46" font-size="18" fill="#b9cddd" font-weight="700">BIBLE AND FAITH APP DESIGN PATTERNS</text><text x="55" y="110" font-size="40" fill="#e8f1f7" font-weight="700">Sensitive memory by permission</text><text x="55" y="159.0" font-size="23" fill="#b9cddd">Make persistent memory specific, inspectable and reversible.</text><rect x="55" y="267.05" width="475" height="485.0" rx="20" fill="#162e40" stroke="#708892" stroke-width="2" /><text x="55" y="225.05" font-size="23" fill="#e8f1f7" font-weight="700">A · Continue without saving</text><text x="75" y="302.05" font-size="15" fill="#b9cddd">ASSISTANT · EXAMPLE</text><text x="75" y="354.05" font-size="17" fill="#b9cddd">This conversation</text><rect x="75" y="377.0" width="435" height="83.70000000000005" rx="8" fill="#edf5f7" stroke="#668399" /><text x="90" y="410.0" font-size="21" fill="#e8f1f7" font-weight="700">No optional personal memory has been</text><text x="90" y="438.35" font-size="21" fill="#e8f1f7" font-weight="700">added.</text><rect x="75" y="476.70000000000005" width="435" height="55.35000000000002" rx="8" fill="#edf5f7" stroke="#668399" /><text x="90" y="509.70000000000005" font-size="21" fill="#e8f1f7" font-weight="700">Continue this conversation</text><rect x="575" y="267.05" width="475" height="485.0" rx="20" fill="#162e40" stroke="#708892" stroke-width="2" /><text x="575" y="225.05" font-size="23" fill="#e8f1f7" font-weight="700">B · Review proposed memory</text><text x="595" y="302.05" font-size="15" fill="#b9cddd">ASSISTANT · EXAMPLE</text><rect x="595" y="337.05" width="435" height="86.65000000000003" rx="8" fill="#162e40" stroke="#668399" /><text x="610" y="370.05" font-size="21" fill="#e8f1f7" font-weight="700">Proposed memory</text><text x="610" y="402.40000000000003" font-size="18" fill="#b9cddd">Exact wording and intended use.</text><rect x="595" y="439.70000000000005" width="435" height="55.35000000000002" rx="8" fill="#edf5f7" stroke="#668399" /><text x="610" y="472.70000000000005" font-size="21" fill="#e8f1f7" font-weight="700">Edit before saving</text><rect x="595" y="511.05000000000007" width="435" height="55.35000000000002" rx="8" fill="#edf5f7" stroke="#668399" /><text x="610" y="544.0500000000001" font-size="21" fill="#e8f1f7" font-weight="700">Save this item</text><rect x="595" y="582.4000000000001" width="435" height="55.35000000000002" rx="8" fill="#edf5f7" stroke="#668399" /><text x="610" y="615.4000000000001" font-size="21" fill="#e8f1f7" font-weight="700">Do not save</text><rect x="1095" y="267.05" width="475" height="485.0" rx="20" fill="#162e40" stroke="#708892" stroke-width="2" /><text x="1095" y="225.05" font-size="23" fill="#e8f1f7" font-weight="700">C · Memory library</text><text x="1115" y="302.05" font-size="15" fill="#b9cddd">ASSISTANT · EXAMPLE</text><text x="1115" y="363.05" font-size="26" fill="#e8f1f7" font-weight="700">Saved memories</text><rect x="1115" y="389.15000000000003" width="435" height="86.65000000000003" rx="8" fill="#162e40" stroke="#668399" /><text x="1130" y="422.15000000000003" font-size="21" fill="#e8f1f7" font-weight="700">Saved item</text><text x="1130" y="454.50000000000006" font-size="18" fill="#b9cddd">Wording, purpose and date.</text><rect x="1115" y="491.80000000000007" width="435" height="55.35000000000002" rx="8" fill="#edf5f7" stroke="#668399" /><text x="1130" y="524.8000000000001" font-size="21" fill="#e8f1f7" font-weight="700">Edit this memory</text><rect x="1115" y="563.1500000000001" width="435" height="55.35000000000002" rx="8" fill="#edf5f7" stroke="#668399" /><text x="1130" y="596.1500000000001" font-size="21" fill="#e8f1f7" font-weight="700">Delete this memory</text><text x="55" y="794.05" font-size="20" fill="#b9cddd">The current conversation does not require</text><text x="55" y="821.05" font-size="20" fill="#b9cddd">durable memory.</text><text x="575" y="794.05" font-size="20" fill="#b9cddd">A specific item and purpose can be accepted</text><text x="575" y="821.05" font-size="20" fill="#b9cddd">or declined.</text><text x="1095" y="794.05" font-size="20" fill="#b9cddd">Saved items remain visible and manageable.</text><text x="55" y="884.05" font-size="16" fill="#b9cddd">SCHEMATIC TEXT ROWS, NOT LOADING STATES · ORIGINAL PROPOSALS · NOT PRODUCT SCREENSHOTS</text></g></svg>