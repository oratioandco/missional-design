<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1725" role="img" aria-labelledby="title desc"><title id="title">How do readers move to the next chapter?</title><desc id="desc">4 annotated interface examples with use cases and tradeoffs. Scripture samples are identified by edition.</desc><rect width="1200" height="1725" fill="#f6f5f2"/><g font-family="Arial, sans-serif"><text x="40" y="65" font-size="30" fill="#17202a" font-weight="700">How do readers move to the next chapter?</text><text x="40" y="116.5" font-size="18" fill="#17202a">Compare continuous reading, explicit buttons and a persistent navigation bar.</text><text x="40" y="181.6" font-size="23" fill="#17202a" font-weight="700">A · No persistent arrows</text><rect x="40" y="209.95" width="510" height="325.7000000000001" rx="6" fill="white" stroke="#8a959f"/><text x="62" y="247.95" font-size="18" fill="#17202a" font-weight="700">Psalm 23 · BSB</text><text x="62" y="292.05" font-size="12" fill="#17202a">1</text><text x="90" y="299.05" font-size="19" fill="#17202a">The LORD is my shepherd; I shall not want.</text><text x="62" y="333.6" font-size="12" fill="#17202a">2</text><text x="90" y="340.6" font-size="19" fill="#17202a">He makes me lie down in green pastures; He</text><text x="90" y="368.15000000000003" font-size="19" fill="#17202a">leads me beside quiet waters.</text><text x="62" y="402.70000000000005" font-size="12" fill="#17202a">3</text><text x="90" y="409.70000000000005" font-size="19" fill="#17202a">He restores my soul; He guides me in the</text><text x="90" y="437.25000000000006" font-size="19" fill="#17202a">paths of righteousness for the sake of His</text><text x="90" y="464.80000000000007" font-size="19" fill="#17202a">name.</text><text x="62" y="501.3500000000001" font-size="14" fill="#43516a">Continue reading  ·  Choose a passage</text><path d="M64 535.6500000000001v12 q0 8 8 8 h16 q8 0 8 8 v8" fill="none" stroke="#000462" stroke-width="1.5"/><circle cx="64" cy="535.6500000000001" r="2.5" fill="#000462"/><text x="40" y="596.6500000000001" font-size="17" fill="#17202a">The reading surface can continue without permanent arrow</text><text x="40" y="621.3000000000001" font-size="17" fill="#17202a">controls. Keep a deliberate route to other passages.</text><text x="40" y="660.95" font-size="16" fill="#17202a">Use when: The reader is following extended text</text><text x="40" y="696.1500000000001" font-size="16" fill="#17202a">Consider: Still provide a discoverable direct jump and a</text><text x="40" y="719.3500000000001" font-size="16" fill="#17202a">clear end when content stops.</text><text x="620" y="181.6" font-size="23" fill="#17202a" font-weight="700">B · Previous and next</text><rect x="620" y="209.95" width="510" height="356.6000000000001" rx="6" fill="white" stroke="#8a959f"/><text x="642" y="247.95" font-size="18" fill="#17202a" font-weight="700">Psalm 23 · BSB</text><text x="642" y="292.05" font-size="12" fill="#17202a">1</text><text x="670" y="299.05" font-size="19" fill="#17202a">The LORD is my shepherd; I shall not want.</text><text x="642" y="333.6" font-size="12" fill="#17202a">2</text><text x="670" y="340.6" font-size="19" fill="#17202a">He makes me lie down in green pastures; He</text><text x="670" y="368.15000000000003" font-size="19" fill="#17202a">leads me beside quiet waters.</text><text x="642" y="402.70000000000005" font-size="12" fill="#17202a">3</text><text x="670" y="409.70000000000005" font-size="19" fill="#17202a">He restores my soul; He guides me in the</text><text x="670" y="437.25000000000006" font-size="19" fill="#17202a">paths of righteousness for the sake of His</text><text x="670" y="464.80000000000007" font-size="19" fill="#17202a">name.</text><rect x="642" y="487.3500000000001" width="466" height="51.19999999999999" rx="6" fill="#fff" stroke="#b8c0c8"/><text x="656" y="517.3500000000001" font-size="16" fill="#17202a">Previous · Psalm 22  ·  Next · Psalm 24</text><path d="M644 566.5500000000001v12 q0 8 8 8 h16 q8 0 8 8 v8" fill="none" stroke="#000462" stroke-width="1.5"/><circle cx="644" cy="566.5500000000001" r="2.5" fill="#000462"/><text x="620" y="627.5500000000001" font-size="17" fill="#17202a">Named destinations make the direction explicit. At book</text><text x="620" y="652.2" font-size="17" fill="#17202a">boundaries, name the next book as well.</text><text x="620" y="691.85" font-size="16" fill="#17202a">Use when: The reader opens discrete chapters</text><text x="620" y="727.0500000000001" font-size="16" fill="#17202a">Consider: End-only buttons are less convenient for quick</text><text x="620" y="750.2500000000001" font-size="16" fill="#17202a">hopping midway through a chapter.</text><text x="40" y="836.4500000000002" font-size="23" fill="#17202a" font-weight="700">C · Compact navigation bar</text><rect x="40" y="864.8000000000002" width="510" height="356.5999999999999" rx="6" fill="white" stroke="#8a959f"/><text x="62" y="902.8000000000002" font-size="18" fill="#17202a" font-weight="700">Psalm 23 · BSB</text><text x="62" y="946.9000000000002" font-size="12" fill="#17202a">1</text><text x="90" y="953.9000000000002" font-size="19" fill="#17202a">The LORD is my shepherd; I shall not want.</text><text x="62" y="988.4500000000002" font-size="12" fill="#17202a">2</text><text x="90" y="995.4500000000002" font-size="19" fill="#17202a">He makes me lie down in green pastures; He</text><text x="90" y="1023.0000000000001" font-size="19" fill="#17202a">leads me beside quiet waters.</text><text x="62" y="1057.5500000000002" font-size="12" fill="#17202a">3</text><text x="90" y="1064.5500000000002" font-size="19" fill="#17202a">He restores my soul; He guides me in the</text><text x="90" y="1092.1000000000001" font-size="19" fill="#17202a">paths of righteousness for the sake of His</text><text x="90" y="1119.65" font-size="19" fill="#17202a">name.</text><rect x="62" y="1142.2" width="466" height="51.200000000000045" rx="6" fill="#fff" stroke="#b8c0c8"/><text x="76" y="1172.2" font-size="16" fill="#17202a">Previous  ·  Psalm 23  ·  Next</text><path d="M64 1221.4v12 q0 8 8 8 h16 q8 0 8 8 v8" fill="none" stroke="#000462" stroke-width="1.5"/><circle cx="64" cy="1221.4" r="2.5" fill="#000462"/><text x="40" y="1282.4" font-size="17" fill="#17202a">A compact persistent bar can combine nearby movement and</text><text x="40" y="1307.0500000000002" font-size="17" fill="#17202a">direct access. Reserve space so it does not cover text.</text><text x="40" y="1346.7000000000003" font-size="16" fill="#17202a">Use when: Frequent navigation justifies persistent controls</text><text x="40" y="1381.9000000000003" font-size="16" fill="#17202a">Consider: Respect safe areas and audio controls; avoid</text><text x="40" y="1405.1000000000004" font-size="16" fill="#17202a">covering text or forcing small targets.</text><text x="620" y="836.4500000000002" font-size="23" fill="#17202a" font-weight="700">D · In-context chapter rail</text><rect x="620" y="864.8000000000002" width="510" height="437.2500000000002" rx="6" fill="white" stroke="#8a959f"/><text x="642" y="902.8000000000002" font-size="18" fill="#17202a" font-weight="700">Psalm 23 · BSB</text><text x="642" y="946.9000000000002" font-size="12" fill="#17202a">1</text><text x="670" y="953.9000000000002" font-size="19" fill="#17202a">The LORD is my shepherd; I shall</text><text x="670" y="981.4500000000002" font-size="19" fill="#17202a">not want.</text><text x="642" y="1016.0000000000001" font-size="12" fill="#17202a">2</text><text x="670" y="1023.0000000000001" font-size="19" fill="#17202a">He makes me lie down in green</text><text x="670" y="1050.5500000000002" font-size="19" fill="#17202a">pastures; He leads me beside quiet</text><text x="670" y="1078.1000000000001" font-size="19" fill="#17202a">waters.</text><text x="642" y="1112.65" font-size="12" fill="#17202a">3</text><text x="670" y="1119.65" font-size="19" fill="#17202a">He restores my soul; He guides me</text><text x="670" y="1147.2" font-size="19" fill="#17202a">in the paths of righteousness for</text><text x="670" y="1174.75" font-size="19" fill="#17202a">the sake of His name.</text><text x="1046" y="958.9000000000002" font-size="16" fill="#17202a">21</text><path d="M1036 983.1000000000003h72" stroke="#d7d9dd"/><text x="1046" y="1007.1000000000003" font-size="16" fill="#17202a">22</text><path d="M1036 1031.3000000000002h72" stroke="#d7d9dd"/><rect x="1036" y="1031.3000000000002" width="72" height="62.40000000000009" fill="#edf0fa"/><text x="1046" y="1055.3000000000002" font-size="16" fill="#17202a" font-weight="700">23 ·</text><text x="1046" y="1078.5000000000002" font-size="16" fill="#17202a" font-weight="700">Selected</text><path d="M1036 1102.7000000000003h72" stroke="#d7d9dd"/><text x="1046" y="1126.7000000000003" font-size="16" fill="#17202a">24</text><path d="M1036 1150.9000000000003h72" stroke="#d7d9dd"/><text x="1046" y="1174.9000000000003" font-size="16" fill="#17202a">25</text><path d="M1036 1199.1000000000004h72" stroke="#d7d9dd"/><text x="642" y="1230.1000000000004" font-size="17" fill="#17202a" font-weight="700">Current: Psalm 23</text><text x="642" y="1267.7500000000005" font-size="14" fill="#43516a">All chapters  ·  Close rail</text><path d="M644 1302.0500000000004v12 q0 8 8 8 h16 q8 0 8 8 v8" fill="none" stroke="#000462" stroke-width="1.5"/><circle cx="644" cy="1302.0500000000004" r="2.5" fill="#000462"/><text x="620" y="1363.0500000000004" font-size="17" fill="#17202a">A revealed rail keeps chapter destinations beside the</text><text x="620" y="1387.7000000000005" font-size="17" fill="#17202a">reader. This is a short illustrative excerpt, not all</text><text x="620" y="1412.3500000000006" font-size="17" fill="#17202a">150 Psalms.</text><text x="620" y="1452.0000000000007" font-size="16" fill="#17202a">Use when: Quick jumps within the current book matter</text><text x="620" y="1487.2000000000007" font-size="16" fill="#17202a">Consider: Dense rails need generous targets, clear selected</text><text x="620" y="1510.4000000000008" font-size="16" fill="#17202a">state and a non-gesture alternative; offer another picker</text><text x="620" y="1533.6000000000008" font-size="16" fill="#17202a">for long books.</text><text x="40" y="1611.8000000000009" font-size="15" fill="#17202a">Original illustrative interfaces · Static controls · Any Scripture samples identify their edition. Sample catalogue and resource details are</text><text x="40" y="1633.5500000000009" font-size="15" fill="#17202a">illustrative.</text><text x="40" y="1689.3000000000009" font-size="14" fill="#17202a">patterns.missional.design/patterns/chapter-navigation/</text></g></svg>