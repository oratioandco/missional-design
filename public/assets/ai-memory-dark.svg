e="17" fill="#b9cddd">Saved to memory · Edit · Delete</text><text x="75" y="524.1" font-size="21" fill="#e8f1f7">Remember this too</text><rect x="575" y="329.15000000000003" width="475" height="485.0" rx="20" fill="#162e40" stroke="#708892" stroke-width="2" /><text x="575" y="287.15000000000003" font-size="23" fill="#e8f1f7" font-weight="700">E · A profile it builds</text><text x="595" y="364.15000000000003" font-size="15" fill="#b9cddd">CONVERSATION · EXAMPLE</text><rect x="640" y="399.15000000000003" width="390" height="48" rx="10" fill="#203b50" stroke="#668399" /><text x="655" y="424.15000000000003" font-size="16" fill="#e8f1f7">Earlier message</text><text x="595" y="480.15000000000003" font-size="17" fill="#b9cddd">Inferred from your chats</text><text x="595" y="524.1" font-size="21" fill="#e8f1f7">Life events: job loss</text><text x="55" y="856.1500000000001" font-size="20" fill="#b9cddd">Switched on once; each saved item shown with</text><text x="55" y="883.1500000000001" font-size="20" fill="#b9cddd">Edit and Delete.</text><text x="575" y="856.1500000000001" font-size="20" fill="#b9cddd">Life events, feelings and faith stage</text><text x="575" y="883.1500000000001" font-size="20" fill="#b9cddd">inferred.</text><text x="55" y="946.1500000000001" font-size="16" fill="#b9cddd">SCHEMATIC TEXT ROWS, NOT LOADING STATES · ORIGINAL PROPOSALS · NOT PRODUCT SCREENSHOTS</text></g></svg></svg>