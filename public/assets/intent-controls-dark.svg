<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1610 937" role="img" aria-labelledby="title desc" data-illustration-theme="dark"><title id="title">Intent controls support the prompt</title><desc id="desc">3 English interface examples. Help people express scope through selections and task choices.</desc><rect width="1610" height="937" fill="#f6f9fa" /><g font-family="Arial, sans-serif"><text x="55" y="46" font-size="18" fill="#b9cddd" font-weight="700">BIBLE AND FAITH APP DESIGN PATTERNS</text><text x="55" y="110" font-size="40" fill="#e8f1f7" font-weight="700">Intent controls support the prompt</text><text x="55" y="159.0" font-size="23" fill="#b9cddd">Help people express scope through selections and task choices.</text><rect x="55" y="267.05" width="475" height="489.35000000000014" rx="20" fill="#162e40" stroke="#708892" stroke-width="2" /><text x="55" y="225.05" font-size="23" fill="#e8f1f7" font-weight="700">A · Start from context</text><text x="75" y="302.05" font-size="15" fill="#b9cddd">CONVERSATION · EXAMPLE</text><rect x="120" y="337.05" width="390" height="48" rx="10" fill="#203b50" stroke="#668399" /><text x="135" y="362.05" font-size="16" fill="#e8f1f7">Earlier message</text><text x="75" y="418.05" font-size="17" fill="#b9cddd">Mark 1:1–5 · Translation A</text><rect x="75" y="441.0" width="435" height="55.35000000000002" rx="8" fill="#edf5f7" stroke="#668399" /><text x="90" y="474.0" font-size="21" fill="#e8f1f7" font-weight="700">Explain</text><rect x="75" y="512.35" width="435" height="55.35000000000002" rx="8" fill="#edf5f7" stroke="#668399" /><text x="90" y="545.35" font-size="21" fill="#e8f1f7" font-weight="700">Compare</text><rect x="75" y="583.7" width="435" height="55.35000000000002" rx="8" fill="#edf5f7" stroke="#668399" /><text x="90" y="616.7" font-size="21" fill="#e8f1f7" font-weight="700">Find related sources</text><rect x="75" y="655.0500000000001" width="435" height="55.35000000000002" rx="8" fill="#162e40" stroke="#668399" /><text x="90" y="688.0500000000001" font-size="21" fill="#e8f1f7">My own question</text><rect x="575" y="267.05" width="475" height="489.35000000000014" rx="20" fill="#162e40" stroke="#708892" stroke-width="2" /><text x="575" y="225.05" font-size="23" fill="#e8f1f7" font-weight="700">B · Editable scope</text><text x="595" y="302.05" font-size="15" fill="#b9cddd">CONVERSATION · EXAMPLE</text><rect x="640" y="337.05" width="390" height="48" rx="10" fill="#203b50" stroke="#668399" /><text x="655" y="362.05" font-size="16" fill="#e8f1f7">Earlier message</text><rect x="595" y="401.05" width="435" height="86.65000000000003" rx="8" fill="#162e40" stroke="#668399" /><text x="610" y="434.05" font-size="21" fill="#e8f1f7" font-weight="700">Context</text><text x="610" y="466.40000000000003" font-size="18" fill="#b9cddd">Selected passage and two commentaries.</text><rect x="595" y="503.70000000000005" width="435" height="55.35000000000002" rx="8" fill="#edf5f7" stroke="#668399" /><text x="610" y="536.7" font-size="21" fill="#e8f1f7" font-weight="700">Change source scope</text><rect x="595" y="575.0500000000001" width="435" height="55.35000000000002" rx="8" fill="#162e40" stroke="#668399" /><text x="610" y="608.0500000000001" font-size="21" fill="#e8f1f7">Ask within this context</text><rect x="1095" y="267.05" width="475" height="489.35000000000014" rx="20" fill="#162e40" stroke="#708892" stroke-width="2" /><text x="1095" y="225.05" font-size="23" fill="#e8f1f7" font-weight="700">C · Confirm an assumption</text><text x="1115" y="302.05" font-size="15" fill="#b9cddd">CONVERSATION · EXAMPLE</text><rect x="1160" y="337.05" width="390" height="48" rx="10" fill="#203b50" stroke="#668399" /><text x="1175" y="362.05" font-size="16" fill="#e8f1f7">Earlier message</text><text x="1115" y="422.05" font-size="21" fill="#e8f1f7">Should I use the sources you selected</text><text x="1115" y="450.40000000000003" font-size="21" fill="#e8f1f7">or search more widely?</text><rect x="1115" y="474.75000000000006" width="435" height="55.349999999999966" rx="8" fill="#edf5f7" stroke="#668399" /><text x="1130" y="507.75000000000006" font-size="21" fill="#e8f1f7" font-weight="700">Selected sources only</text><rect x="1115" y="546.1" width="435" height="55.35000000000002" rx="8" fill="#edf5f7" stroke="#668399" /><text x="1130" y="579.1" font-size="21" fill="#e8f1f7" font-weight="700">Search more widely</text><text x="55" y="798.4000000000001" font-size="20" fill="#b9cddd">A selected passage reduces prompt-writing</text><text x="55" y="825.4000000000001" font-size="20" fill="#b9cddd">effort.</text><text x="575" y="798.4000000000001" font-size="20" fill="#b9cddd">The active sources are visible and</text><text x="575" y="825.4000000000001" font-size="20" fill="#b9cddd">removable.</text><text x="1095" y="798.4000000000001" font-size="20" fill="#b9cddd">The product asks only when the choice</text><text x="1095" y="825.4000000000001" font-size="20" fill="#b9cddd">matters.</text><text x="55" y="888.4000000000001" font-size="16" fill="#b9cddd">SCHEMATIC TEXT ROWS, NOT LOADING STATES · ORIGINAL PROPOSALS · NOT PRODUCT SCREENSHOTS</text></g></svg>